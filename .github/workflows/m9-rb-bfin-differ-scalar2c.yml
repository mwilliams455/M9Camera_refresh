name: M9 R/B BFINSCALAR2C Difference Geometry Parity

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-bfin-differ-scalar2c.yml'
      - 'research/bfin/redblue_differ_scalar_exact.py'
      - 'research/bfin/redblue_differ_oracle_geometry.s'
      - 'research/bfin/BFINSCALAR2B_DIFFER_DIRECT_PARITY_FROZEN.json'

permissions:
  contents: read

jobs:
  geometry-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install and build pinned Blackfin toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          curl --fail --location --retry 4 --retry-all-errors -o gdb-17.2.tar.xz https://ftp.gnu.org/gnu/gdb/gdb-17.2.tar.xz
          tar -xf binutils-2.44.tar.xz; tar -xf gdb-17.2.tar.xz
          mkdir binutils-build && cd binutils-build
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-sim >/dev/null
          make -j2 all-binutils all-gas all-ld >/dev/null
          echo "BFIN_AS=$PWD/gas/as-new" >> "$GITHUB_ENV"; echo "BFIN_LD=$PWD/ld/ld-new" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"; mkdir gdb-build && cd gdb-build
          ../gdb-17.2/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gdbserver >/dev/null
          make -j2 all-sim >/dev/null
          SIM=$(find "$PWD" -type f \( -path '*/sim/bfin/run' -o -name 'bfin-elf-run' \) -perm -111 | head -1 || true); test -n "$SIM"; echo "BFIN_SIM=$SIM" >> "$GITHUB_ENV"
      - name: Recover exact Leica differ body
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/bfindiffer2c"; mkdir -p "$ROOT/evidence"
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json"
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass"
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'bfindiffer2c'; d=json.load(open(root/'pass/report.json')); addr=0xffa00008; size=0xb6; expected='5dc7738b5a63f01e69287eaabf9cde39bfde677da489513b490debf27a4878c1'
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py'); m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          for i,_ in enumerate(d.get('bf561_deep',[])):
            try:
              bf0=next((root/'pass'/f'bf561_pair_{i:02d}').rglob('bf0.bin')); _,blocks=m.parse_ldr(bf0); body=m.read_overlay(blocks,addr,size)
              if hashlib.sha256(body).hexdigest()==expected: (root/'ASMRedBlueAndGreenDiffer.bin').write_bytes(body); break
            except Exception: pass
          else: raise SystemExit('canonical differ body not found')
          PY
      - name: Execute multi-row stride corpus and compare scalar
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/bfindiffer2c"; cp research/bfin/redblue_differ_oracle_geometry.s "$ROOT/"
          cat > "$ROOT/oracle.ld" <<'LDS'
          ENTRY(_start)
          SECTIONS {
            . = 0x1000; .text : { *(.text.start) *(.text*) }
            . = 0x4000; .plane0 : { *(.plane0) }
            . = 0x5000; .plane1 : { *(.plane1) }
            . = 0x6000; .threshold : { *(.threshold) }
            . = 0x7000; .output : { *(.output) }
            . = 0x8800; .stack : { *(.stack) }
          }
          LDS
          cd "$ROOT"
          PYTHONPATH="$GITHUB_WORKSPACE/research/bfin" python3 - <<'PY'
          import hashlib,json,os,pathlib,random,re,subprocess
          from redblue_differ_scalar_exact import differ_sample
          configs=[(1,1,1,2),(2,2,3,0),(3,2,5,1),(4,3,6,2),(5,4,8,4),(7,3,10,7)]
          report={'schema':'m9.bfinscalar2c.differ-geometry-parity.v1','routine_sha256':'5dc7738b5a63f01e69287eaabf9cde39bfde677da489513b490debf27a4878c1','cases':{}}
          for ci,(inner,outer,stride,shift) in enumerate(configs):
            name=f'i{inner}_o{outer}_s{stride}_q{shift}'; rng=random.Random(0x4d394743+ci); n=256
            a=[rng.randrange(16384) for _ in range(n)]; b=[rng.randrange(16384) for _ in range(n)]; t=[rng.randrange(65536) for _ in range(n)]
            def inc(path,vals,fill):
              pathlib.Path(path).write_text(''.join(f'.short 0x{v&0xffff:04x}\n.short 0x{fill:04x}\n' for v in vals))
            inc('plane0_data.inc',a,0xa1a1); inc('plane1_data.inc',b,0xb2b2); inc('threshold_data.inc',t,0xc3c3)
            subprocess.run([os.environ['BFIN_AS'],'--defsym',f'INNER={inner}','--defsym',f'OUTER={outer}','--defsym',f'STRIDE={stride}','--defsym',f'SHIFTVAL={shift}','redblue_differ_oracle_geometry.s','-o',f'{name}.o'],check=True)
            subprocess.run([os.environ['BFIN_LD'],'-T','oracle.ld',f'{name}.o','-o',f'{name}.elf'],check=True)
            p=subprocess.run([os.environ['BFIN_SIM'],f'{name}.elf'],capture_output=True,text=True)
            if p.returncode: raise SystemExit(f'{name}: simulator rc={p.returncode}: {p.stderr}')
            vals=[int(x,16) for x in re.findall(r'DBG\s*:\s*R0\s*=\s*0x([0-9a-fA-F]+)',p.stdout)]
            if len(vals)!=128: raise SystemExit(f'{name}: DBG count={len(vals)}')
            lows=[v&0xffff for v in vals]; highs=[(v>>16)&0xffff for v in vals]
            target={r*stride+c for r in range(outer) for c in range(inner)}
            mism=[]
            for idx in range(128):
              exp=differ_sample(a[idx],b[idx],t[idx],shift) if idx in target else 0x1357
              if lows[idx]!=exp: mism.append((idx,lows[idx],exp))
              if highs[idx]!=0x5a5a: mism.append((idx,'high',highs[idx],0x5a5a))
            if mism: raise SystemExit(f'{name}: mismatches={mism[:12]}')
            report['cases'][name]={'inner':inner,'outer':outer,'stride':stride,'shift':shift,'target_count':len(target),'exact_match':True,'interleaved_lane_preserved':True}
          report['case_count']=len(report['cases']); report['exact_match']=True
          ev=pathlib.Path('evidence'); raw=(json.dumps(report,indent=2)+'\n').encode(); (ev/'differ_geometry_parity.json').write_bytes(raw); (ev/'differ_geometry_parity.sha256.txt').write_text(hashlib.sha256(raw).hexdigest()+'  differ_geometry_parity.json\n'); print(json.dumps(report,indent=2))
          PY
      - name: Publish geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-BFINSCALAR2C-DIFFER-GEOMETRY-PARITY
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/bfindiffer2c/evidence/*
      - name: Remove firmware and binaries
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/bfindiffer2c/pass" "$RUNNER_TEMP/bfindiffer2c/m9.upd" "$RUNNER_TEMP/bfindiffer2c/mm.upm" "$RUNNER_TEMP/bfindiffer2c/m9.dec" "$RUNNER_TEMP/bfindiffer2c/ASMRedBlueAndGreenDiffer.bin" "$RUNNER_TEMP/bfindiffer2c"/*.o "$RUNNER_TEMP/bfindiffer2c"/*.elf
