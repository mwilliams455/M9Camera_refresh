name: Build M9Cam FINISH1N BODYQUAL SUBJECTHEADROOM
on:
  workflow_dispatch:
  push:
    branches: [research/m9-bodyqual1a-subjectheadroom1a]
    paths:
      - patches/autoexposurefinish1n/**
      - .github/workflows/build-m9cam-m9autoexposurefinish1n.yml
permissions:
  contents: read
concurrency:
  group: m9-bodyqual1a-subjectheadroom1a
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Replay pinned FINISH1M source and inherited validation
        run: python3 patches/autoexposurefinish1n/ci.py source
      - name: Apply AE-only FINISH1N and run full-class tests
        run: |
          set -euo pipefail
          python3 patches/autoexposurefinish1n/apply.py PhotonCamera | tee M9AUTOEXPOSUREFINISH1N_APPLY.json
          python3 patches/autoexposurefinish1n/apply.py PhotonCamera > M9AUTOEXPOSUREFINISH1N_VERIFY.json
          python3 patches/autoexposurefinish1n/test.py AUTOEXPOSUREFINISH1N_TESTS PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m9/preview/M9AutoExposure2D.java | tee M9AUTOEXPOSUREFINISH1N_TESTS.txt
          mkdir -p M9AE1N_SOURCE
          cp PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m9/preview/M9AutoExposure2D.java M9AE1N_SOURCE/
      - name: Build FINISH1N APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/M9LIVEGL2G_GRADLE.log"
      - name: Verify APK contracts signing alignment and Android identity
        run: python3 patches/autoexposurefinish1n/ci.py checks
      - name: Record APK and source hashes
        run: |
          set -euo pipefail
          APK="$(find PhotonCamera/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          cp "$APK" M9Cam_2.03_FINISH1N_BODYQUAL_SUBJECTHEADROOM.apk
          sha256sum M9Cam_2.03_FINISH1N_BODYQUAL_SUBJECTHEADROOM.apk M9AE1N_SOURCE/M9AutoExposure2D.java | tee M9AE1N_SHA256.txt
      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-2.03-FINISH1N-BODYQUAL-SUBJECTHEADROOM
          path: |
            M9Cam_2.03_FINISH1N_BODYQUAL_SUBJECTHEADROOM.apk
            M9AE1N_SHA256.txt
            M9AE1N_SOURCE/M9AutoExposure2D.java
            M9AUTOEXPOSUREFINISH1N_APPLY.json
            M9AUTOEXPOSUREFINISH1N_VERIFY.json
            M9AUTOEXPOSUREFINISH1N_TESTS.txt
            AUTOEXPOSUREFINISH1N_TESTS/full_class_tests.json
            PhotonCamera/M9AUTOEXPOSUREFINISH1N_SOURCE_PROOF.json
            M9AE1N_PARENT_SOURCE_REPLAY.json
            M9AE1N_PARENT_CHECKS_REPLAY.json
            M9LIVEGL2G_APK_PROOF.txt
            M9LIVEGL2G_INSTALL_CHECK.txt
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-FINISH1N-BUILD-DIAGNOSTICS
          path: |
            M9LIVEGL2G_GRADLE.log
            M9AE1N_PARENT_SOURCE_REPLAY.json
            M9AE1N_PARENT_CHECKS_REPLAY.json
            M9AUTOEXPOSUREFINISH1N_TESTS.txt
          if-no-files-found: ignore
