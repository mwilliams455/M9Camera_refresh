name: M9Cam 2.81 Monochrom rejection evidence
on:
  pull_request:
    branches: ['main']
    paths: ['patches/monodiagexport1c/**', '.github/workflows/build-m9cam-monodiagexport1c.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Provision pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Reconstruct pinned source
        run: |
          python3 patches/focustrack1a/assemble.py "$RUNNER_TEMP/PhotonCamera_272"
          python3 patches/afcontinuity1a/assemble.py "$RUNNER_TEMP/PhotonCamera_273" --parent "$RUNNER_TEMP/PhotonCamera_272"
          python3 patches/afcontinuity1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_272" "$RUNNER_TEMP/PhotonCamera_273"
          python3 patches/aflifecycle1a/assemble.py "$RUNNER_TEMP/PhotonCamera_274" --parent "$RUNNER_TEMP/PhotonCamera_273"
          python3 patches/aflifecycle1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_273" "$RUNNER_TEMP/PhotonCamera_274"
          python3 patches/aftaphandover1a/assemble.py "$RUNNER_TEMP/PhotonCamera_275" --parent "$RUNNER_TEMP/PhotonCamera_274"
          python3 patches/aftaphandover1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_274" "$RUNNER_TEMP/PhotonCamera_275"
          python3 patches/monoplanwait1a/assemble.py "$RUNNER_TEMP/PhotonCamera_276" --parent "$RUNNER_TEMP/PhotonCamera_275"
          python3 patches/monoplanwait1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_275" "$RUNNER_TEMP/PhotonCamera_276"
          python3 patches/uisettings1a/assemble.py "$RUNNER_TEMP/PhotonCamera_277" --parent "$RUNNER_TEMP/PhotonCamera_276"
          python3 patches/uisettings1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_276" "$RUNNER_TEMP/PhotonCamera_277"
          python3 patches/focuspoint1a/assemble.py "$RUNNER_TEMP/PhotonCamera_278" --parent "$RUNNER_TEMP/PhotonCamera_277"
          python3 patches/focuspoint1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_277" "$RUNNER_TEMP/PhotonCamera_278"
          python3 patches/monosavepipe1a/assemble.py "$RUNNER_TEMP/PhotonCamera_279" --parent "$RUNNER_TEMP/PhotonCamera_278"
          python3 patches/monosavepipe1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_278" "$RUNNER_TEMP/PhotonCamera_279"
          python3 patches/monoplanwait1b/assemble.py "$RUNNER_TEMP/PhotonCamera_280" --parent "$RUNNER_TEMP/PhotonCamera_279"
          python3 patches/monoplanwait1b/verify_source.py "$RUNNER_TEMP/PhotonCamera_279" "$RUNNER_TEMP/PhotonCamera_280"
          python3 patches/monodiagexport1c/assemble.py "$RUNNER_TEMP/PhotonCamera_281" --parent "$RUNNER_TEMP/PhotonCamera_280"
          python3 patches/monodiagexport1c/verify_source.py "$RUNNER_TEMP/PhotonCamera_280" "$RUNNER_TEMP/PhotonCamera_281"
      - name: Build Android and verify rejection evidence and capture lifecycle
        working-directory: ${{ runner.temp }}/PhotonCamera_281
        run: |
          bash gradlew :app:assembleDebug :app:testDebugUnitTest --tests '*MonoExposureReadinessTest' --tests '*MonoReadinessExportTest' --tests '*MonoPrimaryEvidenceTest' --tests '*MonoDiagnosticPreferenceTest' --tests '*StillCaptureLifecycleTest' --tests '*MonoPlanObservationTest' --tests '*ProfileCaptureTest' --no-daemon --max-workers=2
      - name: Retain packaging tools
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/packaging-tools/lib"
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" "$ANDROID_HOME/build-tools/35.0.0/aapt2" "$RUNNER_TEMP/packaging-tools/"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/packaging-tools/lib/"
          cp -r "$ANDROID_HOME/build-tools/35.0.0/lib64" "$RUNNER_TEMP/packaging-tools/"
      - name: Retain build and test results for final packaging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monodiagexport1c-android-build
          path: |
            ${{ runner.temp }}/packaging-tools/**
            ${{ runner.temp }}/PhotonCamera_281/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/PhotonCamera_281/app/build/test-results/testDebugUnitTest/**
            ${{ runner.temp }}/PhotonCamera_281/app/build/reports/tests/testDebugUnitTest/**
          retention-days: 7
