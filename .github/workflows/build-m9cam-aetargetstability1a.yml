name: Build M9Cam 2.08 AETARGETSTABILITY1A
on:
  workflow_dispatch:
  push:
    branches: [research/m9-aetargetstability1a]
    paths:
      - patches/aetargetstability1a/**
      - .github/workflows/build-m9cam-aetargetstability1a.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: m9-aetargetstability1a
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble verified 2.07 parent
        run: |
          set -euo pipefail
          python3 patches/tapmeter1a/apply.py --check-payload
          python3 patches/autoexposurefinish1n/ci.py source
          python3 patches/autoexposurefinish1n/apply.py PhotonCamera
          python3 patches/tapmeter1a/apply.py PhotonCamera
          python3 patches/tapexactpatchclip1b/apply.py apply PhotonCamera
          python3 patches/aecadence1a/apply.py apply PhotonCamera
          python3 patches/aestability1a/apply.py apply PhotonCamera
      - name: Verify 2.07 parent contracts
        run: |
          set -euo pipefail
          # Do not run the pre-2.07 PolicyTest here: it asserts that a severe
          # deficit must jump +0.75 EV in one sample, which AESTABILITY1A
          # deliberately replaced with a bounded temporal ramp.
          python3 patches/aecadence1a/test.py PhotonCamera PARENT_CADENCE | tee PARENT_CADENCE.txt
          python3 patches/aestability1a/test.py PhotonCamera PARENT_STABILITY | tee PARENT_STABILITY.txt
          javac --release 17 -cp PARENT_STABILITY/classes -d PARENT_STABILITY/classes patches/tapexactpatchclip1b/TapOverlapRegression.java
          java -ea -cp PARENT_STABILITY/classes com.particlesdevs.photoncamera.m9.preview.TapOverlapRegression true | tee PARENT_OVERLAP.txt
      - name: Apply persistent-target overlay and test
        run: |
          set -euo pipefail
          python3 patches/aetargetstability1a/apply.py apply PhotonCamera | tee TARGET_APPLY.json
          python3 patches/aetargetstability1a/apply.py apply PhotonCamera > TARGET_VERIFY.json
          python3 patches/aetargetstability1a/test.py PhotonCamera TARGET_TESTS | tee TARGET_TESTS_RUN.txt
          python3 patches/aecadence1a/test.py PhotonCamera CANDIDATE_CADENCE | tee CANDIDATE_CADENCE.txt
          python3 patches/aestability1a/test.py PhotonCamera CANDIDATE_STABILITY | tee CANDIDATE_STABILITY.txt
          javac --release 17 -cp TARGET_TESTS/classes -d TARGET_TESTS/classes patches/tapexactpatchclip1b/TapOverlapRegression.java
          java -ea -cp TARGET_TESTS/classes com.particlesdevs.photoncamera.m9.preview.TapOverlapRegression true | tee OVERLAP_CANDIDATE.txt
      - name: Export audited source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          out=Path('AETARGET_DELIVERY');out.mkdir(exist_ok=True)
          for p in ['app/build.gradle','app/src/main/java/com/particlesdevs/photoncamera/m9/preview/M9AutoExposure2D.java','M9AETARGETSTABILITY1A_SOURCE_PROOF.json']:
              s=Path('PhotonCamera')/p;d=out/'source'/p;d.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(s,d)
          shutil.copytree('patches/aetargetstability1a',out/'integration',dirs_exist_ok=True)
          for p in ['TARGET_APPLY.json','TARGET_VERIFY.json','PARENT_CADENCE.txt','PARENT_STABILITY.txt','PARENT_OVERLAP.txt',
                    'CANDIDATE_CADENCE.txt','CANDIDATE_STABILITY.txt','OVERLAP_CANDIDATE.txt']:
              shutil.copyfile(p,out/p)
          for p in ['AETARGETSTABILITY_TESTS.txt','TEST_SCOPE.json']:shutil.copyfile(Path('TARGET_TESTS')/p,out/p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M9-AETARGETSTABILITY1A-SOURCE-AUDIT
          path: AETARGET_DELIVERY/
          if-no-files-found: error
      - name: Build APK
        run: |
          set -euo pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/AETARGET_GRADLE.log"
      - name: Inherited package and installation checks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('patches/autoexposurefinish1n/ci.py');s=p.read_text()
          old='2.03-m9ae1n-bodyqual1a-subjecthl1a-perf3i'
          assert s.count(old)==1
          p.with_name('aetarget_checks.py').write_text(s.replace(old,'2.08-m9aetargetstability1a-aestability1a-aecadence1a'))
          PY
          python3 patches/autoexposurefinish1n/aetarget_checks.py checks
      - uses: actions/download-artifact@v4
        with:
          name: M9Cam-2.07-AESTABILITY1A
          run-id: 36393272369
          github-token: ${{ github.token }}
          path: BASELINE207
      - name: Verify compiled inputs and frozen photographic resources
        run: |
          set -euo pipefail
          python3 patches/aetargetstability1a/apply.py post PhotonCamera BASELINE207 AETARGET_DELIVERY | tee AETARGET_POST.json
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          text=Path('M9LIVEGL2G_INSTALL_CHECK.txt').read_text()
          for expected in ['package=com.m9project.m9cam.photon',
            'versionName=2.08-m9aetargetstability1a-aestability1a-aecadence1a',
            'versionCode=26728',
            'signerSHA256=255cb09eaddd26a9cc680786e4985372cf24d0e54bb120fc44d48f3273ff3956']:
              assert expected in text,expected
          for p in ['AETARGET_POST.json','M9LIVEGL2G_INSTALL_CHECK.txt','M9AE1N_PARENT_CHECKS_REPLAY.json']:
              shutil.copyfile(p,Path('AETARGET_DELIVERY')/p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M9Cam-2.08-AETARGETSTABILITY1A
          path: AETARGET_DELIVERY/
          if-no-files-found: error
      - name: Build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-AETARGETSTABILITY1A-BUILDLOG
          path: |
            AETARGET_GRADLE.log
            TARGET_*.json
            TARGET_TESTS_RUN.txt
            CANDIDATE_CADENCE.txt
            CANDIDATE_STABILITY.txt
            OVERLAP_CANDIDATE.txt
            AETARGET_DELIVERY/POSTBUILD_INPUTS.json
          if-no-files-found: ignore
