name: Build M9Cam 2.08 PHOTONBOUNDARY2Q RAW handoff diagnostic

on:
  workflow_dispatch:
  push:
    branches: [research/m9-photonboundary2q]
    paths:
      - patches/photonboundary2q/**
      - .github/workflows/build-m9cam-photonboundary2q.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: m9-photonboundary2q
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Replay delivered 2.07 source
        run: |
          set -euo pipefail
          python3 patches/autoexposurefinish1n/ci.py source
          python3 patches/autoexposurefinish1n/apply.py PhotonCamera
          python3 patches/tapmeter1a/apply.py PhotonCamera
          python3 patches/tapexactpatchclip1b/apply.py apply PhotonCamera
          python3 patches/qualitygate1b/apply.py PhotonCamera
          python3 patches/capturecolor1a/apply.py PhotonCamera
      - name: Apply read-only boundary diagnostic
        run: |
          set -euo pipefail
          python3 patches/photonboundary2q/apply.py PhotonCamera | tee PB2Q_APPLY.json
          python3 patches/photonboundary2q/apply.py PhotonCamera > PB2Q_VERIFY.json
      - name: Build diagnostic
        run: |
          set -euo pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/PB2Q_GRADLE.log"
      - uses: actions/download-artifact@v4
        with:
          name: M9Cam-2.07-CAPTURECOLOR1A
          run-id: 36559297780
          github-token: ${{ github.token }}
          path: BASELINE207
      - name: Verify packaged rendering and update identity
        run: |
          set -euo pipefail
          python3 patches/photonboundary2q/freeze_native.py PhotonCamera \
            BASELINE207/M9Cam_2.07_CAPTURECOLOR1A.apk "$ANDROID_HOME/build-tools/35.0.0" PB2Q_PACKAGING
          python3 patches/photonboundary2q/postbuild.py PhotonCamera \
            BASELINE207/M9Cam_2.07_CAPTURECOLOR1A.apk M9_PHOTONBOUNDARY2Q_DELIVERY
          cp PB2Q_PACKAGING/NATIVE_PAYLOAD_REUSE.json M9_PHOTONBOUNDARY2Q_DELIVERY/
          APK=M9_PHOTONBOUNDARY2Q_DELIVERY/M9Cam_2.08_PHOTONBOUNDARY2Q.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p /tmp/m9photonboundary2q-installcheck
          javac -cp "$BUILD_TOOLS/lib/apksigner.jar" -d /tmp/m9photonboundary2q-installcheck \
            patches/tests/m9livegl2g/ApkInstallCheck.java
          java -cp "/tmp/m9photonboundary2q-installcheck:$BUILD_TOOLS/lib/apksigner.jar" \
            ApkInstallCheck "$APK" 2.08-m9photonboundary2q-capturecolor1a \
            | tee M9_PHOTONBOUNDARY2Q_DELIVERY/INSTALL_CHECK.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK" >> M9_PHOTONBOUNDARY2Q_DELIVERY/INSTALL_CHECK.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M9Cam-2.08-PHOTONBOUNDARY2Q
          path: M9_PHOTONBOUNDARY2Q_DELIVERY/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M9-PHOTONBOUNDARY2Q-BUILDLOG
          path: |
            PB2Q_APPLY.json
            PB2Q_VERIFY.json
            PB2Q_GRADLE.log
          if-no-files-found: ignore
