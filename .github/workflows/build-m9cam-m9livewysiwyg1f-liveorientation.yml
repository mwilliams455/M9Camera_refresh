name: Build M9Cam LIVEWYSIWYG1F Live Orientation

on:
  workflow_dispatch:
  pull_request:
    branches: [research/m9livewysiwyg1e-fullsource-throttle]
    paths:
      - 'patches/apply-m9cam-m9livewysiwyg1f-liveorientation.py'
      - 'patches/verify-m9cam-m9livewysiwyg1f-liveorientation.py'
      - '.github/workflows/build-m9cam-m9livewysiwyg1f-liveorientation.yml'
  push:
    branches: [research/m9livewysiwyg1f-liveorientation]
    paths:
      - 'patches/apply-m9cam-m9livewysiwyg1f-liveorientation.py'
      - 'patches/verify-m9cam-m9livewysiwyg1f-liveorientation.py'
      - '.github/workflows/build-m9cam-m9livewysiwyg1f-liveorientation.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify LIVEWYSIWYG1F patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-m9livewysiwyg1f-liveorientation.py
          python3 -m py_compile patches/verify-m9cam-m9livewysiwyg1f-liveorientation.py

      - name: Replay exact LIVEWYSIWYG1E assembled baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/build-m9cam-m9livewysiwyg1e-fullsource-throttle.yml')
          lines=wf.read_text().splitlines()
          names=[
              'Verify LIVEWYSIWYG1E patch syntax',
              'Replay exact LIVEWYSIWYG1C assembled baseline',
              'Freeze exact 1C photographic path before LIVEWYSIWYG1E',
              'Apply full-source scheduling throttle',
              'Prove 1C photographic path unchanged',
          ]
          for idx,name in enumerate(names):
              target='      - name: '+name
              if target not in lines:
                  raise SystemExit('LIVEWYSIWYG1E replay block missing: '+name)
              i=lines.index(target)
              while i<len(lines) and lines[i].strip()!='run: |':
                  i+=1
              if i>=len(lines):
                  raise SystemExit('LIVEWYSIWYG1E run block missing: '+name)
              i+=1
              out=[]
              while i<len(lines):
                  line=lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif not line.strip():
                      out.append('')
                  else:
                      raise SystemExit('unexpected LIVEWYSIWYG1E indentation: '+line)
                  i+=1
              Path(f'/tmp/m9livewysiwyg1f_parent_{idx:02d}.sh').write_text('\n'.join(out)+'\n')
          PY
          for s in /tmp/m9livewysiwyg1f_parent_*.sh; do
            echo "=== replay $s ==="
            bash "$s"
          done

      - name: Freeze M9 photographic path before LIVEWYSIWYG1F
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/preview/M9LivePreview1A.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9EdgePlacementBestFit2AController.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java" \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > LIVEWYSIWYG1F_FROZEN_BEFORE.sha256

      - name: Apply live orientation fix
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-m9livewysiwyg1f-liveorientation.py "$ROOT"
          python3 patches/verify-m9cam-m9livewysiwyg1f-liveorientation.py "$ROOT" \
            | tee LIVEWYSIWYG1F_VERIFY.txt

      - name: Prove M9 photographic path unchanged
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/preview/M9LivePreview1A.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9EdgePlacementBestFit2AController.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java" \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > LIVEWYSIWYG1F_FROZEN_AFTER.sha256
          diff -u LIVEWYSIWYG1F_FROZEN_BEFORE.sha256 LIVEWYSIWYG1F_FROZEN_AFTER.sha256

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate runner Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo 'No usable sdkmanager found' >&2
            exit 1
          fi
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build LIVEWYSIWYG1F APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/LIVEWYSIWYG1F_GRADLE.log"

      - name: Verify packaged LIVEWYSIWYG1F contract
        if: success()
        run: |
          set -euo pipefail
          APK="$(find PhotonCamera/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          rm -rf /tmp/m9livewysiwyg1f-apk
          mkdir -p /tmp/m9livewysiwyg1f-apk
          unzip -q "$APK" -d /tmp/m9livewysiwyg1f-apk
          python3 - <<'PY' | tee LIVEWYSIWYG1F_APK_PROOF.txt
          from pathlib import Path
          root=Path('/tmp/m9livewysiwyg1f-apk')
          dex=b''.join(p.read_bytes() for p in sorted(root.glob('classes*.dex')))
          required=[
              b'M9LIVEWYSIWYG1C_FULLSOURCE_FINALBOUNDARY',
              b'FULL_PRODUCTION_RENDER_FULL_SOURCE_FINAL_BITMAP',
              b'full_resolution_RAW_is_renderer_input_no_pre_render_reduction',
              b'm9LivePreviewLastRenderEndElapsedMs1E',
              b'M9LIVEWYSIWYG1F liveRotation=',
              b'staleStillRotation=',
              b'M9LIVEWYSIWYG1B_DISPLAYEDCAPTURELOCK',
              b'setExactExposureM9Wysiwyg1B',
          ]
          for marker in required:
              ok=marker in dex
              print(marker.decode('ascii'),ok)
              if not ok:
                  raise SystemExit('missing APK marker '+marker.decode('ascii'))
          forbidden=[
              b'M9LIVEWYSIWYG1D_METER1600_REFERENCE_RENDER',
              b'FULL_PRODUCTION_RENDER_REFERENCE1600_FINAL_BITMAP',
              b'reduceBayerMeterReference1600PreservingParity1D',
          ]
          for marker in forbidden:
              present=marker in dex
              print('forbidden',marker.decode('ascii'),present)
              if present:
                  raise SystemExit('invalid 1D marker packaged '+marker.decode('ascii'))
          print('LIVEWYSIWYG1F APK PROOF PASS')
          PY

      - name: Record APK SHA256
        if: success()
        run: |
          sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk \
            | tee LIVEWYSIWYG1F_APK_SHA256.txt

      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-LIVEWYSIWYG1F-LIVEORIENTATION
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            LIVEWYSIWYG1F_APK_SHA256.txt
            LIVEWYSIWYG1F_VERIFY.txt
            LIVEWYSIWYG1F_APK_PROOF.txt
            LIVEWYSIWYG1F_FROZEN_BEFORE.sha256
            LIVEWYSIWYG1F_FROZEN_AFTER.sha256

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-LIVEWYSIWYG1F-LIVEORIENTATION-BUILDLOG
          path: LIVEWYSIWYG1F_GRADLE.log
          if-no-files-found: ignore
