name: Build M9Cam TONALSEPARATION1A Spatial Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpness-rbclosure1d-packedphase1a
    paths:
      - '.github/workflows/build-m9cam-tonalseparation1a-spatial-audit.yml'
      - 'patches/apply-m9cam-tonalseparation1a-spatial-audit.py'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify diagnostic patches
        run: |
          python3 -m py_compile patches/apply-m9cam-leicarb1b-rbanchor1a-control.py
          python3 -m py_compile patches/apply-m9cam-tonalseparation1a-spatial-audit.py

      - name: Replay exact SHARPSOURCE1C RBANCHOR1A assembled baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-sharpness-sharpsource1c-rbanchor1a.yml')
          lines = wf.read_text().splitlines()
          names = [
              'Verify patch syntax',
              'Replay exact UPSTREAMAXIS1A parent assembly',
              'Assemble frozen neutral-MHC parent',
              'Assemble SHARPSOURCE1C RBANCHOR1A',
          ]
          for idx, name in enumerate(names):
              target = '      - name: ' + name
              i = lines.index(target)
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit('baseline run block missing: ' + name)
              i += 1
              out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif not line.strip():
                      out.append('')
                  else:
                      raise SystemExit('unexpected baseline indentation: ' + line)
                  i += 1
              Path(f'/tmp/tonal1a_parent_{idx}.sh').write_text('\n'.join(out) + '\n')
          PY
          for s in /tmp/tonal1a_parent_*.sh; do
            echo "===== replay $s ====="
            bash "$s"
          done

      - name: Assemble exact LEICARB1B control parent
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-leicarb1b-rbanchor1a-control.py "$ROOT"
          grep -q 'SHARPNESS_SHARPSOURCE1C_RBANCHOR1A_ID' "$ROOT/app/src/main/cpp/m9color_jni.cpp"
          grep -q 'LEICARB1B_RBANCHOR1A_CONTROL' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9PrimaryTimingWriter.java"
          if grep -q 'LEICARB1A_SHARPGREEN_RGGB_BEGIN\|m9LeicaRbEstimate(' "$ROOT/app/src/main/cpp/m9color_jni.cpp"; then
            echo 'LEICARB1A adapter present in tonal parent' >&2
            exit 1
          fi

      - name: Snapshot pixel-identical parent
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          cp "$ROOT/app/src/main/cpp/m9color_jni.cpp" /tmp/TONAL1A_before.cpp
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" /tmp/TONAL1A_before_renderer.java
          sha256sum /tmp/TONAL1A_before.cpp /tmp/TONAL1A_before_renderer.java | tee TONAL1A_PARENT_SHA256.txt

      - name: Apply TONALSEPARATION1A measurement-only audit
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-tonalseparation1a-spatial-audit.py "$ROOT"
          grep -n 'TONALSEPARATION1A_BEGIN\|tonalSeparation1A\|TONAL1A_COLS\|TONAL1A_ROWS' "$ROOT/app/src/main/cpp/m9color_jni.cpp" | tee TONAL1A_NATIVE_ANCHORS.txt
          grep -n 'TONALSEPARATION1A_MEASUREMENT_ONLY\|tonalSeparationRenderedPixelsModified\|if (satDomainAuditInputEligible1A)' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" | tee TONAL1A_RENDERER_ANCHORS.txt

      - name: Guard rendered pixel path is unchanged
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          CPP="$ROOT/app/src/main/cpp/m9color_jni.cpp"
          RENDERER="$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          mkdir -p tonal1a-evidence

          grep -q 'const int sg=static_cast<int>(closureSharp14\[p\]);' "$CPP"
          grep -q 'const int dr=static_cast<int>(m9ClosureQ14(base\[0\]))-mg;' "$CPP"
          grep -q 'const int db=static_cast<int>(m9ClosureQ14(base\[2\]))-mg;' "$CPP"
          grep -q 'x>=9 && x<width-9 && y>=9 && y<height-9' "$CPP"
          grep -q 'JPEG_QUALITY = 95' "$RENDERER"
          grep -q 'COLORNATIVE2A' "$RENDERER"
          grep -q 'measurementOnly\\\":true,\\\"renderedPixelsModified\\\":false' "$CPP"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          before = Path('/tmp/TONAL1A_before.cpp').read_text()
          after = Path('PhotonCamera/app/src/main/cpp/m9color_jni.cpp').read_text()
          audit_marker = 'std::string auditSatDomainJson(const ColorContext& ctx,'
          next_marker = 'void throwIllegalArgument(JNIEnv* env, const char* message) {'
          helper_marker = '// TONALSEPARATION1A_BEGIN'

          # Strong isolation proof without parsing C++ braces: SATDOMAIN1A places the audit
          # immediately before throwIllegalArgument. TONAL1A is permitted to alter only that
          # audit region and its helper block. Prefix and suffix must remain exact.
          b_prefix = before[:before.index(audit_marker)].rstrip()
          a_prefix = after[:after.index(helper_marker)].rstrip()
          if b_prefix != a_prefix:
              raise SystemExit('native prefix before read-only audit changed')
          b_suffix = before[before.index(next_marker):]
          a_suffix = after[after.index(next_marker):]
          if b_suffix != a_suffix:
              raise SystemExit('native suffix after read-only audit changed')
          frozen = a_prefix + '\n<AUDIT_ONLY_REGION>\n' + a_suffix
          Path('TONAL1A_NATIVE_NONAUDIT_SHA256.txt').write_text(hashlib.sha256(frozen.encode()).hexdigest() + '\n')

          rb = Path('/tmp/TONAL1A_before_renderer.java').read_text()
          ra = Path('PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java').read_text()
          ra = ra.replace('            if (satDomainAuditInputEligible1A) {',
                          '            if (skySatDiagnosticEncoded1A && skyChromaMode1A == 0 && satDomainAuditInputEligible1A) {', 1)
          ra = ra.replace('            d.put("tonalSeparationExperiment", "TONALSEPARATION1A_MEASUREMENT_ONLY");\n', '', 1)
          ra = ra.replace('            d.put("tonalSeparationRenderedPixelsModified", false);\n', '', 1)
          ra = ra.replace('            d.put("tonalSeparationPixelPath", "LEICARB1B_RBANCHOR1A_CONTROL");\n', '', 1)
          if rb != ra:
              raise SystemExit('renderer changed outside audit trigger/diagnostic labels')
          Path('TONAL1A_RENDERER_PARENT_EQUIVALENCE.txt').write_text('exact after reversing diagnostic-only changes\n')
          PY

          cp TONAL1A_PARENT_SHA256.txt TONAL1A_NATIVE_ANCHORS.txt TONAL1A_RENDERER_ANCHORS.txt \
             TONAL1A_NATIVE_NONAUDIT_SHA256.txt TONAL1A_RENDERER_PARENT_EQUIVALENCE.txt tonal1a-evidence/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build components from preinstalled SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Build TONALSEPARATION1A debug APK
        shell: bash
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/TONAL1A_GRADLE.log"

      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee TONAL1A_APK_SHA256.txt

      - name: Upload tonal audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-TONALSEPARATION1A-SPATIAL-AUDIT-EVIDENCE
          path: |
            tonal1a-evidence/
            TONAL1A_GRADLE.log
          if-no-files-found: ignore

      - name: Upload research APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-TONALSEPARATION1A-LEICARB1B-SPATIAL-AUDIT
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            TONAL1A_APK_SHA256.txt
