name: M9 R/B RBCLOSURE5S ImageSettings Writers

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-imagesettings5s.yml'

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 4 -o b.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          tar -xf b.tar.xz
          mkdir b && cd b
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim >/dev/null
          make -j4 all-binutils >/dev/null
          echo "BFIN_OBJDUMP=$PWD/binutils/objdump" >> "$GITHUB_ENV"

      - name: Recover helper bodies
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rb5s"
          mkdir -p "$ROOT/evidence" "$ROOT/bodies"
          curl -fsSL --retry 4 -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl -fsSL --retry 4 -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$ROOT/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$ROOT/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json" >/dev/null
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$ROOT/m9.dec" | sha256sum -c --strict
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass" >/dev/null
          python3 - <<'PY'
          import json,os,pathlib,importlib.util,sys,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb5s'; d=json.load(open(root/'pass/report.json')); cand=[]
          for i,x in enumerate(d.get('bf561_deep',[])):
              det=x.get('detail',{}) if isinstance(x.get('detail'),dict) else {}; t=det.get('targets',{}) if isinstance(det,dict) else {}
              if x.get('covered',0)>0 and 'error' not in det: cand.append((sum(k in t for k in ('Run','Process_Sharpness','Process_Noise','Process_WB')),x.get('covered',0),i))
          cand.sort(reverse=True); pair=cand[0][2]; pdir=root/'pass'/f'bf561_pair_{pair:02d}'; bf0=next(pdir.rglob('bf0.bin')); mp=next(pdir.rglob('bf0.map'))
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py'); m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          _,blocks=m.parse_ldr(bf0); syms=m.parse_map(mp)
          targets={'pre':0xffa126e4,'copy':0xffa12678,'finalize':0xffa1261a}
          out={'schema':'m9.rbclosure5s.setup.v1','selected_pair':pair,'targets':{}}
          for label,addr in targets.items():
              exact=[];cover=[]
              for s in syms:
                  try:a=int(s['addr']);z=int(s.get('size',0))
                  except Exception:continue
                  if a==addr: exact.append({'name':s.get('name'),'addr':a,'size':z})
                  if z>0 and a<=addr<a+z: cover.append({'name':s.get('name'),'addr':a,'size':z})
              chosen=next((s for s in exact if s['size']>0),None) or next((s for s in cover if s['size']>0),None)
              if not chosen: raise SystemExit(f'no sized symbol for {label} 0x{addr:08x}')
              body=m.read_overlay(blocks,chosen['addr'],chosen['size']); fn=f'{label}.bin'; (root/'bodies'/fn).write_bytes(body)
              out['targets'][label]={'target':f'0x{addr:08x}','exact_symbols':[{**q,'addr':f"0x{q['addr']:08x}"} for q in exact],'covering_symbols':[{**q,'addr':f"0x{q['addr']:08x}"} for q in cover],'chosen':{'name':chosen['name'],'addr':f"0x{chosen['addr']:08x}",'size':chosen['size'],'sha256':hashlib.sha256(body).hexdigest()},'bin':fn}
          (root/'setup.json').write_text(json.dumps(out,indent=2)+'\n'); (root/'symbols.json').write_text(json.dumps(syms,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb5s'; d=json.load(open(root/'setup.json'))
          with open(root/'objdump.sh','w') as f:
              f.write('set -euo pipefail\n')
              for label,v in d['targets'].items():
                  f.write(f'"$BFIN_OBJDUMP" -D -b binary -m bfin --adjust-vma={v["chosen"]["addr"]} "$RUNNER_TEMP/rb5s/bodies/{v["bin"]}" > "$RUNNER_TEMP/rb5s/bodies/{label}.dis"\n')
          PY
          bash "$ROOT/objdump.sh"

      - name: Analyze ImageSettings writes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rb5s"
          python3 - <<'PY'
          import os,pathlib,re,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb5s'; setup=json.load(open(root/'setup.json')); syms=json.load(open(root/'symbols.json'))
          rx=re.compile(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+(.+)$',re.I); tr=re.compile(r'0x0?([0-9a-f]{8})',re.I)
          def parse(p):
              out=[]
              for line in p.read_text(errors='replace').splitlines():
                  m=rx.match(line)
                  if m: out.append({'addr':int(m.group(1),16),'asm':m.group(2).strip()})
              return out
          def syminfo(addr):
              ex=[];cv=[]
              for s in syms:
                  try:a=int(s['addr']);z=int(s.get('size',0))
                  except Exception:continue
                  if a==addr:ex.append({'name':s.get('name'),'addr':f'0x{a:08x}','size':z})
                  if z>0 and a<=addr<a+z:cv.append({'name':s.get('name'),'addr':f'0x{a:08x}','size':z})
              return {'exact':ex,'covering':cv}
          # Proven call-site argument of interest: copy gets ImageSettings in R1; finalize gets ImageSettings in R0.
          seeds={'pre':None,'copy':'R1','finalize':'R0'}
          results={}; text=[]
          for label,v in setup['targets'].items():
              ins=parse(root/'bodies'/f'{label}.dis'); seed=seeds[label]; aliases=set([seed]) if seed else set(); events=[]; accesses=[]; calls=[]
              for x in ins:
                  u=x['asm'].upper()
                  # recognize simple copies and ROT copies used by Blackfin compiler
                  m=re.search(r'^\s*([RP][0-7]?)\s*=\s*([RP][0-7]?)\s*;',u)
                  if m and m.group(2) in aliases and m.group(1) not in aliases:
                      aliases.add(m.group(1));events.append({'addr':f"0x{x['addr']:08x}",'asm':x['asm'],'new_alias':m.group(1),'from':m.group(2)})
                  mr=re.search(r'^\s*([R][0-7])\s*=\s*ROT\s+([R][0-7])\s+BY\s+0X0',u)
                  if mr and mr.group(2) in aliases and mr.group(1) not in aliases:
                      aliases.add(mr.group(1));events.append({'addr':f"0x{x['addr']:08x}",'asm':x['asm'],'new_alias':mr.group(1),'from':mr.group(2)})
                  for a in list(aliases):
                      mm=re.search(r'(B|W)?\['+re.escape(a)+r'(?:\s*\+\s*(0X[0-9A-F]+|\d+))?\]',u)
                      if mm:
                          off=mm.group(2) or '0'; direction='store' if re.search(r'(?:B|W)?\[[^\]]+\]\s*=',u) else ('load' if re.search(r'=\s*(?:B|W)?\[[^\]]+\]',u) else 'other')
                          accesses.append({'addr':f"0x{x['addr']:08x}",'asm':x['asm'],'alias':a,'offset':off,'direction':direction})
                  if 'CALL ' in u:
                      mt=tr.search(x['asm']); tgt=int(mt.group(1),16) if mt else None
                      calls.append({'addr':f"0x{x['addr']:08x}",'asm':x['asm'],'target':f'0x{tgt:08x}' if tgt is not None else None,'target_symbols':syminfo(tgt) if tgt is not None else None,'aliases_known':sorted(aliases)})
              mode4=[q for q in accesses if q['offset'].upper() in ('4','0X4')]
              results[label]={'seed':seed,'aliases_seen':sorted(aliases),'alias_events':events,'accesses':accesses,'mode_byte_plus4_accesses':mode4,'calls':calls,'instructions':[{'addr':f"0x{x['addr']:08x}",'asm':x['asm']} for x in ins]}
              text.append(f'\n=== {label} {v["chosen"]["name"]} seed={seed} ==='); text.extend(f"0x{x['addr']:08x}  {x['asm']}" for x in ins); text.append('MODE +4 ACCESSES'); text.extend(json.dumps(q) for q in mode4); text.append('CALLS'); text.extend(json.dumps(q) for q in calls)
          rep={'schema':'m9.rbclosure5s.imagesettings-writers.v1','setup':setup,'functions':results,'proven_task_call_shapes':{'0xffa126e4':'called immediately after ImageSettings address materialization, no explicit task-side arg setup after previous call','0xffa12678':'R0=Task R7, R1=ImageSettings','0xffa1261a':'R0=ImageSettings'},'goal':'Recover final ImageSettings+4 value entering StartInterpolation.'}
          raw=(json.dumps(rep,indent=2)+'\n').encode(); (root/'evidence'/'imagesettings_writers.json').write_bytes(raw); (root/'evidence'/'imagesettings_writers.txt').write_text('\n'.join(text)+'\n'); (root/'evidence'/'imagesettings_writers.sha256.txt').write_text(hashlib.sha256(raw).hexdigest()+'  imagesettings_writers.json\n'); print((root/'evidence'/'imagesettings_writers.txt').read_text())
          PY
          sha256sum "$ROOT/evidence"/* > "$ROOT/evidence/SHA256SUMS.txt"

      - name: Upload ImageSettings evidence
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-RBCLOSURE5S-IMAGESETTINGS-WRITERS
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/rb5s/evidence/*

      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/rb5s/pass" "$RUNNER_TEMP/rb5s/m9.upd" "$RUNNER_TEMP/rb5s/mm.upm" "$RUNNER_TEMP/rb5s/m9.dec" "$RUNNER_TEMP/rb5s/bodies" "$RUNNER_TEMP/rb5s/setup.json" "$RUNNER_TEMP/rb5s/symbols.json" "$RUNNER_TEMP/rb5s/objdump.sh"
