name: M9 Sharpness Processing List Rules Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpnessforensics1a
    paths:
      - '.github/workflows/m9-sharpness-processinglist-rules.yml'
      - 'tools/recover_m9_key_from_shared_body.py'
      - 'tools/m9_sharpnessforensics1a_firmwarepass.py'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9sharp"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$RUNNER_TEMP/m9sharp/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$RUNNER_TEMP/m9sharp/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" --m9-out "$RUNNER_TEMP/m9sharp/m9.dec" --meta-out "$RUNNER_TEMP/m9sharp/recovery_meta.json"
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$RUNNER_TEMP/m9sharp/m9.dec" | sha256sum -c --strict
      - name: Inventory RULES/XML and BF561 processing-list symbols
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,sys,pathlib,os,json,re,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp'
          spec=importlib.util.spec_from_file_location('fwpass',pathlib.Path('tools/m9_sharpnessforensics1a_firmwarepass.py'))
          m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          raw=(root/'m9.dec').read_bytes();_,pwad=m.find_root_pwad(raw)
          lumps=list(m.walk_pwad(pwad))
          rules=[]
          for l in lumps:
              lname=l.name.lower(); path=l.path.lower()
              if 'rule' in lname or lname.endswith('.xml') or 'rules' in path:
                  txt=l.data.decode('utf-8','replace')
                  # Preserve only text evidence; no binary payload.
                  hits=[]
                  for pat in ('Sharp','Noise','Process','Processing','JPEG','DNG','Contrast','Saturation'):
                      for mm in re.finditer(pat,txt,re.I):
                          a=max(0,mm.start()-320);b=min(len(txt),mm.end()+520)
                          hits.append({'term':pat,'offset':mm.start(),'context':txt[a:b]})
                  rules.append({'path':l.path,'size':len(l.data),'sha256':hashlib.sha256(l.data).hexdigest(),'text_hit_count':len(hits),'hits':hits[:300]})
          # Identify all plausible BF561 map lumps and surface processing/list symbols.
          maps=[]
          for l in lumps:
              recs=m.map_records(l.data)
              if not recs: continue
              names=[x[0] for x in recs]
              if 'Process_Sharpness' not in names or 'Run' not in names: continue
              selected=[]
              for name,addr,size in recs:
                  low=name.lower()
                  if any(k in low for k in ('processing','process','list','run','sharp','noise','setstruct',' set','set')):
                      selected.append({'name':name,'addr':hex(addr),'size':size})
              maps.append({'path':l.path,'record_count':len(recs),'selected_symbols':selected})
          report={'schema':'m9.sharpness.processing-list-rules-inventory.v1','rules_resources':rules,'bf561_map_candidates':maps}
          (root/'processing_list_rules_inventory.json').write_text(json.dumps(report,indent=2)+'\n')
          # Compact human-readable symbol list.
          lines=[]
          for mp in maps:
              lines.append('=== '+mp['path']+' ===')
              for s in mp['selected_symbols']:
                  lines.append(f"{s['addr']} {s['size']:6d} {s['name']}")
              lines.append('')
          (root/'processing_list_symbols.txt').write_text('\n'.join(lines)+'\n')
          print('rules resources',len(rules),'map candidates',len(maps))
          for r in rules: print('RULE',r['path'],'hits',r['text_hit_count'])
          for mp in maps: print('MAP',mp['path'],'selected',len(mp['selected_symbols']))
          PY
      - name: Publish text evidence
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-PROCESSINGLIST-RULES
          retention-days: 30
          path: |
            ${{ runner.temp }}/m9sharp/processing_list_rules_inventory.json
            ${{ runner.temp }}/m9sharp/processing_list_symbols.txt
            ${{ runner.temp }}/m9sharp/recovery_meta.json
      - name: Remove firmware
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" "$RUNNER_TEMP/m9sharp/m9.dec"
