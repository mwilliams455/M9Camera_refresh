name: Build M9Cam LEICARB1A EA-Green RGGB Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpness-rbclosure1d-packedphase1a
    paths:
      - '.github/workflows/build-m9cam-leicarb1a-eagreen-rggb-experiment.yml'
      - 'patches/apply-m9cam-leicarb1a-eagreen-rggb-experiment.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify experiment patch syntax
        run: python3 -m py_compile patches/apply-m9cam-leicarb1a-eagreen-rggb-experiment.py

      - name: Replay exact SHARPSOURCE1C RBANCHOR1A assembled baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-sharpness-sharpsource1c-rbanchor1a.yml')
          lines = wf.read_text().splitlines()
          names = [
              'Verify patch syntax',
              'Replay exact UPSTREAMAXIS1A parent assembly',
              'Assemble frozen neutral-MHC parent',
              'Assemble SHARPSOURCE1C RBANCHOR1A',
          ]
          for idx, name in enumerate(names):
              target = '      - name: ' + name
              i = lines.index(target)
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit('baseline run block missing: ' + name)
              i += 1
              out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif not line.strip():
                      out.append('')
                  else:
                      raise SystemExit('unexpected baseline indentation: ' + line)
                  i += 1
              Path(f'/tmp/leicarb_parent_{idx}.sh').write_text('\n'.join(out) + '\n')
          PY
          for s in /tmp/leicarb_parent_*.sh; do
            echo "===== replay $s ====="
            bash "$s"
          done

      - name: Apply workspace-only LEICARB1A experiment
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-leicarb1a-eagreen-rggb-experiment.py "$ROOT"
          grep -n 'LEICARB1A_EAGREEN_RGGB\|M9LeicaRbExperiment.applyDirect\|leicaRbExperimentApplied\|leicaRbAdapter' \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" | tee LEICARB1A_JAVA_ANCHORS.txt
          grep -n 'LEICARB1A_EAGREEN_RGGB\|m9_leicarb_avg2_bits\|M9LeicaRbExperiment_applyDirect' \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" | tee LEICARB1A_NATIVE_ANCHORS.txt
          test -f "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9LeicaRbExperiment.java"

      - name: Guard experiment isolation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          grep -q 'LEICARB1A_EAGREEN_RGGB_BEGIN' "$ROOT/app/src/main/cpp/m9color_jni.cpp"
          grep -q 'experimental_rawgrid_adapter_not_full_m9_pre_green_pipeline' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          grep -q 'Imgproc.COLOR_BayerRG2BGR_EA' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          grep -q 'M9NativeColorCore.createContext' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          grep -q 'tc20MeterNative' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          grep -q 'COLORNATIVE2A' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          mkdir -p leicarb1a-evidence
          cp LEICARB1A_JAVA_ANCHORS.txt LEICARB1A_NATIVE_ANCHORS.txt leicarb1a-evidence/
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9LeicaRbExperiment.java" \
            > leicarb1a-evidence/ASSEMBLED_SHA256.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build LEICARB1A debug APK
        shell: bash
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/LEICARB1A_GRADLE.log"

      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee LEICARB1A_APK_SHA256.txt

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-LEICARB1A-EAGREEN-RGGB-EVIDENCE
          path: |
            leicarb1a-evidence/
            LEICARB1A_GRADLE.log
          if-no-files-found: ignore

      - name: Upload research APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-LEICARB1A-EAGREEN-RGGB-ANDROID-EXPERIMENT
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            LEICARB1A_APK_SHA256.txt
