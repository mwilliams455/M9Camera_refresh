name: Build M9Cam LEICARB1A EA-Green RGGB Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpness-rbclosure1d-packedphase1a
    paths:
      - '.github/workflows/build-m9cam-leicarb1a-eagreen-rggb-experiment.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replay exact SHARPSOURCE1C RBANCHOR1A assembled baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-sharpness-sharpsource1c-rbanchor1a.yml')
          lines = wf.read_text().splitlines()
          names = [
              'Verify patch syntax',
              'Replay exact UPSTREAMAXIS1A parent assembly',
              'Assemble frozen neutral-MHC parent',
              'Assemble SHARPSOURCE1C RBANCHOR1A',
          ]
          for idx, name in enumerate(names):
              target = '      - name: ' + name
              i = lines.index(target)
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit('baseline run block missing: ' + name)
              i += 1
              out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif not line.strip():
                      out.append('')
                  else:
                      raise SystemExit('unexpected baseline indentation: ' + line)
                  i += 1
              Path(f'/tmp/leicarb_parent_{idx}.sh').write_text('\n'.join(out) + '\n')
          PY
          for s in /tmp/leicarb_parent_*.sh; do
            echo "===== replay $s ====="
            bash "$s"
          done

      - name: Apply workspace-only LEICARB1A EA-green RGGB experiment
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          java_dir = root / 'app/src/main/java/com/particlesdevs/photoncamera/m9/render'
          renderer = java_dir / 'M9R35Renderer.java'
          native = root / 'app/src/main/cpp/m9color_jni.cpp'
          bridge = java_dir / 'M9LeicaRbExperiment.java'

          if not renderer.exists() or not native.exists():
              raise SystemExit('assembled baseline renderer/native source missing')

          bridge.write_text(r'''package com.particlesdevs.photoncamera.m9.render;

/**
 * LEICARB1A_EAGREEN_RGGB research-only bridge.
 *
 * This is deliberately not advertised as the complete Leica M9 demosaic. It preserves
 * OpenCV EA green and the EA border, while applying Leica-derived signed R/B difference
 * averaging to the normalized RGGB interior. The native library is already loaded by
 * M9NativeColorCore before this method is reached.
 */
final class M9LeicaRbExperiment {
    private M9LeicaRbExperiment() {}

    static native boolean applyDirect(long normalizedRaw16Address,
                                      long bgr16Address,
                                      int width,
                                      int height);
}
''')

          cpp_marker = '// LEICARB1A_EAGREEN_RGGB_BEGIN'
          cpp = native.read_text()
          if cpp_marker in cpp:
              raise SystemExit('LEICARB1A native experiment already present')
          cpp += r'''

// LEICARB1A_EAGREEN_RGGB_BEGIN
// Research-only Android A/B experiment.
//
// IMPORTANT: this is not claimed to reproduce the complete M9 pre-Green RAW-plane
// preparation. OpenCV EA supplies green and safe borders. The normalized RGGB interior
// uses the signed-16 averaging semantics closed against ASMRedBlueInterpolation1.
namespace {
static inline int16_t m9_leicarb_avg2_bits(int16_t a, int16_t b) {
    const uint16_t ua = static_cast<uint16_t>(a);
    const uint16_t ub = static_cast<uint16_t>(b);
    const uint32_t low = static_cast<uint32_t>(ua & 1u) + static_cast<uint32_t>(ub & 1u);
    const uint16_t out = static_cast<uint16_t>(
            static_cast<uint32_t>(ua >> 1) + static_cast<uint32_t>(ub >> 1) + (low >> 1));
    return static_cast<int16_t>(out);
}

static inline int16_t m9_leicarb_avg4_bits(int16_t a, int16_t b, int16_t c, int16_t d) {
    return m9_leicarb_avg2_bits(m9_leicarb_avg2_bits(a, b), m9_leicarb_avg2_bits(c, d));
}

static inline uint16_t m9_leicarb_clip14(int32_t v) {
    if (v < 0) return 0;
    if (v > 0x3fff) return 0x3fff;
    return static_cast<uint16_t>(v);
}
}

extern "C" JNIEXPORT jboolean JNICALL
Java_com_particlesdevs_photoncamera_m9_render_M9LeicaRbExperiment_applyDirect(
        JNIEnv*, jclass, jlong normalizedRaw16Address, jlong bgr16Address,
        jint width, jint height) {
    if (normalizedRaw16Address == 0 || bgr16Address == 0 || width < 4 || height < 4) {
        return JNI_FALSE;
    }

    const int w = static_cast<int>(width);
    const int h = static_cast<int>(height);
    const auto* raw = reinterpret_cast<const uint16_t*>(static_cast<uintptr_t>(normalizedRaw16Address));
    auto* bgr = reinterpret_cast<uint16_t*>(static_cast<uintptr_t>(bgr16Address));

    auto raw14 = [&](int y, int x) -> uint16_t {
        return static_cast<uint16_t>(raw[static_cast<size_t>(y) * w + x] >> 2);
    };
    auto green14 = [&](int y, int x) -> uint16_t {
        const size_t p = (static_cast<size_t>(y) * w + x) * 3u;
        return static_cast<uint16_t>(bgr[p + 1u] >> 2);
    };
    auto siteDiff = [&](int y, int x) -> int16_t {
        const uint16_t d = static_cast<uint16_t>(raw14(y, x) - green14(y, x));
        return static_cast<int16_t>(d);
    };
    auto addDiff = [&](int y, int x, int16_t d) -> uint16_t {
        return m9_leicarb_clip14(static_cast<int32_t>(green14(y, x)) + static_cast<int32_t>(d));
    };

    // COLOR_BayerRG2BGR_EA is the existing project assumption: RGGB with R at (even,even)
    // and B at (odd,odd). Keep a one-pixel EA border untouched for a safe A/B experiment.
    for (int y = 1; y < h - 1; ++y) {
        const bool yOdd = (y & 1) != 0;
        for (int x = 1; x < w - 1; ++x) {
            const bool xOdd = (x & 1) != 0;
            uint16_t r14;
            uint16_t b14;

            if (!yOdd && !xOdd) {
                // Native R site; B difference comes from four diagonal native B sites.
                r14 = raw14(y, x);
                b14 = addDiff(y, x, m9_leicarb_avg4_bits(
                        siteDiff(y - 1, x - 1), siteDiff(y - 1, x + 1),
                        siteDiff(y + 1, x - 1), siteDiff(y + 1, x + 1)));
            } else if (yOdd && xOdd) {
                // Native B site; R difference comes from four diagonal native R sites.
                b14 = raw14(y, x);
                r14 = addDiff(y, x, m9_leicarb_avg4_bits(
                        siteDiff(y - 1, x - 1), siteDiff(y - 1, x + 1),
                        siteDiff(y + 1, x - 1), siteDiff(y + 1, x + 1)));
            } else if (!yOdd) {
                // Green on an R row: horizontal R-G, vertical B-G.
                r14 = addDiff(y, x, m9_leicarb_avg2_bits(siteDiff(y, x - 1), siteDiff(y, x + 1)));
                b14 = addDiff(y, x, m9_leicarb_avg2_bits(siteDiff(y - 1, x), siteDiff(y + 1, x)));
            } else {
                // Green on a B row: vertical R-G, horizontal B-G.
                r14 = addDiff(y, x, m9_leicarb_avg2_bits(siteDiff(y - 1, x), siteDiff(y + 1, x)));
                b14 = addDiff(y, x, m9_leicarb_avg2_bits(siteDiff(y, x - 1), siteDiff(y, x + 1)));
            }

            const size_t p = (static_cast<size_t>(y) * w + x) * 3u;
            bgr[p] = static_cast<uint16_t>(b14 << 2);
            // bgr[p+1] remains the exact OpenCV EA green estimate.
            bgr[p + 2u] = static_cast<uint16_t>(r14 << 2);
        }
    }
    return JNI_TRUE;
}
// LEICARB1A_EAGREEN_RGGB_END
'''
          native.write_text(cpp)

          text = renderer.read_text()
          if 'LEICARB1A_EAGREEN_RGGB' in text:
              raise SystemExit('renderer experiment already present')

          old_decl = '        long demosaicElapsedMs = -1L;\n'
          new_decl = (
              '        long demosaicElapsedMs = -1L;\n'
              '        long leicaRbExperimentElapsedMs = -1L;\n'
              '        boolean leicaRbExperimentApplied = false;\n'
          )
          if text.count(old_decl) != 1:
              raise SystemExit('demosaic timing declaration anchor not unique')
          text = text.replace(old_decl, new_decl, 1)

          old = '''            Imgproc.cvtColor(rawMat, cam16, Imgproc.COLOR_BayerRG2BGR_EA);
            rawMat.release();
            demosaicElapsedMs = (System.nanoTime() - demosaicStartedNs) / 1_000_000L;
'''
          new = '''            Imgproc.cvtColor(rawMat, cam16, Imgproc.COLOR_BayerRG2BGR_EA);
            final boolean leicaRbDirectEligible = rawMat.isContinuous()
                    && rawMat.channels() == 1
                    && rawMat.elemSize1() == 2L
                    && rawMat.step1() == (long)width
                    && rawMat.dataAddr() != 0L
                    && cam16.isContinuous()
                    && cam16.channels() == 3
                    && cam16.elemSize1() == 2L
                    && cam16.step1() == (long)width * 3L
                    && cam16.dataAddr() != 0L;
            long leicaRbStartedNs = System.nanoTime();
            if (leicaRbDirectEligible) {
                leicaRbExperimentApplied = M9LeicaRbExperiment.applyDirect(
                        rawMat.dataAddr(), cam16.dataAddr(), width, height);
            }
            leicaRbExperimentElapsedMs = (System.nanoTime() - leicaRbStartedNs) / 1_000_000L;
            Log.d(TAG, "LEICARB1A_EAGREEN_RGGB applied=" + leicaRbExperimentApplied
                    + " eligible=" + leicaRbDirectEligible
                    + " elapsedMs=" + leicaRbExperimentElapsedMs);
            rawMat.release();
            demosaicElapsedMs = (System.nanoTime() - demosaicStartedNs) / 1_000_000L;
'''
          if text.count(old) != 1:
              raise SystemExit('OpenCV EA demosaic seam anchor not unique')
          text = text.replace(old, new, 1)

          diag_anchor = '            d.put("demosaicElapsedMs", demosaicElapsedMs);\n'
          diag = (
              diag_anchor
              + '            d.put("demosaicMode", leicaRbExperimentApplied ? "EA_GREEN_LEICARB1A_RGGB_INTERIOR" : "OPENCV_EA_FALLBACK");\n'
              + '            d.put("leicaRbExperiment", "LEICARB1A_EAGREEN_RGGB");\n'
              + '            d.put("leicaRbExperimentApplied", leicaRbExperimentApplied);\n'
              + '            d.put("leicaRbExperimentElapsedMs", leicaRbExperimentElapsedMs);\n'
              + '            d.put("leicaRbAdapter", "normalized16_to_14_shift2_rggb_rawgrid_ea_green_ea_border1");\n'
              + '            d.put("leicaRbClaim", "experimental_rawgrid_adapter_not_full_m9_pre_green_pipeline");\n'
          )
          if text.count(diag_anchor) != 1:
              raise SystemExit('diagnostic anchor not unique')
          text = text.replace(diag_anchor, diag, 1)
          renderer.write_text(text)
          PY

          grep -n 'LEICARB1A_EAGREEN_RGGB\|M9LeicaRbExperiment.applyDirect\|leicaRbExperimentApplied\|leicaRbAdapter' \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" | tee LEICARB1A_JAVA_ANCHORS.txt
          grep -n 'LEICARB1A_EAGREEN_RGGB\|m9_leicarb_avg2_bits\|M9LeicaRbExperiment_applyDirect' \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" | tee LEICARB1A_NATIVE_ANCHORS.txt
          test -f "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9LeicaRbExperiment.java"

      - name: Guard experiment isolation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          grep -q 'LEICARB1A_EAGREEN_RGGB_BEGIN' "$ROOT/app/src/main/cpp/m9color_jni.cpp"
          grep -q 'experimental_rawgrid_adapter_not_full_m9_pre_green_pipeline' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          grep -q 'Imgproc.COLOR_BayerRG2BGR_EA' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          # Frozen photographic stages remain present after the seam.
          grep -q 'M9NativeColorCore.createContext' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          grep -q 'tc20MeterNative' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          grep -q 'COLORNATIVE2A' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          mkdir -p leicarb1a-evidence
          cp LEICARB1A_JAVA_ANCHORS.txt LEICARB1A_NATIVE_ANCHORS.txt leicarb1a-evidence/
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9LeicaRbExperiment.java" \
            > leicarb1a-evidence/ASSEMBLED_SHA256.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build LEICARB1A debug APK
        shell: bash
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/LEICARB1A_GRADLE.log"

      - name: Record APK SHA256
        if: success()
        shell: bash
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee LEICARB1A_APK_SHA256.txt

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-LEICARB1A-EAGREEN-RGGB-EVIDENCE
          path: |
            leicarb1a-evidence/
            LEICARB1A_GRADLE.log
          if-no-files-found: ignore

      - name: Upload research APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-LEICARB1A-EAGREEN-RGGB-ANDROID-EXPERIMENT
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            LEICARB1A_APK_SHA256.txt
