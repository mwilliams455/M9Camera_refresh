name: Build M9Cam SHARPNESS CLOSURETEST1B MODE4

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-closuretest1b-standard-mode4]
    paths:
      - 'patches/apply-m9cam-sharpness-closuretest1b.py'
      - 'patches/verify-m9cam-sharpness-closuretest1b.py'
      - '.github/workflows/build-m9cam-sharpness-closuretest1b.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-basishsm1p-demosaicmhc1a.py
          python3 -m py_compile patches/fix-m9cam-basishsm1p-demosaicmhc1a-lifetime1a.py
          python3 -m py_compile patches/verify-m9cam-basishsm1p-demosaicmhc1a.py
          python3 -m py_compile patches/apply-m9cam-basishsm1p-demosaicab1a.py
          python3 -m py_compile patches/verify-m9cam-basishsm1p-demosaicab1a.py
          python3 -m py_compile patches/apply-m9cam-basishsm1p-demosaicmhcneutral1a.py
          python3 -m py_compile patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a.py
          python3 -m py_compile patches/promote-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py
          python3 -m py_compile patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py
          python3 -m py_compile patches/apply-m9cam-sharpness-splitdemosaic1a.py
          python3 -m py_compile patches/verify-m9cam-sharpness-splitdemosaic1a.py
          python3 -m py_compile patches/apply-m9cam-sharpness-closuretest1a.py
          python3 -m py_compile patches/verify-m9cam-sharpness-closuretest1a.py
          python3 -m py_compile patches/apply-m9cam-sharpness-closuretest1b.py
          python3 -m py_compile patches/verify-m9cam-sharpness-closuretest1b.py

      - name: Replay exact UPSTREAMAXIS1A parent assembly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/build-m9cam-basishsm1p-curvedomain1c-upstreamaxis1a.yml')
          lines=wf.read_text().splitlines()
          names=['Replay exact CURVEDOMAIN1B parent assembly','Apply CURVEDOMAIN1C UPSTREAMAXIS1A read-only extension']
          for idx,name in enumerate(names):
              target='      - name: '+name
              i=lines.index(target)
              while i<len(lines) and lines[i].strip()!='run: |': i+=1
              if i>=len(lines): raise SystemExit('parent run block missing: '+name)
              i+=1; out=[]
              while i<len(lines):
                  line=lines[i]
                  if line.startswith('      - name:'): break
                  if line.startswith('          '): out.append(line[10:])
                  elif not line.strip(): out.append('')
                  else: raise SystemExit('unexpected parent indentation: '+line)
                  i+=1
              Path(f'/tmp/upstreamaxis_parent_{idx}.sh').write_text('\n'.join(out)+'\n')
          PY
          for s in /tmp/upstreamaxis_parent_*.sh; do bash "$s"; done

      - name: Assemble frozen neutral MHC parent
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-basishsm1p-demosaicmhc1a.py "$ROOT"
          python3 patches/fix-m9cam-basishsm1p-demosaicmhc1a-lifetime1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicmhc1a.py "$ROOT"
          python3 patches/apply-m9cam-basishsm1p-demosaicab1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicab1a.py "$ROOT"
          python3 patches/apply-m9cam-basishsm1p-demosaicmhcneutral1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a.py "$ROOT"
          python3 patches/promote-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py "$ROOT"

      - name: Apply split seam, verified 1A parent, then 1B mode4 delta
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-sharpness-splitdemosaic1a.py "$ROOT"
          python3 patches/verify-m9cam-sharpness-splitdemosaic1a.py "$ROOT"
          python3 patches/apply-m9cam-sharpness-closuretest1a.py "$ROOT"
          python3 patches/verify-m9cam-sharpness-closuretest1a.py "$ROOT" | tee CLOSURETEST1A_PARENT_VERIFY.txt
          python3 patches/apply-m9cam-sharpness-closuretest1b.py "$ROOT"
          python3 patches/verify-m9cam-sharpness-closuretest1b.py "$ROOT" | tee CLOSURETEST1B_VERIFY.txt

      - name: Snapshot research source
        run: |
          set -euo pipefail
          mkdir -p assembled-closuretest1b
          cp PhotonCamera/app/src/main/cpp/m9color_jni.cpp assembled-closuretest1b/
          cp CLOSURETEST1A_PARENT_VERIFY.txt assembled-closuretest1b/
          cp CLOSURETEST1B_VERIFY.txt assembled-closuretest1b/
          grep -n 'SHARPNESS_CLOSURETEST1A\|SHARPNESS_CLOSURETEST1B\|m9ClosureQ14\|m9ClosureSlot0Coeff\|baseCorr\|doubledCorr\|closureSharp14\|const int dr=\|const int db=' PhotonCamera/app/src/main/cpp/m9color_jni.cpp > assembled-closuretest1b/CLOSURE_ANCHORS.txt
          sha256sum assembled-closuretest1b/* | tee assembled-closuretest1b/SHA256SUMS.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build debug APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/CLOSURETEST1B_GRADLE.log"

      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee CLOSURETEST1B_APK_SHA256.txt

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-CLOSURETEST1B-ASSEMBLED-SOURCE
          path: assembled-closuretest1b/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-CLOSURETEST1B-BUILDLOG
          path: CLOSURETEST1B_GRADLE.log
          if-no-files-found: ignore

      - name: Upload research APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-SHARPNESS-CLOSURETEST1B-ISO160-STANDARD-MODE4
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            CLOSURETEST1B_APK_SHA256.txt
            CLOSURETEST1A_PARENT_VERIFY.txt
            CLOSURETEST1B_VERIFY.txt
