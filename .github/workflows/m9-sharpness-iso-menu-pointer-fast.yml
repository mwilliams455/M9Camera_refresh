name: M9 Sharpness ISO Menu Pointer Fast

on:
  workflow_dispatch:
  push:
    branches: [research/sharpnessforensics1a]
    paths:
      - '.github/workflows/m9-sharpness-iso-menu-pointer-fast.yml'
      - 'tools/recover_m9_key_from_shared_body.py'
      - 'tools/m9_sharpness_gateb_control_trace.py'

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Decode ISO menu pointer descriptors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9isomenu/evidence"
          curl -sS --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9isomenu/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl -sS --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9isomenu/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_m9_key_from_shared_body.py "$RUNNER_TEMP/m9isomenu/m9.upd" "$RUNNER_TEMP/m9isomenu/mm.upm" --m9-out "$RUNNER_TEMP/m9isomenu/m9.dec" --meta-out "$RUNNER_TEMP/m9isomenu/evidence/recovery_meta.json" >/dev/null
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$RUNNER_TEMP/m9isomenu/m9.dec" | sha256sum -c --strict
          python3 - <<'PY'
          import importlib.util,os,pathlib,sys,hashlib,struct,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9isomenu'; ev=root/'evidence'
          spec=importlib.util.spec_from_file_location('gateb',pathlib.Path('tools/m9_sharpness_gateb_control_trace.py'))
          m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          bf=m.get_bf547((root/'m9.dec').read_bytes())
          if hashlib.sha256(bf).hexdigest()!=m.BF_SHA: raise SystemExit('BF547 hash mismatch')
          labels=['AUTO ISO','PULL 80','ISO 160','ISO 200','ISO 250','ISO 320','ISO 400','ISO 500','ISO 640','ISO 800','ISO 1000','ISO 1250','ISO 1600','ISO 2000','ISO 2500']
          strings=[]
          for lab in labels:
            p=bf.find(lab.encode()+b'\0')
            if p<0:p=bf.find(lab.encode())
            strings.append({'label':lab,'offset':p,'runtime':p+0x20000})
          ptrhits=[]
          for s in strings:
            for kind,val in [('runtime',s['runtime']),('offset',s['offset'])]:
              pat=struct.pack('<I',val); st=0
              while True:
                p=bf.find(pat,st)
                if p<0:break
                ptrhits.append({'label':s['label'],'kind':kind,'target':hex(val),'pointer_offset':hex(p),'pointer_runtime':hex(p+0x20000),'mod4':p&3})
                st=p+1
          # Group pointer hits into local clusters; dump surrounding aligned u32 records.
          clusters=[]
          for h in ptrhits:
            p=int(h['pointer_offset'],16)
            nearby=[x for x in ptrhits if abs(int(x['pointer_offset'],16)-p)<=512]
            labels_here=sorted(set(x['label'] for x in nearby))
            if len(labels_here)>=5:
              lo=min(int(x['pointer_offset'],16) for x in nearby); hi=max(int(x['pointer_offset'],16) for x in nearby)+4
              clusters.append({'lo':hex(lo),'hi':hex(hi),'labels':labels_here,'hits':nearby})
          # dedup clusters by range
          uniq=[]; seen=set()
          for c in clusters:
            key=(c['lo'],c['hi'])
            if key not in seen:seen.add(key);uniq.append(c)
          dumps=[]
          for ci,c in enumerate(uniq[:20]):
            lo=max(0,int(c['lo'],16)-128); hi=min(len(bf),int(c['hi'],16)+128)
            lo-=lo%4
            words=[]
            for p in range(lo,hi,4):
              w=struct.unpack('<I',bf[p:p+4])[0] if p+4<=len(bf) else None
              target=next((s['label'] for s in strings if w in (s['offset'],s['runtime'])),None)
              words.append({'offset':hex(p),'runtime':hex(p+0x20000),'u32':w,'hex':hex(w) if w is not None else None,'points_to_label':target})
            dumps.append({'cluster':c,'words':words})
          # Search regular descriptor strides containing pointers to labels in UI order.
          ordered=[]
          runtime_by_label={s['label']:s['runtime'] for s in strings}
          offset_by_label={s['label']:s['offset'] for s in strings}
          for mode,tmap in [('runtime',runtime_by_label),('offset',offset_by_label)]:
            for stride in range(4,65,4):
              for field in range(0,stride,4):
                first=struct.pack('<I',tmap[labels[0]])
                st=0
                while True:
                  q=bf.find(first,st)
                  if q<0:break
                  start=q-field
                  if start>=0 and all(start+i*stride+field+4<=len(bf) and struct.unpack('<I',bf[start+i*stride+field:start+i*stride+field+4])[0]==tmap[lab] for i,lab in enumerate(labels)):
                    ordered.append({'mode':mode,'start':hex(start),'runtime':hex(start+0x20000),'stride':stride,'pointer_field':hex(field)})
                  st=q+1
          out={'schema':'m9.sharpness.iso-menu-pointer.v1','strings':[{**s,'offset':hex(s['offset']),'runtime':hex(s['runtime'])} for s in strings],
               'pointer_hits':ptrhits,'clusters':dumps,'ordered_descriptor_runs':ordered}
          (ev/'iso_menu_pointer_report.json').write_text(json.dumps(out,indent=2)+'\n')
          with open(ev/'iso_menu_pointer_report.txt','w') as f:
            f.write('STRINGS\n'+json.dumps(out['strings'],indent=2)+'\nORDERED RUNS\n'+json.dumps(ordered,indent=2)+'\n')
            for d in dumps:
              f.write('\nCLUSTER '+json.dumps(d['cluster'],indent=2)+'\n')
              for w in d['words']:
                if w['points_to_label'] or int(w['offset'],16)%16==0:f.write(json.dumps(w)+'\n')
          print(json.dumps({'string_count':len(strings),'pointer_hits':len(ptrhits),'clusters':len(uniq),'ordered_runs':ordered},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-ISO-MENU-POINTER
          retention-days: 30
          path: ${{ runner.temp }}/m9isomenu/evidence/*
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/m9isomenu/m9.upd" "$RUNNER_TEMP/m9isomenu/mm.upm" "$RUNNER_TEMP/m9isomenu/m9.dec"
