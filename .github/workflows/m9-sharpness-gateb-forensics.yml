name: M9 Sharpness Gate B Forensics

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpnessforensics1a
    paths:
      - '.github/workflows/m9-sharpness-gateb-forensics.yml'
      - 'tools/recover_m9_key_from_shared_body.py'
      - 'tools/m9_sharpness_gateb_probe.py'

permissions:
  contents: read

jobs:
  gateb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Download public Leica firmware mirrors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9_gateb"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/m9_gateb/m9-1_216.upd" \
            'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/m9_gateb/Mm-1_022.upm" \
            'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'

          echo 'Downloaded hashes:'
          sha256sum "$RUNNER_TEMP/m9_gateb/m9-1_216.upd" "$RUNNER_TEMP/m9_gateb/Mm-1_022.upm"

          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$RUNNER_TEMP/m9_gateb/m9-1_216.upd" | sha256sum --check --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$RUNNER_TEMP/m9_gateb/Mm-1_022.upm" | sha256sum --check --strict

      - name: Recover shared XOR key and canonical decrypted M9
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/recover_m9_key_from_shared_body.py \
            "$RUNNER_TEMP/m9_gateb/m9-1_216.upd" \
            "$RUNNER_TEMP/m9_gateb/Mm-1_022.upm" \
            --m9-out "$RUNNER_TEMP/m9_gateb/m9-1_216.decrypted.upd" \
            --meta-out "$RUNNER_TEMP/m9_gateb/recovery_meta.json"

          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$RUNNER_TEMP/m9_gateb/m9-1_216.decrypted.upd" | sha256sum --check --strict
          cat "$RUNNER_TEMP/m9_gateb/recovery_meta.json"

      - name: Run strict M9 Sharpness Gate B probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9_gateb/report"
          python3 tools/m9_sharpness_gateb_probe.py \
            --firmware "$RUNNER_TEMP/m9_gateb/m9-1_216.decrypted.upd" \
            --out "$RUNNER_TEMP/m9_gateb/report"
          cat "$RUNNER_TEMP/m9_gateb/report/gateb_report.json"

      - name: Publish evidence only
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESSFORENSICS1A-GATEB
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/m9_gateb/recovery_meta.json
            ${{ runner.temp }}/m9_gateb/report/gateb_report.json

      - name: Remove firmware/key material from runner workspace
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/m9_gateb/m9-1_216.upd" \
                "$RUNNER_TEMP/m9_gateb/Mm-1_022.upm" \
                "$RUNNER_TEMP/m9_gateb/m9-1_216.decrypted.upd"
