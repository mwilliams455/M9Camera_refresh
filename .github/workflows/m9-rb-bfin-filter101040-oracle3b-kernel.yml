name: M9 R/B BFINORACLE3B Filter101040 Kernel Phase

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-bfin-filter101040-oracle3b-kernel.yml'
      - 'research/bfin/filter101040_oracle_observe_phase.s'

permissions:
  contents: read

jobs:
  kernel-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Blackfin toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          curl --fail --location --retry 4 --retry-all-errors -o gdb-17.2.tar.xz https://ftp.gnu.org/gnu/gdb/gdb-17.2.tar.xz
          tar -xf binutils-2.44.tar.xz; tar -xf gdb-17.2.tar.xz
          mkdir binutils-build && cd binutils-build
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-sim >/dev/null
          make -j2 all-binutils all-gas all-ld >/dev/null
          echo "BFIN_AS=$PWD/gas/as-new" >> "$GITHUB_ENV"; echo "BFIN_LD=$PWD/ld/ld-new" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"; mkdir gdb-build && cd gdb-build
          ../gdb-17.2/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gdbserver >/dev/null
          make -j2 all-sim >/dev/null
          SIM=$(find "$PWD" -type f \( -path '*/sim/bfin/run' -o -name 'bfin-elf-run' \) -perm -111 | head -1 || true); test -n "$SIM"; echo "BFIN_SIM=$SIM" >> "$GITHUB_ENV"
      - name: Recover exact Leica filter body
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/bfinfilter3b"; mkdir -p "$ROOT/evidence"
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json"
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass"
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'bfinfilter3b'; d=json.load(open(root/'pass/report.json')); expected='c09c342ca374a32eb08b86b8136c27af403ccad5eba57aa25aee6c0526e30389'; addr=0xffa000be; size=0x190
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py'); m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          found=None
          for i,_ in enumerate(d.get('bf561_deep',[])):
            try:
              bf0=next((root/'pass'/f'bf561_pair_{i:02d}').rglob('bf0.bin')); _,blocks=m.parse_ldr(bf0); body=m.read_overlay(blocks,addr,size)
              if hashlib.sha256(body).hexdigest()==expected: found=body; break
            except Exception: pass
          if found is None: raise SystemExit('canonical filter body not found')
          (root/'ASMFilter_101_040_101_An.bin').write_bytes(found)
          PY
      - name: Observe kernel and both source phases
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/bfinfilter3b"; cp research/bfin/filter101040_oracle_observe_phase.s "$ROOT/"
          cat > "$ROOT/oracle.ld" <<'LDS'
          ENTRY(_start)
          SECTIONS {
            . = 0x1000; .text : { *(.text.start) *(.text*) }
            . = 0x4000; .source : { *(.source) }
            . = 0x7000; .out1 : { *(.out1) }
            . = 0x8000; .out2 : { *(.out2) }
            . = 0x9800; .stack : { *(.stack) }
          }
          LDS
          cd "$ROOT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          N=2048; stride=8; inner=4; outer=2
          def write(vals): pathlib.Path('source_data.inc').write_text(''.join(f'.short 0x{v&0xffff:04x}\n' for v in vals))
          specs=[('zero',{}),('const1000',{'const':1000})]
          for amp in (1,2,3,4,5,6,7,8,9,15,16,17,31,32,33,1000,16383): specs.append((f'center_{amp}',{0:amp}))
          for off in (-9,-7,7,9): specs.append((f'diag_{off:+d}_1000',{off:1000}))
          for off in (-8,-1,1,8): specs.append((f'nontap_{off:+d}_1000',{off:1000}))
          specs += [('all_diag_1',{-9:1,-7:1,7:1,9:1}),('center1_diag4x1',{-9:1,-7:1,0:1,7:1,9:1}),('mixed',{-9:3,-7:5,0:7,7:11,9:13})]
          ev=pathlib.Path('evidence'); report={'schema':'m9.bfinoracle3b.filter101040-kernel-phase.v1','routine_sha256':'c09c342ca374a32eb08b86b8136c27af403ccad5eba57aa25aee6c0526e30389','cases':{}}
          for phase,srcbase in [('phase0',0x4400),('phase1',0x4402)]:
            center=(srcbase-0x4000)//2
            for name,m in specs:
              if 'const' in m: src=[m['const']]*N
              else:
                src=[0]*N
                for off,val in m.items(): src[center+off]=val
              write(src); key=f'{phase}_{name}'
              subprocess.run([os.environ['BFIN_AS'],'--defsym',f'INNER={inner}','--defsym',f'OUTER={outer}','--defsym',f'STRIDE={stride}','--defsym',f'SRCBASE={srcbase}','filter101040_oracle_observe_phase.s','-o',f'{key}.o'],check=True,stdout=subprocess.DEVNULL)
              subprocess.run([os.environ['BFIN_LD'],'-T','oracle.ld',f'{key}.o','-o',f'{key}.elf'],check=True,stdout=subprocess.DEVNULL)
              p=subprocess.run([os.environ['BFIN_SIM'],f'{key}.elf'],capture_output=True,text=True)
              if p.returncode: raise SystemExit(f'{key}: rc={p.returncode}: {p.stderr}')
              vals=[int(x,16) for x in re.findall(r'DBG\s*:\s*R0\s*=\s*0x([0-9a-fA-F]+)',p.stdout)]
              if len(vals)!=128: raise SystemExit(f'{key}: dbg={len(vals)}')
              def half(ds):
                z=[]
                for q in ds:z += [q&0xffff,(q>>16)&0xffff]
                return z
              h1=half(vals[:64]); h2=half(vals[64:]); s=lambda v:v-65536 if v&0x8000 else v
              report['cases'][key]={'phase':phase,'srcbase':hex(srcbase),'center_halfword':center,'pattern':name,'out1_changed':[{'index':i,'u16':v,'s16':s(v)} for i,v in enumerate(h1) if v!=0x1357],'out2_changed':[{'index':i,'u16':v,'s16':s(v)} for i,v in enumerate(h2) if v!=0x2468]}
          raw=(json.dumps(report,indent=2)+'\n').encode(); (ev/'filter101040_kernel_phase.json').write_bytes(raw); (ev/'filter101040_kernel_phase.sha256.txt').write_text(hashlib.sha256(raw).hexdigest()+'  filter101040_kernel_phase.json\n'); print(json.dumps({'case_count':len(report['cases'])},indent=2))
          PY
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-BFINORACLE3B-FILTER101040-KERNEL-PHASE
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/bfinfilter3b/evidence/*
      - name: Remove firmware and binaries
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/bfinfilter3b/pass" "$RUNNER_TEMP/bfinfilter3b/m9.upd" "$RUNNER_TEMP/bfinfilter3b/mm.upm" "$RUNNER_TEMP/bfinfilter3b/m9.dec" "$RUNNER_TEMP/bfinfilter3b/ASMFilter_101_040_101_An.bin" "$RUNNER_TEMP/bfinfilter3b"/*.o "$RUNNER_TEMP/bfinfilter3b"/*.elf
