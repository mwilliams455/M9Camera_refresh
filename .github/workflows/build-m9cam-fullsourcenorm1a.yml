name: Build M9Cam FULLSOURCENORM1A

on:
  workflow_dispatch:
  push:
    branches: [research/m9fullsourcenorm1a]
    paths:
      - 'patches/apply-m9cam-fullsourcenorm1a.py'
      - 'patches/verify-m9cam-fullsourcenorm1a.py'
      - '.github/workflows/build-m9cam-fullsourcenorm1a.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify experiment patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-fullsourcenorm1a.py
          python3 -m py_compile patches/verify-m9cam-fullsourcenorm1a.py
          python3 -m py_compile patches/apply-m9cam-sourcegeometryproof2a.py
          python3 -m py_compile patches/apply-m9cam-sourcegeometryproof2a-fix1.py
          python3 -m py_compile patches/verify-m9cam-sourcegeometryproof2a.py

      - name: Replay exact SOURCEGEOMETRYPROOF2A assembled parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-sourcegeometryproof2a.yml')
          lines = wf.read_text().splitlines()
          names = [
              'Verify SOURCEGEOMETRYPROOF2A patch syntax',
              'Replay exact M9SENSORTARGET1A assembled parent',
              'Freeze target and source-render assets before proof patch',
              'Apply zero-pixel-change acquisition geometry proof',
              'Prove target/native core assets unchanged',
          ]
          for idx, name in enumerate(names):
              target = '      - name: ' + name
              if target not in lines:
                  raise SystemExit('parent step missing: ' + name)
              i = lines.index(target)
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit('parent run block missing: ' + name)
              i += 1
              out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '): out.append(line[10:])
                  elif not line.strip(): out.append('')
                  else: raise SystemExit('unexpected parent indentation: ' + line)
                  i += 1
              Path(f'/tmp/fullsourcenorm1a_parent_{idx:02d}.sh').write_text('\n'.join(out) + '\n')
          PY
          for script in /tmp/fullsourcenorm1a_parent_*.sh; do
            echo "=== replay $script ==="
            bash "$script"
          done

      - name: Freeze target assets before A/B patch
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_r35_calibration.bin" \
            "$ROOT/app/src/main/assets/m9/m9_r35_calibration_manifest.json" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > FULLSOURCENORM1A_FROZEN_FILES_BEFORE.sha256

      - name: Apply gain-locked full source normalization A/B
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-fullsourcenorm1a.py "$ROOT" | tee FULLSOURCENORM1A_METHOD_FREEZE.txt
          python3 patches/verify-m9cam-fullsourcenorm1a.py "$ROOT" | tee FULLSOURCENORM1A_VERIFY.txt

      - name: Prove target assets unchanged by A/B patch
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_r35_calibration.bin" \
            "$ROOT/app/src/main/assets/m9/m9_r35_calibration_manifest.json" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > FULLSOURCENORM1A_FROZEN_FILES_AFTER.sha256
          diff -u FULLSOURCENORM1A_FROZEN_FILES_BEFORE.sha256 FULLSOURCENORM1A_FROZEN_FILES_AFTER.sha256

      - name: Snapshot assembled source
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/assembled-fullsourcenorm1a"
          mkdir -p "$OUT"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/ImageFrame.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/SaverImplementation.java" "$OUT/"
          cp FULLSOURCENORM1A_METHOD_FREEZE.txt FULLSOURCENORM1A_VERIFY.txt "$OUT/"
          cp FULLSOURCENORM1A_FROZEN_FILES_BEFORE.sha256 FULLSOURCENORM1A_FROZEN_FILES_AFTER.sha256 "$OUT/"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate runner Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk "${ANDROID_HOME:-/nonexistent}" "${ANDROID_SDK_ROOT:-/nonexistent}" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then echo 'No usable sdkmanager found' >&2; exit 1; fi
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build FULLSOURCENORM1A APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/FULLSOURCENORM1A_GRADLE.log"

      - name: Verify packaged candidate
        if: success()
        run: |
          set -euo pipefail
          APK="$(find PhotonCamera/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          rm -rf /tmp/fullsourcenorm1a-apk
          mkdir -p /tmp/fullsourcenorm1a-apk
          unzip -q "$APK" -d /tmp/fullsourcenorm1a-apk
          python3 - <<'PY' | tee FULLSOURCENORM1A_APK_PROOF.txt
          from pathlib import Path
          import hashlib, struct
          root = Path('/tmp/fullsourcenorm1a-apk')
          curve = root/'assets/m9/m9_curve02_firmware.bin'
          native = root/'lib/arm64-v8a/libm9color.so'
          cobalt = root/'assets/m9/m9_r35_calibration.bin'
          if not curve.exists() or not native.exists() or not cobalt.exists():
              raise SystemExit('required frozen asset missing')
          if hashlib.sha256(curve.read_bytes()).hexdigest() != '5b303ff7d9d47ecb8e193a648ddf0570fef46ad29a62d112993d37d52f8c135c':
              raise SystemExit('curve02 hash mismatch')
          b = native.read_bytes()
          sat2 = [13659,-4457,-1004,-2244,13469,-3033,-199,-6014,14398,
                  14811,-5604,-1004,-2455,13688,-3033,393,-6588,14398]
          if b''.join(struct.pack('<q', x) for x in sat2[:9]) not in b:
              raise SystemExit('SAT2 M04 missing')
          if b''.join(struct.pack('<q', x) for x in sat2[9:]) not in b:
              raise SystemExit('SAT2 M05 missing')
          dex = b''.join(p.read_bytes() for p in sorted(root.glob('classes*.dex')))
          markers = [
              b'SOURCEGEOMETRYPROOF2A',
              b'sourceGeometryProof2ARuntimeVerified',
              b'FULLSOURCENORM1A',
              b'm9cam.sourcefullnorm.v1a.sameraw_gainlocked',
              b'_M9_SOURCEFULLNORM1A_GAINLOCK.jpg',
              b'full_live_remaining_LensShadingMap_common_luma_alpha_1p0',
              b'SAT2_M04_M05_native_mode9',
              b'curve02',
          ]
          for marker in markers:
              ok = marker in dex
              print(marker.decode('ascii'), ok)
              if not ok: raise SystemExit('missing APK marker ' + marker.decode('ascii'))
          print('COBALT_CONTROL_ASSET_RETAINED', cobalt.exists())
          print('FULLSOURCENORM1A APK PROOF PASS')
          PY

      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee FULLSOURCENORM1A_APK_SHA256.txt

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-FULLSOURCENORM1A-ASSEMBLED-SOURCE
          path: assembled-fullsourcenorm1a/
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-FULLSOURCENORM1A-BUILDLOG
          path: FULLSOURCENORM1A_GRADLE.log
          if-no-files-found: ignore

      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-FULLSOURCENORM1A-SAMERAW-GAINLOCK
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            FULLSOURCENORM1A_APK_SHA256.txt
            FULLSOURCENORM1A_VERIFY.txt
            FULLSOURCENORM1A_METHOD_FREEZE.txt
            FULLSOURCENORM1A_APK_PROOF.txt
            FULLSOURCENORM1A_FROZEN_FILES_BEFORE.sha256
            FULLSOURCENORM1A_FROZEN_FILES_AFTER.sha256
