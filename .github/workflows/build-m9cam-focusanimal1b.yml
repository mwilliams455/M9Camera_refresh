name: M9Cam 3.00 Pet AF inference and diagnostic correction

on:
  pull_request:
    branches: ['codex/focusanimal1a-catdog']
    paths:
      - 'patches/focusanimal1b/**'
      - '.github/workflows/build-m9cam-focusanimal1b.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Provision pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Reconstruct exact prior M9 and Monochrom 2.98 source
        run: |
          python3 patches/diagindex1a/assemble.py "$RUNNER_TEMP/PhotonCamera_300"
          python3 patches/focussubject1a/apply_live.py "$RUNNER_TEMP/PhotonCamera_300" --report "$RUNNER_TEMP/EYE_PARENT_SOURCE_VERIFICATION.json"
          python3 patches/focusanimal1a/apply.py "$RUNNER_TEMP/PhotonCamera_300" --report "$RUNNER_TEMP/FOCUSANIMAL_PARENT_SOURCE_VERIFICATION.json"
          python3 patches/focusanimal1b/apply.py "$RUNNER_TEMP/PhotonCamera_300" --report "$RUNNER_TEMP/FOCUSANIMAL_SOURCE_VERIFICATION.json"
      - name: Obtain bundled official EfficientDet Lite0 COCO model
        run: |
          set -euo pipefail
          ASSETS="$RUNNER_TEMP/PhotonCamera_300/app/src/main/assets"
          mkdir -p "$ASSETS"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 180 \
            'https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/android/lite-model_efficientdet_lite0_detection_metadata_1.tflite' \
            -o "$ASSETS/efficientdet-lite0.tflite"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,json
          p=Path(os.environ['RUNNER_TEMP'])/'PhotonCamera_300/app/src/main/assets/efficientdet-lite0.tflite'
          data=p.read_bytes()
          assert 1024*1024 < len(data) < 25*1024*1024, len(data)
          assert data[4:8]==b'TFL3','Model is not a TFLite FlatBuffer'
          sha=hashlib.sha256(data).hexdigest()
          print(json.dumps({'model':'efficientdet-lite0.tflite','bytes':len(data),'sha256':sha}))
          (Path(os.environ['RUNNER_TEMP'])/'MODEL_SHA256.txt').write_text(sha+'  efficientdet-lite0.tflite\n')
          pinned=Path('patches/focusanimal1a/MODEL_SHA256.txt')
          if pinned.exists():
              expected=pinned.read_text().split()[0]
              assert expected==sha, f'Model digest mismatch: {sha} != {expected}'
          else:
              print('UNPINNED_MODEL_DISCOVERY: DO NOT SHIP until digest is committed and checked')
          PY
      - name: Run cat/dog and inherited human-eye Java host regressions
        run: |
          mkdir -p "$RUNNER_TEMP/pet-host"
          javac -Xlint:all -d "$RUNNER_TEMP/pet-host" \
            "$RUNNER_TEMP/PhotonCamera_300/app/src/main/java/com/particlesdevs/photoncamera/control/subject/PetTargetPolicy.java" \
            patches/focusanimal1b/host/PetTargetPolicyHostTest.java
          java -ea -cp "$RUNNER_TEMP/pet-host" PetTargetPolicyHostTest
          javac -Xlint:all -cp "$RUNNER_TEMP/pet-host" -d "$RUNNER_TEMP/pet-host" patches/focusanimal1b/host/PetRuntimeTimingTest.java
          java -ea -cp "$RUNNER_TEMP/pet-host" PetRuntimeTimingTest
          javac -Xlint:all -d "$RUNNER_TEMP/pet-host" \
            "$RUNNER_TEMP/PhotonCamera_300/app/src/main/java/com/particlesdevs/photoncamera/control/subject/SubjectFocusPolicy.java" \
            "$RUNNER_TEMP/PhotonCamera_300/app/src/main/java/com/particlesdevs/photoncamera/control/subject/HumanEyeAdmissionGate.java" \
            patches/focussubject1a/host/HumanEyeAdmissionGateHostTest.java
          java -ea -cp "$RUNNER_TEMP/pet-host" HumanEyeAdmissionGateHostTest
      - name: Build Android and regression-test M9/Monochrom focus and still capture
        run: |
          cd "$RUNNER_TEMP/PhotonCamera_300"
          bash gradlew :app:assembleDebug :app:testDebugUnitTest \
            --tests '*FocusTrackingAfTest' --tests '*FocusTrackingLifecycleTest' \
            --tests '*FocusPointLayoutTest' --tests '*TouchFocusTest' \
            --tests '*TouchFocusHandoverTest' --tests '*ProfileCaptureTest' \
            --no-daemon --max-workers=2
      - name: Download accepted signed 2.99 installer
        uses: actions/download-artifact@v4
        with:
          name: M9Cam-3.00-FOCUSANIMAL1B-READY-TO-INSTALL
          run-id: 40075188855
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/accepted299
      - name: Preserve 2.99 imaging and independently sign 3.00
        run: |
          mkdir -p "$RUNNER_TEMP/installer300"
          cp "$RUNNER_TEMP/FOCUSANIMAL_SOURCE_VERIFICATION.json" "$RUNNER_TEMP/installer300/SOURCE_VERIFICATION.json"
          cp "$RUNNER_TEMP/MODEL_SHA256.txt" "$RUNNER_TEMP/installer300/MODEL_SHA256.txt"
          python3 patches/focusanimal1b/package.py \
            "$RUNNER_TEMP/PhotonCamera_300" \
            "$RUNNER_TEMP/PhotonCamera_300/app/build/outputs/apk/debug/M9Cam_3.00_FOCUSANIMAL1B-debug.apk" \
            "$RUNNER_TEMP/accepted299/M9Cam_3.00_FOCUSANIMAL1B.apk" \
            "$ANDROID_HOME/build-tools/35.0.0" \
            "$RUNNER_TEMP/installer300"
      - name: Deliver signed cat/dog trial only after all verification
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-3.00-FOCUSANIMAL1B-READY-TO-INSTALL
          path: |
            ${{ runner.temp }}/installer300/M9Cam_3.00_FOCUSANIMAL1B.apk
            ${{ runner.temp }}/installer300/PACKAGED_VERIFICATION.json
            ${{ runner.temp }}/installer300/SOURCE_VERIFICATION.json
            ${{ runner.temp }}/installer300/MODEL_SHA256.txt
            ${{ runner.temp }}/installer300/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Retain diagnostics when a build gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focusanimal1b-build-evidence
          path: |
            ${{ runner.temp }}/MODEL_SHA256.txt
            ${{ runner.temp }}/FOCUSANIMAL_SOURCE_VERIFICATION.json
            ${{ runner.temp }}/PhotonCamera_300/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/PhotonCamera_300/app/build/test-results/testDebugUnitTest/**
            ${{ runner.temp }}/installer300/*.json
          retention-days: 14
          if-no-files-found: ignore
