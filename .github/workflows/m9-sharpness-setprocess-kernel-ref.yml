name: M9 Sharpness SetProcess Kernel Reference

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpnessforensics1a
    paths:
      - '.github/workflows/m9-sharpness-setprocess-kernel-ref.yml'
      - 'tools/recover_m9_key_from_shared_body.py'
      - 'tools/m9_sharpnessforensics1a_firmwarepass.py'
      - 'tools/m9_sharpnessforensics1a.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install or build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"
      - name: Download, verify and decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9sharp"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$RUNNER_TEMP/m9sharp/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$RUNNER_TEMP/m9sharp/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" --m9-out "$RUNNER_TEMP/m9sharp/m9.dec" --meta-out "$RUNNER_TEMP/m9sharp/recovery_meta.json"
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$RUNNER_TEMP/m9sharp/m9.dec" | sha256sum -c --strict
      - name: Extract coherent BF561 pair and targets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$RUNNER_TEMP/m9sharp/m9.dec" --out "$RUNNER_TEMP/m9sharp/pass"
          python3 - <<'PY'
          import json,os,pathlib,importlib.util,sys,hashlib
          rt=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp'; d=json.load(open(rt/'pass/report.json'))
          cand=[]
          for i,x in enumerate(d.get('bf561_deep',[])):
              t=x.get('detail',{}).get('targets',{}) if isinstance(x.get('detail'),dict) else {}
              cand.append((sum(k in t for k in ('Run','Process_Sharpness','Process_Noise','SetStructParameter')),x.get('covered',0),i))
          cand.sort(reverse=True); pair=cand[0][2]
          root=rt/'pass'/f'bf561_pair_{pair:02d}'
          spec=importlib.util.spec_from_file_location('base',pathlib.Path('tools/m9_sharpnessforensics1a.py'))
          m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          syms=m.parse_map(root/'bf0.map');_,blocks=m.parse_ldr(root/'bf0.bin')
          out=rt/'evidence';out.mkdir(exist_ok=True)
          manifest=[]
          wanted=('SetProcess','UM_Gauss3LUT','Process_Sharpness','Set','Run')
          for name in wanted:
              matches=[s for s in syms if s['name']==name and s['size']>0]
              for s in matches:
                  code=m.read_overlay(blocks,s['addr'],s['size'])
                  p=out/f"{name}_{s['addr']:08x}.bin";p.write_bytes(code)
                  manifest.append({'name':name,'addr':hex(s['addr']),'size':s['size'],'sha256':hashlib.sha256(code).hexdigest(),'file':p.name})
          # Global geometry and initial LDR contents (if BSS, read_overlay will be zero-filled).
          globals=[]
          for name in ('g_CurrentProcessingSetti','g_ProcessingList'):
              for s in [q for q in syms if q['name']==name]:
                  data=m.read_overlay(blocks,s['addr'],s['size'])
                  globals.append({'name':name,'addr':hex(s['addr']),'size':s['size'],'sha256':hashlib.sha256(data).hexdigest(),'nonzero_bytes':sum(b!=0 for b in data),'head64':data[:64].hex(' ')})
          # Infer optimized ASM kernel span to next mapped symbol even though map size=0.
          asm=[]
          ordered=sorted(syms,key=lambda s:s['addr'])
          for idx,s in enumerate(ordered):
              if s['name']!='ASMUMGauss3LUT': continue
              nxt=next((q for q in ordered[idx+1:] if q['addr']>s['addr']),None)
              span=(nxt['addr']-s['addr']) if nxt else 0
              asm.append({'addr':hex(s['addr']),'map_size':s['size'],'next_symbol':nxt['name'] if nxt else None,'next_addr':hex(nxt['addr']) if nxt else None,'inferred_span':span})
              if 0<span<=4096:
                  code=m.read_overlay(blocks,s['addr'],span);p=out/f"ASMUMGauss3LUT_{s['addr']:08x}.bin";p.write_bytes(code)
                  manifest.append({'name':'ASMUMGauss3LUT_inferred','addr':hex(s['addr']),'size':span,'sha256':hashlib.sha256(code).hexdigest(),'file':p.name})
          (out/'manifest.json').write_text(json.dumps({'pair':pair,'manifest':manifest,'globals':globals,'asm_spans':asm},indent=2)+'\n')
          print(json.dumps({'pair':pair,'targets':manifest,'globals':globals,'asm_spans':asm},indent=2))
          PY
          for f in "$RUNNER_TEMP/m9sharp/evidence"/*.bin; do
            bn=$(basename "$f" .bin); base=$(printf '%s' "$bn" | sed -nE 's/^.*_([0-9a-fA-F]{8})$/\1/p')
            test -n "$base" || continue
            "$OBJDUMP" -D -b binary -m bfin --adjust-vma="0x$base" "$f" > "$RUNNER_TEMP/m9sharp/evidence/${bn}.gnu.dis.txt"
          done
      - name: Summarize SetProcess and reference kernel evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re,json
          e=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp/evidence'
          summary={'setprocess':[],'um_reference':[],'asm':[]}
          for p in e.glob('SetProcess_*.gnu.dis.txt'):
              txt=p.read_text(errors='replace');summary['setprocess'].append({'file':p.name,'text':txt})
          for p in e.glob('UM_Gauss3LUT_*.gnu.dis.txt'):
              txt=p.read_text(errors='replace');summary['um_reference'].append({'file':p.name,'text':txt})
          for p in e.glob('ASMUMGauss3LUT_*.gnu.dis.txt'):
              txt=p.read_text(errors='replace');summary['asm'].append({'file':p.name,'text':txt})
          (e/'setprocess_kernel_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('SetProcess copies',len(summary['setprocess']),'UM refs',len(summary['um_reference']),'ASM copies',len(summary['asm']))
          PY
      - name: Publish derived text evidence only
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-SETPROCESS-KERNEL-REF
          retention-days: 30
          path: |
            ${{ runner.temp }}/m9sharp/evidence/*.json
            ${{ runner.temp }}/m9sharp/evidence/*.txt
            ${{ runner.temp }}/m9sharp/recovery_meta.json
      - name: Remove firmware/binaries
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/m9sharp/pass" "$RUNNER_TEMP/m9sharp/evidence"/*.bin "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" "$RUNNER_TEMP/m9sharp/m9.dec"
