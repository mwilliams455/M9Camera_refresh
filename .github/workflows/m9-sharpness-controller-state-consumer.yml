name: M9 Sharpness Controller State Consumer Trace

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpnessforensics1a
    paths:
      - '.github/workflows/m9-sharpness-controller-state-consumer.yml'
      - 'tools/recover_m9_key_from_shared_body.py'
      - 'tools/m9_sharpness_gateb_control_trace.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install or build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"

      - name: Download, verify and decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9sharp"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$RUNNER_TEMP/m9sharp/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$RUNNER_TEMP/m9sharp/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" --m9-out "$RUNNER_TEMP/m9sharp/m9.dec" --meta-out "$RUNNER_TEMP/m9sharp/recovery_meta.json"
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$RUNNER_TEMP/m9sharp/m9.dec" | sha256sum -c --strict

      - name: Extract canonical BF547
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, os, pathlib, sys, hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp'
          spec=importlib.util.spec_from_file_location('gateb', pathlib.Path('tools/m9_sharpness_gateb_control_trace.py'))
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          fw=(root/'m9.dec').read_bytes(); bf=m.get_bf547(fw)
          if hashlib.sha256(bf).hexdigest()!=m.BF_SHA: raise SystemExit('canonical BF547 hash mismatch')
          (root/'BF547.bin').write_bytes(bf)
          PY

      - name: Full BF547 GNU disassembly
        shell: bash
        run: |
          set -euo pipefail
          "$OBJDUMP" -D -b binary -m bfin --adjust-vma=0x20000 "$RUNNER_TEMP/m9sharp/BF547.bin" > "$RUNNER_TEMP/m9sharp/BF547.full.gnu.dis.txt"

      - name: Trace controller-state base and record-field consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp'
          lines=(root/'BF547.full.gnu.dis.txt').read_text(errors='replace').splitlines()
          are=re.compile(r'^\s*([0-9a-f]+):')

          def addr_of(i):
              m=are.match(lines[i]); return int(m.group(1),16) if m else None

          def write_windows(indices, path, before=45, after=90):
              spans=[]
              for idx in indices:
                  lo=max(0,idx-before); hi=min(len(lines),idx+after)
                  if spans and lo<=spans[-1][1]+2: spans[-1]=(spans[-1][0],max(spans[-1][1],hi))
                  else: spans.append((lo,hi))
              out=[]
              for n,(lo,hi) in enumerate(spans):
                  out.append(f'===== WINDOW {n} lines {lo+1}-{hi} ====='); out.extend(lines[lo:hi]); out.append('')
              (root/path).write_text('\n'.join(out)+'\n')
              return spans

          # Find exact register constructions of 0xE2FC8, the runtime pointer holding
          # the property-state array base used by the selector metadata initializer.
          refs=[]
          for i,l in enumerate(lines):
              ll=l.lower()
              mh=re.search(r'\b([pr][0-7])\.h = 0xe\b',ll)
              if not mh: continue
              reg=mh.group(1)
              for j in range(i+1,min(i+12,len(lines))):
                  ml=re.search(rf'\b{re.escape(reg)}\.l = 0x2fc8\b',lines[j].lower())
                  if ml:
                      refs.append({'hi_idx':i,'lo_idx':j,'register':reg,'runtime':hex(addr_of(i) or 0)})
                      break
          spans=write_windows([r['hi_idx'] for r in refs],'controller_state_base_e2fc8_contexts.txt',55,130)

          # Also pull the complete known initializer and the controller diagnostic field window.
          def slice_addr(start,end,path):
              chosen=[]
              for l in lines:
                  m=are.match(l)
                  if m and start<=int(m.group(1),16)<end: chosen.append(l)
              (root/path).write_text('\n'.join(chosen)+'\n')
          slice_addr(0x73d40,0x73fa0,'selector_metadata_initializer_73d40_73fa0.txt')
          slice_addr(0x6c800,0x6cc80,'processing_record_diagnostic_6c800_6cc80.txt')

          # Candidate record-byte operations in neighborhoods that reference controller state.
          # Keep this broad: +0x0c is our candidate Sharpness byte; +0x09..0x0e are its proven neighbors.
          candidate=[]
          op_re=re.compile(r'\b(?:B|W)?\[[^\]]*\+ 0x([0-9a-f]+)\]')
          for r in refs:
              lo=max(0,r['hi_idx']-80); hi=min(len(lines),r['hi_idx']+300)
              for k in range(lo,hi):
                  low=lines[k].lower()
                  if any(x in low for x in ('+ 0x9]', '+ 0xa]', '+ 0xb]', '+ 0xc]', '+ 0xd]', '+ 0xe]', '+ 0x10]')):
                      candidate.append({'state_ref_runtime':r['runtime'],'line_no':k+1,'text':lines[k]})
          (root/'controller_state_neighbor_field_ops.json').write_text(json.dumps(candidate,indent=2)+'\n')

          # Search for the characteristic 68-byte stride constant as an additional process-record clue.
          stride_hits=[i for i,l in enumerate(lines) if re.search(r'\b0x44\b',l.lower())]
          # Retain only stride hits reasonably near byte field operations 9..14.
          interesting=[]
          for i in stride_hits:
              lo=max(0,i-40); hi=min(len(lines),i+70)
              ctx='\n'.join(lines[lo:hi]).lower()
              if any(f'+ 0x{x:x}]' in ctx for x in range(9,15)):
                  interesting.append(i)
          write_windows(interesting,'stride44_record_field_contexts.txt',45,80)

          report={
              'schema':'m9.sharpness.controller-state-consumer.v1',
              'controller_state_pointer_global':'0xe2fc8',
              'selector4_destination_formula':'*[0xe2fc8] + 0x10',
              'e2fc8_reference_count':len(refs),
              'e2fc8_references':refs,
              'candidate_neighbor_field_ops_count':len(candidate),
              'stride44_context_count':len(interesting),
              'policy':'Only promote record+0x0c=nSharpness if a coherent copy/consumer path links state base+0x10 to processing record byte +0x0c.'
          }
          (root/'controller_state_consumer_report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Publish derived text evidence only
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-CONTROLLER-STATE-CONSUMER
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/m9sharp/controller_state_consumer_report.json
            ${{ runner.temp }}/m9sharp/controller_state_base_e2fc8_contexts.txt
            ${{ runner.temp }}/m9sharp/selector_metadata_initializer_73d40_73fa0.txt
            ${{ runner.temp }}/m9sharp/processing_record_diagnostic_6c800_6cc80.txt
            ${{ runner.temp }}/m9sharp/controller_state_neighbor_field_ops.json
            ${{ runner.temp }}/m9sharp/stride44_record_field_contexts.txt
            ${{ runner.temp }}/m9sharp/recovery_meta.json

      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" "$RUNNER_TEMP/m9sharp/m9.dec" "$RUNNER_TEMP/m9sharp/BF547.bin" "$RUNNER_TEMP/m9sharp/BF547.full.gnu.dis.txt"