name: Inspect M9 3.05 tracking sources for 3.06
on:
  push:
    branches: ['codex/m9-aftracking3a-v3.06']
    paths: ['.github/workflows/probe-m9-aftracking3a-source.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assemble 2.95 and layers through 3.01
        run: |
          python3 patches/diagindex1a/assemble.py "$RUNNER_TEMP/src306"
          python3 patches/focussubject1a/apply_live.py "$RUNNER_TEMP/src306"
          python3 patches/focusanimal1a/apply.py "$RUNNER_TEMP/src306"
          python3 patches/focusanimal1b/apply.py "$RUNNER_TEMP/src306"
          python3 patches/focusanimal1c/apply.py "$RUNNER_TEMP/src306"
      - name: Supply original pinned animal models for later overlays
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/src306/app/src/main/assets"
          mkdir -p "$assets"
          curl --fail --location --silent --show-error --retry 3 'https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/android/lite-model_efficientdet_lite0_detection_metadata_1.tflite' --output "$assets/efficientdet-lite0.tflite"
          curl --fail --location --silent --show-error --retry 3 'https://huggingface.co/litert-community/RTMPose-Animal-AP10K-LiteRT/resolve/main/rtm_animal_fp16.tflite' --output "$assets/rtm_animal_fp16.tflite"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          assets=Path(os.environ['RUNNER_TEMP'])/'src306/app/src/main/assets'
          for model,pin in (
            ('efficientdet-lite0.tflite','patches/focusanimal1a/MODEL_SHA256.txt'),
            ('rtm_animal_fp16.tflite','patches/focusanimaleye1a/MODEL_SHA256.txt')):
              assert hashlib.sha256((assets/model).read_bytes()).hexdigest()==Path(pin).read_text().split()[0]
          PY
      - name: Stage exact 3.05 accepted source
        run: |
          python3 patches/focusanimaleye1a/apply.py "$RUNNER_TEMP/src306"
          python3 patches/focusanimaleye1b/apply.py "$RUNNER_TEMP/src306"
          python3 patches/focuscontrol1a/apply.py "$RUNNER_TEMP/src306"
          python3 patches/aftracking2a/apply.py "$RUNNER_TEMP/src306"
      - name: Package narrowly selected authoritative tracker source and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil,json
          root=Path(os.environ['RUNNER_TEMP'])/'src306'
          out=Path(os.environ['RUNNER_TEMP'])/'tracking3a-probe'
          paths=[
           'app/src/main/java/com/particlesdevs/photoncamera/control/tracking/PatchTracker.java',
           'app/src/main/java/com/particlesdevs/photoncamera/control/tracking/TrackingGeometry.java',
           'app/src/main/java/com/particlesdevs/photoncamera/ui/camera/FocusTrackingController.java',
           'app/src/main/java/com/particlesdevs/photoncamera/capture/CaptureController.java',
           'app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/TrackingFocusView.java',
           'app/src/test/java/com/particlesdevs/photoncamera/ui/camera/FocusTrackingLifecycleTest.java',
           'app/src/test/java/com/particlesdevs/photoncamera/control/tracking/PatchTrackerTest.java',
           'app/src/main/java/com/particlesdevs/photoncamera/control/tracking/ArbitraryAfUpdateGate.java']
          for rel in paths:
            p=root/rel
            if p.exists():
              q=out/rel;q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
              print(rel,p.stat().st_size)
            else:print('MISSING',rel)
          (out/'SOURCE_PROBE_MANIFEST.json').write_text(json.dumps({'source':'exact 3.05 rebuilt','paths':paths},indent=2))
          PY
      - name: Upload source probe
        uses: actions/upload-artifact@v4
        with:
          name: m9-3.05-tracking-source-probe
          path: ${{ runner.temp }}/tracking3a-probe/
          if-no-files-found: error
          retention-days: 7
