name: M9 Sharpness ISO Slot Mapping

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpnessforensics1a
    paths:
      - '.github/workflows/m9-sharpness-iso-slot-mapping.yml'
      - 'tools/recover_m9_key_from_shared_body.py'
      - 'tools/m9_sharpness_gateb_control_trace.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install or build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"

      - name: Download verify decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9iso/evidence"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9iso/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9iso/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$RUNNER_TEMP/m9iso/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$RUNNER_TEMP/m9iso/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$RUNNER_TEMP/m9iso/m9.upd" "$RUNNER_TEMP/m9iso/mm.upm" --m9-out "$RUNNER_TEMP/m9iso/m9.dec" --meta-out "$RUNNER_TEMP/m9iso/evidence/recovery_meta.json"
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$RUNNER_TEMP/m9iso/m9.dec" | sha256sum -c --strict

      - name: Extract canonical BF547 and disassemble
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, os, pathlib, sys, hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9iso'
          spec=importlib.util.spec_from_file_location('gateb', pathlib.Path('tools/m9_sharpness_gateb_control_trace.py'))
          m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          fw=(root/'m9.dec').read_bytes(); bf=m.get_bf547(fw)
          if hashlib.sha256(bf).hexdigest()!=m.BF_SHA: raise SystemExit('canonical BF547 hash mismatch')
          (root/'BF547.bin').write_bytes(bf)
          print('BF547',len(bf),hashlib.sha256(bf).hexdigest())
          PY
          "$OBJDUMP" -D -b binary -m bfin --adjust-vma=0x20000 "$RUNNER_TEMP/m9iso/BF547.bin" > "$RUNNER_TEMP/m9iso/BF547.full.gnu.dis.txt"

      - name: Trace enum source and search ISO tables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, json, struct
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9iso'; ev=root/'evidence'
          bf=(root/'BF547.bin').read_bytes(); fw=(root/'m9.dec').read_bytes()
          lines=(root/'BF547.full.gnu.dis.txt').read_text(errors='replace').splitlines()
          are=re.compile(r'^\s*([0-9a-f]+):',re.I)
          def line_addr(i):
              m=are.match(lines[i]); return int(m.group(1),16) if m else None
          def collect(patterns,before=28,after=45):
              out=[]
              for i,l in enumerate(lines):
                  if any(re.search(p,l,re.I) for p in patterns):
                      out.append({'line':i+1,'addr':hex(line_addr(i) or 0),'text':l,'context':'\n'.join(lines[max(0,i-before):min(len(lines),i+after)])})
              return out

          refs={
            'state_40':collect([r'\+ 0x40\]']),
            'row_80':collect([r'\+ 0x80\]']),
            'selector_488':collect([r'\+ 0x488\]']),
            'stride_ac':collect([r'\b0xac\b']),
          }
          (ev/'bf547_state_iso_reference_contexts.json').write_text(json.dumps(refs,indent=2)+'\n')

          # Focus known proven transfer chain.
          slices=[]
          for lo,hi,name in [(0x36f80,0x37140,'serializer'),(0x376c0,0x37920,'state_source')]:
              body=[]
              for l in lines:
                  m=are.match(l)
                  if m and lo<=int(m.group(1),16)<hi: body.append(l)
              (ev/f'bf547_{name}_{lo:05x}_{hi:05x}.txt').write_text('\n'.join(body)+'\n')

          iso=[80,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500]
          iso_base=[160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500]
          blobs={'bf547':bf,'firmware':fw}
          seq_hits=[]
          for bname,data in blobs.items():
              for width,fmt in [(2,'H'),(4,'I')]:
                  for seqname,seq in [('full14',iso),('base13',iso_base)]:
                      pat=b''.join(struct.pack('<'+fmt,x) for x in seq)
                      start=0
                      while True:
                          p=data.find(pat,start)
                          if p<0: break
                          seq_hits.append({'blob':bname,'sequence':seqname,'width':width,'offset':hex(p)})
                          start=p+1
              # Also tolerate code/value pairs: byte enum followed by 16/32-bit ISO within short records.
          
          # Search ordered ISO-number clusters in printable ASCII and UTF-16LE strings.
          terms=['ISO','Auto ISO','Pull','80','160','200','250','320','400','500','640','800','1000','1250','1600','2000','2500']
          def printable_strings(data,minlen=3):
              out=[]
              for m in re.finditer(rb'[\x20-\x7e]{3,}',data):
                  try:s=m.group().decode('ascii')
                  except:continue
                  out.append((m.start(),s))
              return out
          string_hits=[]
          for bname,data in blobs.items():
              ss=printable_strings(data)
              for off,s in ss:
                  ls=s.lower()
                  if 'iso' in ls or 'sensitivity' in ls or 'pull' in ls or 'exposure' in ls:
                      string_hits.append({'blob':bname,'offset':hex(off),'string':s})
              # clusters in 8KiB windows containing many exact numeric string labels
              num_strings=[(off,s) for off,s in ss if s.strip() in {str(x) for x in iso}]
              for off,s in num_strings:
                  close=[(o,t) for o,t in num_strings if abs(o-off)<=4096]
                  vals=sorted(set(int(t) for _,t in close))
                  if len(vals)>=7:
                      string_hits.append({'blob':bname,'offset':hex(off),'numeric_cluster':vals,'cluster_members':[(hex(o),t) for o,t in close]})
                      break

          # Search isolated binary ISO values and look for dense windows containing most base sequence.
          dense=[]
          for bname,data in blobs.items():
              for width,fmt in [(2,'H'),(4,'I')]:
                  poss={x:[] for x in iso_base}
                  for x in iso_base:
                      pat=struct.pack('<'+fmt,x); st=0
                      while True:
                          p=data.find(pat,st)
                          if p<0:break
                          poss[x].append(p); st=p+1
                  candidates=[]
                  anchors=sum(poss.values(),[])
                  for a in anchors:
                      present=[x for x,ps in poss.items() if any(abs(p-a)<=1024 for p in ps)]
                      if len(present)>=9:
                          candidates.append({'anchor':hex(a),'present':present})
                          if len(candidates)>=20: break
                  if candidates:dense.append({'blob':bname,'width':width,'candidates':candidates})

          report={'schema':'m9.sharpness.iso-slot-mapping.v1',
                  'proven_decode':{'record9_eq_1':'lut0 special flag','record9_lt4_non1':'coerce4 -> lut0','record9_ge4':'lut_index=record9-4','codes_4_16':'lut_slots_0_12'},
                  'binary_exact_sequence_hits':seq_hits,
                  'semantic_string_hits':string_hits[:300],
                  'dense_binary_value_windows':dense,
                  'reference_counts':{k:len(v) for k,v in refs.items()},
                  'guard':'Do not label codes 4..16 as exact ISO values unless menu/table/symbol evidence closes semantics.'}
          (ev/'iso_slot_mapping_report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'seq_hits':len(seq_hits),'semantic_hits':len(string_hits),'dense':len(dense),'ref_counts':report['reference_counts']},indent=2))
          PY

      - name: Search decrypted firmware symbol text for ISO semantics
        shell: bash
        run: |
          set -euo pipefail
          strings -a -t x "$RUNNER_TEMP/m9iso/m9.dec" | grep -Ei '(^|[^A-Za-z])(ISO|Auto.?ISO|Sensitivity|Pull.?80|SetISO|GetISO|Iso|iso)([^A-Za-z]|$)' | head -n 1000 > "$RUNNER_TEMP/m9iso/evidence/firmware_iso_semantic_strings.txt" || true
          strings -a -t x "$RUNNER_TEMP/m9iso/BF547.bin" | grep -Ei '(^|[^A-Za-z])(ISO|Auto.?ISO|Sensitivity|Pull.?80|SetISO|GetISO|Iso|iso)([^A-Za-z]|$)' | head -n 1000 > "$RUNNER_TEMP/m9iso/evidence/bf547_iso_semantic_strings.txt" || true

      - name: Publish derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-ISO-SLOT-MAPPING
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/m9iso/evidence/*.json
            ${{ runner.temp }}/m9iso/evidence/*.txt

      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/m9iso/m9.upd" "$RUNNER_TEMP/m9iso/mm.upm" "$RUNNER_TEMP/m9iso/m9.dec" "$RUNNER_TEMP/m9iso/BF547.bin" "$RUNNER_TEMP/m9iso/BF547.full.gnu.dis.txt"
