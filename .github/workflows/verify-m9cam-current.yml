name: M9Cam current build, tests and CodeQL

on:
  pull_request:
    branches: ['main', 'codex/gallerypause1a-v2.88']
    paths: ['patches/**', 'scripts/ci/**', '.github/workflows/verify-m9cam-current.yml']
  push:
    branches: ['main']
    paths: ['patches/**', 'scripts/ci/**', '.github/workflows/verify-m9cam-current.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m9cam-current-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Provision pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Reconstruct and verify current source
        run: python3 scripts/ci/prepare_source.py "$GITHUB_WORKSPACE/ci-source"
      - name: Initialize Java and Kotlin analysis
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          source-root: ci-source/PhotonCamera_288
          threads: 2
      - name: Build and run all selected regression suites
        run: python3 scripts/ci/verify_tests.py "$GITHUB_WORKSPACE/ci-source/PhotonCamera_288" --run
      - name: Verify library release resources
        working-directory: ci-source/PhotonCamera_288
        run: bash gradlew :circularbarlib:verifyReleaseResources --no-daemon --max-workers=2
      - name: Analyze reconstructed production source
        uses: github/codeql-action/analyze@v4
        with:
          category: /m9cam-current/java-kotlin
          output: ci-reports/codeql
          wait-for-processing: true
      - name: Retain test results, scan results and scanned source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9cam-current-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-source/*_VERIFICATION.json
            ci-source/PhotonCamera_288/app/build/test-results/testDebugUnitTest/**
            ci-source/PhotonCamera_288/app/build/reports/tests/testDebugUnitTest/**
            ci-source/PhotonCamera_288/app/src/main/java/**
            ci-source/PhotonCamera_288/circularbarlib/src/main/java/**
            ci-reports/codeql/**
          retention-days: 30
          if-no-files-found: error
