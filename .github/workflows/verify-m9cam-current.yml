name: M9Cam current build, tests and CodeQL

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m9cam-current-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Git diffs contain compressed patches, not the reconstructed Java paths.
      # Analyze the whole reconstructed tree, including on pull requests.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Provision pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Reconstruct and verify current source
        # Assemble outside the checkout: historical git-format patches must not
        # resolve against the packaging repository's parent Git worktree.
        run: |
          python3 scripts/ci/prepare_314.py "$RUNNER_TEMP/ci-source" --dog-face
          mv "$RUNNER_TEMP/ci-source" "$GITHUB_WORKSPACE/ci-source"
      - name: Run tracking and focus policy checks against 3.39
        run: bash scripts/ci/test_tracking.sh ci-source/PhotonCamera_339
      - name: Initialize Java and Kotlin analysis
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          source-root: ci-source/PhotonCamera_339
          threads: 2
      - name: Build and run all selected regression suites
        run: python3 scripts/ci/verify_tests.py "$GITHUB_WORKSPACE/ci-source/PhotonCamera_339" --run
      - name: Verify library release resources
        working-directory: ci-source/PhotonCamera_339
        run: bash gradlew :circularbarlib:verifyReleaseResources --no-daemon --max-workers=2
      - name: Package and verify the 3.39 installer
        run: |
          source=ci-source/PhotonCamera_339
          installer=ci-source/installer
          mkdir -p "$installer"
          cp ci-source/verification/dogface1a.json "$installer/SOURCE_VERIFICATION.json"
          cp ci-source/verification/MODEL_PROVENANCE.json "$installer/"
          python3 patches/trackingrecovery1a/package.py "$source" \
            "$source/app/build/outputs/apk/debug/M9Cam_3.39_DOGFACE1A-debug.apk" \
            patches/trackingrecovery1a/baseline "$ANDROID_HOME/build-tools/35.0.0" "$installer"
      - name: Analyze reconstructed production source
        uses: github/codeql-action/analyze@v4
        with:
          category: /m9cam-current/java-kotlin
          output: ci-reports/codeql
          wait-for-processing: true
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-3.39-verified-installer
          path: ci-source/installer/
          if-no-files-found: error
          retention-days: 90
      - name: Retain test results, scan results and scanned source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9cam-current-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-source/verification/*.json
            ci-source/TEST_VERIFICATION.json
            ci-source/PhotonCamera_339/app/build/test-results/testDebugUnitTest/**
            ci-source/PhotonCamera_339/app/build/reports/tests/testDebugUnitTest/**
            ci-source/PhotonCamera_339/app/src/main/java/**
            ci-source/PhotonCamera_339/app/src/test/java/**
            ci-source/PhotonCamera_339/circularbarlib/src/main/java/**
            ci-reports/codeql/**
          retention-days: 30
          if-no-files-found: error
