name: M9 Sharpness Record Builder Closure

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpnessforensics1a
    paths:
      - '.github/workflows/m9-sharpness-record-builder-closure.yml'
      - 'tools/recover_m9_key_from_shared_body.py'
      - 'tools/m9_sharpness_gateb_control_trace.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install or build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"

      - name: Download, verify and decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9sharp"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$RUNNER_TEMP/m9sharp/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$RUNNER_TEMP/m9sharp/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" --m9-out "$RUNNER_TEMP/m9sharp/m9.dec" --meta-out "$RUNNER_TEMP/m9sharp/recovery_meta.json"
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$RUNNER_TEMP/m9sharp/m9.dec" | sha256sum -c --strict

      - name: Extract and disassemble canonical BF547
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, os, pathlib, sys, hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp'
          spec=importlib.util.spec_from_file_location('gateb', pathlib.Path('tools/m9_sharpness_gateb_control_trace.py'))
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          fw=(root/'m9.dec').read_bytes(); bf=m.get_bf547(fw)
          if hashlib.sha256(bf).hexdigest()!=m.BF_SHA: raise SystemExit('canonical BF547 hash mismatch')
          (root/'BF547.bin').write_bytes(bf)
          PY
          "$OBJDUMP" -D -b binary -m bfin --adjust-vma=0x20000 "$RUNNER_TEMP/m9sharp/BF547.bin" > "$RUNNER_TEMP/m9sharp/BF547.full.gnu.dis.txt"

      - name: Extract exact state-transfer and record-builder candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp'
          lines=(root/'BF547.full.gnu.dis.txt').read_text(errors='replace').splitlines()
          are=re.compile(r'^\s*([0-9a-f]+):')
          def addr(i):
              m=are.match(lines[i]); return int(m.group(1),16) if m else None
          def window(indices,before,after,path):
              spans=[]
              for i in indices:
                  lo=max(0,i-before); hi=min(len(lines),i+after)
                  if spans and lo<=spans[-1][1]+2: spans[-1]=(spans[-1][0],max(spans[-1][1],hi))
                  else: spans.append((lo,hi))
              out=[]
              for n,(lo,hi) in enumerate(spans):
                  out.append(f'===== WINDOW {n} lines {lo+1}-{hi} ====='); out.extend(lines[lo:hi]); out.append('')
              (root/path).write_text('\n'.join(out)+'\n')
              return [(addr(lo),addr(hi-1) if hi else None) for lo,hi in spans]

          # Exact downstream property offsets populated from selector slots:
          # Contrast +0x440, Sharp +0x444, plus neighboring +0x448/+0x44c.
          prop_indices=[]; prop_hits=[]
          rx=re.compile(r'\+ 0x(440|444|448|44c)\]')
          for i,l in enumerate(lines):
              m=rx.search(l.lower())
              if m:
                  prop_indices.append(i); prop_hits.append({'line':i+1,'runtime':hex(addr(i) or 0),'offset':'0x'+m.group(1),'text':l})
          prop_spans=window(prop_indices,55,110,'downstream_property_440_44c_all_contexts.txt')

          # Preserve the complete state-copy function neighborhood discovered at 0x37908.
          state_slice=[]
          for l in lines:
              m=are.match(l)
              if m and 0x37600 <= int(m.group(1),16) < 0x37c80: state_slice.append(l)
          (root/'state_copy_function_37600_37c80.txt').write_text('\n'.join(state_slice)+'\n')

          # All byte stores to the critical process-record range +9..+14.
          store_rx=re.compile(r'B\[P([0-7]) \+ 0x([0-9a-f]+)\] = R([0-7])')
          stores=[]; store_indices=[]
          for i,l in enumerate(lines):
              m=store_rx.search(l)
              if not m: continue
              off=int(m.group(2),16)
              if 9 <= off <= 14:
                  stores.append({'line':i+1,'runtime':hex(addr(i) or 0),'base_reg':'P'+m.group(1),'offset':hex(off),'src_reg':'R'+m.group(3),'text':l})
                  store_indices.append(i)
          window(store_indices,35,55,'record_byte_stores_09_0e_contexts.txt')

          # Candidate serializers: a ±220-line region containing both a downstream
          # property access and at least two byte stores in +9..+14.
          candidates=[]
          for pi in prop_indices:
              lo=max(0,pi-220); hi=min(len(lines),pi+220)
              nearby=[s for s in stores if lo <= s['line']-1 < hi]
              if len(nearby)>=2:
                  candidates.append({'property_runtime':hex(addr(pi) or 0),'property_line':pi+1,'property_text':lines[pi],'nearby_record_stores':nearby,'context':'\n'.join(lines[lo:hi])})
          (root/'property_to_record_candidate_windows.json').write_text(json.dumps(candidates,indent=2)+'\n')

          report={
              'schema':'m9.sharpness.record-builder-closure.v1',
              'downstream_property_hits':prop_hits,
              'downstream_property_hit_count':len(prop_hits),
              'critical_record_store_count':len(stores),
              'critical_record_stores':stores,
              'direct_property_record_candidate_count':len(candidates),
              'policy':'Contrast +0x440 is the control; only promote Sharp +0x444 -> record +0x0c if the serializer/copy path is directly supported.'
          }
          (root/'record_builder_closure_report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'property_hits':len(prop_hits),'record_stores':len(stores),'direct_candidates':len(candidates)},indent=2))
          PY

      - name: Publish derived text evidence only
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-RECORD-BUILDER-CLOSURE
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/m9sharp/record_builder_closure_report.json
            ${{ runner.temp }}/m9sharp/downstream_property_440_44c_all_contexts.txt
            ${{ runner.temp }}/m9sharp/state_copy_function_37600_37c80.txt
            ${{ runner.temp }}/m9sharp/record_byte_stores_09_0e_contexts.txt
            ${{ runner.temp }}/m9sharp/property_to_record_candidate_windows.json
            ${{ runner.temp }}/m9sharp/recovery_meta.json

      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" "$RUNNER_TEMP/m9sharp/m9.dec" "$RUNNER_TEMP/m9sharp/BF547.bin" "$RUNNER_TEMP/m9sharp/BF547.full.gnu.dis.txt"