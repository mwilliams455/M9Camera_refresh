name: Build M9Cam SOURCECOLORROLE1A

on:
  workflow_dispatch:
  push:
    branches: [research/m9ttl1a-sidecar]
    paths:
      - 'patches/apply-m9cam-sourcecolorrole1a.py'
      - 'patches/verify-m9cam-sourcecolorrole1a.py'
      - '.github/workflows/build-m9cam-sourcecolorrole1a.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify SOURCECOLORROLE1A patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-sourcecolorrole1a.py
          python3 -m py_compile patches/verify-m9cam-sourcecolorrole1a.py

      - name: Reconstruct exact M9TTL1A TONEBOUND050 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-m9ttl1a-sidecar.yml')
          lines = wf.read_text().splitlines()
          names = [
              'Reconstruct true SAT2 NATIVEFIX baseline',
              'Apply read-only tone forensics baseline',
              'Apply bounded TC20 authority baseline',
              'Snapshot frozen photographic core before TTL',
              'Apply reconstructed M9 TTL sidecar',
          ]
          for idx, name in enumerate(names):
              target = '      - name: ' + name
              i = lines.index(target)
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit('TTL baseline run block missing: ' + name)
              i += 1
              out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif not line.strip():
                      out.append('')
                  else:
                      raise SystemExit('unexpected TTL workflow indentation: ' + line)
                  i += 1
              Path(f'/tmp/sourcecolor_ttl_{idx:02d}.sh').write_text('\n'.join(out) + '\n')
          PY
          for s in /tmp/sourcecolor_ttl_*.sh; do
            echo "=== replay $s ==="
            bash "$s"
          done

      - name: Freeze non-candidate photographic core
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/M9CaptureMetadataWriter.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/M9TtlSidecar1A.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > SOURCECOLORROLE1A_FROZEN_BEFORE.sha256
          sha256sum "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" \
            > SOURCECOLORROLE1A_RENDERER_BEFORE.sha256

      - name: Apply SOURCECOLORROLE1A candidate
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-sourcecolorrole1a.py "$ROOT"
          python3 patches/verify-m9cam-sourcecolorrole1a.py "$ROOT" | tee SOURCECOLORROLE1A_VERIFY.txt
          sha256sum "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" \
            > SOURCECOLORROLE1A_RENDERER_AFTER.sha256
          if cmp -s SOURCECOLORROLE1A_RENDERER_BEFORE.sha256 SOURCECOLORROLE1A_RENDERER_AFTER.sha256; then
            echo 'SOURCECOLORROLE1A renderer unexpectedly unchanged' >&2
            exit 1
          fi

      - name: Prove downstream photographic core unchanged
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/M9CaptureMetadataWriter.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/M9TtlSidecar1A.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > SOURCECOLORROLE1A_FROZEN_AFTER.sha256
          diff -u SOURCECOLORROLE1A_FROZEN_BEFORE.sha256 SOURCECOLORROLE1A_FROZEN_AFTER.sha256
          grep -n 'm9SaturationMatrixPair\|m9SaturationState\|sourceColorRole1A\|toneBound1A' \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" \
            | tee SOURCECOLORROLE1A_ANCHORS.txt

      - name: Snapshot assembled candidate source
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/assembled-sourcecolorrole1a"
          mkdir -p "$OUT"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/M9CaptureMetadataWriter.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/M9TtlSidecar1A.java" "$OUT/"
          cp SOURCECOLORROLE1A_VERIFY.txt SOURCECOLORROLE1A_ANCHORS.txt "$OUT/"
          cp SOURCECOLORROLE1A_FROZEN_BEFORE.sha256 SOURCECOLORROLE1A_FROZEN_AFTER.sha256 "$OUT/"
          cp SOURCECOLORROLE1A_RENDERER_BEFORE.sha256 SOURCECOLORROLE1A_RENDERER_AFTER.sha256 "$OUT/"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate runner Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk "${ANDROID_HOME:-/nonexistent}" "${ANDROID_SDK_ROOT:-/nonexistent}" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then echo 'No usable sdkmanager found' >&2; exit 1; fi
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build SOURCECOLORROLE1A APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/SOURCECOLORROLE1A_GRADLE.log"

      - name: Verify packaged native SAT2 bank
        if: success()
        run: |
          set -euo pipefail
          APK="$(find PhotonCamera/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          rm -rf /tmp/sourcecolor-apk
          mkdir -p /tmp/sourcecolor-apk
          unzip -q "$APK" 'lib/arm64-v8a/libm9color.so' -d /tmp/sourcecolor-apk
          python3 - <<'PY' | tee SOURCECOLORROLE1A_APK_SAT2_PROOF.txt
          from pathlib import Path
          import struct
          b=Path('/tmp/sourcecolor-apk/lib/arm64-v8a/libm9color.so').read_bytes()
          sat2=[13659,-4457,-1004,-2244,13469,-3033,-199,-6014,14398,
                14811,-5604,-1004,-2455,13688,-3033,393,-6588,14398]
          p1=b''.join(struct.pack('<q',x) for x in sat2[:9])
          p2=b''.join(struct.pack('<q',x) for x in sat2[9:])
          ok1=p1 in b; ok2=p2 in b
          print('SAT2_M04_PRESENT', ok1)
          print('SAT2_M05_PRESENT', ok2)
          if not (ok1 and ok2): raise SystemExit(1)
          print('SOURCECOLORROLE1A APK SAT2 PROOF PASS')
          PY

      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee SOURCECOLORROLE1A_APK_SHA256.txt

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-SOURCECOLORROLE1A-ASSEMBLED-SOURCE
          path: assembled-sourcecolorrole1a/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-SOURCECOLORROLE1A-BUILDLOG
          path: SOURCECOLORROLE1A_GRADLE.log
          if-no-files-found: ignore

      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-SOURCECOLORROLE1A-M9TTL1A-TONEBOUND050
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            SOURCECOLORROLE1A_APK_SHA256.txt
            SOURCECOLORROLE1A_VERIFY.txt
            SOURCECOLORROLE1A_ANCHORS.txt
            SOURCECOLORROLE1A_APK_SAT2_PROOF.txt
