name: Build M9Cam TOEBANK1A CFAPORTABLEFIX

on:
  workflow_dispatch:
  push:
    branches: [research/m9toebank1a]
    paths:
      - '.github/workflows/build-m9cam-toebank1a-cfaportablefix.yml'
      - 'patches/apply-m9cam-toebank1a-cfaportablefix.py'
      - 'patches/verify-m9cam-toebank1a-cfaportablefix.py'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify CFA portability patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-toebank1a-cfaportablefix.py
          python3 -m py_compile patches/verify-m9cam-toebank1a-cfaportablefix.py

      - name: Replay exact successful TOEBANK1A assembled parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-toebank1a.yml')
          lines = wf.read_text().splitlines()
          names = [
              'Verify TOEBANK patch syntax',
              'Replay exact TONEBANK1A assembled parent',
              'Freeze source and target assets before toe isolation',
              'Apply bounded lower-tone bank',
              'Verify toe isolation contract',
          ]
          for idx, name in enumerate(names):
              target = '      - name: ' + name
              if target not in lines:
                  raise SystemExit('TOEBANK1A parent step missing: ' + name)
              i = lines.index(target)
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit('TOEBANK1A parent run block missing: ' + name)
              i += 1
              out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif not line.strip():
                      out.append('')
                  else:
                      raise SystemExit('unexpected parent indentation: ' + line)
                  i += 1
              Path(f'/tmp/cfaportable_parent_{idx:02d}.sh').write_text('\n'.join(out) + '\n')
          PY
          for script in /tmp/cfaportable_parent_*.sh; do
            echo "=== replay $script ==="
            bash "$script"
          done

      - name: Freeze photographic assets before CFA guard fix
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > TOEBANK1A_CFAPORTABLE_BEFORE.sha256

      - name: Apply CFA-portable diagnostic guard fix
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-toebank1a-cfaportablefix.py "$ROOT" | tee TOEBANK1A_CFAPORTABLE_METHOD.txt
          python3 patches/verify-m9cam-toebank1a-cfaportablefix.py "$ROOT" | tee TOEBANK1A_CFAPORTABLE_VERIFY.txt

      - name: Verify photographic isolation after CFA guard fix
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          R="$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          grep -F 'toeBankCfaPortable1A' "$R"
          grep -F 'toeBankLegacyRggbGuardRemoved' "$R"
          grep -F 'skipped_toebank_unsupported_resolved_cfa' "$R"
          grep -F 'if (!M9CfaResolver.isSupported(sourceCfaPattern))' "$R"
          grep -F '_M9_TOE1A_A_CONTROL' "$R"
          grep -F '_M9_TOE1A_B_MILD20' "$R"
          grep -F '_M9_TOE1A_C_MODERATE40' "$R"
          if sed -n '/if (primaryRoute && DEMOSAIC_DIAGNOSTIC_BANK_ENABLED)/,/FULLSOURCENORM1A: same-RAW/p' "$R" | grep -F 'skipped_legacy_diagnostic_requires_RGGB'; then
            echo 'legacy RGGB-only toe guard still present' >&2
            exit 1
          fi
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > TOEBANK1A_CFAPORTABLE_AFTER.sha256
          diff -u TOEBANK1A_CFAPORTABLE_BEFORE.sha256 TOEBANK1A_CFAPORTABLE_AFTER.sha256
          cat > TOEBANK1A_CFAPORTABLE_CONTRACT.txt <<'EOF'
          M9TOEBANK1A_CFAPORTABLEFIX
          Parent: exact successful M9TOEBANK1A.
          Runtime bug fixed: historical raw-params RGGB-only diagnostic guard removed.
          Toe bank now gates on already-resolved sourceCfaPattern through M9CfaResolver.isSupported.
          Conventional RGGB/GRBG/GBRG/BGGR therefore use the same portable source-CFA render path.
          Unsupported CFA still fails closed.
          Primary JPEG unchanged.
          FULLSOURCENORM1A secondary unchanged.
          Toe strengths/control/gain lock unchanged: 0.00 / 0.20 / 0.40 at exact control final-linear gain.
          M9 target, SAT2, curve02, TC20/TONEBOUND050, HSM, BT.601/TG1 and capture exposure unchanged.
          EOF

      - name: Snapshot assembled source
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/assembled-toebank1a-cfaportable"
          mkdir -p "$OUT"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" "$OUT/"
          cp TOEBANK1A_CFAPORTABLE_METHOD.txt TOEBANK1A_CFAPORTABLE_VERIFY.txt TOEBANK1A_CFAPORTABLE_CONTRACT.txt "$OUT/"
          cp TOEBANK1A_CFAPORTABLE_BEFORE.sha256 TOEBANK1A_CFAPORTABLE_AFTER.sha256 "$OUT/"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate runner Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk "${ANDROID_HOME:-/nonexistent}" "${ANDROID_SDK_ROOT:-/nonexistent}" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then echo 'No usable sdkmanager found' >&2; exit 1; fi
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build TOEBANK1A CFAPORTABLEFIX APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/TOEBANK1A_CFAPORTABLE_GRADLE.log"

      - name: Verify packaged experiment markers
        if: success()
        run: |
          set -euo pipefail
          APK="$(find PhotonCamera/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          rm -rf /tmp/toebank-cfa-apk
          mkdir -p /tmp/toebank-cfa-apk
          unzip -q "$APK" -d /tmp/toebank-cfa-apk
          python3 - <<'PY' | tee TOEBANK1A_CFAPORTABLE_APK_PROOF.txt
          from pathlib import Path
          root=Path('/tmp/toebank-cfa-apk')
          dex=b''.join(p.read_bytes() for p in sorted(root.glob('classes*.dex')))
          markers=[
              b'M9TOEBANK1A_sameRAW_control_mild_moderate',
              b'_M9_TOE1A_A_CONTROL',
              b'_M9_TOE1A_B_MILD20',
              b'_M9_TOE1A_C_MODERATE40',
              b'toeBankCfaPortable1A',
              b'toeBankLegacyRggbGuardRemoved',
              b'skipped_toebank_unsupported_resolved_cfa',
              b'_M9_SOURCEFULLNORM1A_GAINLOCK.jpg',
              b'SAT2_M04_M05',
          ]
          for marker in markers:
              ok=marker in dex
              print(marker.decode('ascii'), ok)
              if not ok:
                  raise SystemExit('missing APK marker '+marker.decode('ascii'))
          print('M9TOEBANK1A CFAPORTABLEFIX APK PROOF PASS')
          PY

      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee TOEBANK1A_CFAPORTABLE_APK_SHA256.txt

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-TOEBANK1A-CFAPORTABLE-ASSEMBLED-SOURCE
          path: assembled-toebank1a-cfaportable/
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-TOEBANK1A-CFAPORTABLE-BUILDLOG
          path: TOEBANK1A_CFAPORTABLE_GRADLE.log
          if-no-files-found: ignore

      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-TOEBANK1A-CFAPORTABLEFIX-CONTROL-MILD20-MODERATE40
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            TOEBANK1A_CFAPORTABLE_APK_SHA256.txt
            TOEBANK1A_CFAPORTABLE_APK_PROOF.txt
            TOEBANK1A_CFAPORTABLE_CONTRACT.txt
            TOEBANK1A_CFAPORTABLE_VERIFY.txt
