name: Build M9Cam M9NATIVEHSM1A SAT2STANDARD1B NATIVEFIX

on:
  workflow_dispatch:
  push:
    branches: [research/m9nativehsm1a-sat2standard1b-nativefix]
    paths:
      - 'patches/apply-m9cam-m9nativehsm1a-sat2standard1b-nativefix.py'
      - 'patches/verify-m9cam-m9nativehsm1a-sat2standard1b-nativefix.py'
      - '.github/workflows/build-m9cam-m9nativehsm1a-sat2standard1b-nativefix.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify NATIVEFIX patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-m9nativehsm1a-sat2standard1b-nativefix.py
          python3 -m py_compile patches/verify-m9cam-m9nativehsm1a-sat2standard1b-nativefix.py

      - name: Replay exact SAT2STANDARD1A assembled baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-m9nativehsm1a-sat2standard1a.yml')
          lines = wf.read_text().splitlines()
          names = [
              'Verify patch syntax',
              'Replay exact SHARPSOURCE1C RBANCHOR1A validated baseline',
              'Apply DEVICEPORT1A and CFA abstractions',
              'Bind M9 DNG metadata to physical sensor',
              'Apply native source architecture baseline',
              'Restore validated TARGETINPUTADAPTER1A control',
              'Apply portable source shading descriptor',
              'Apply read-only setup timing trace',
              'Freeze non-renderer photographic assets',
              'Apply M9 native identity HSM and firmware Standard SAT2',
              'Prove non-renderer photographic assets unchanged',
          ]
          for idx, name in enumerate(names):
              target = '      - name: ' + name
              i = lines.index(target)
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit('SAT2STANDARD1A run block missing: ' + name)
              i += 1
              out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif not line.strip():
                      out.append('')
                  else:
                      raise SystemExit('unexpected SAT2STANDARD1A indentation: ' + line)
                  i += 1
              Path(f'/tmp/sat2standard1a_replay_{idx:02d}.sh').write_text('\n'.join(out) + '\n')
          PY
          for s in /tmp/sat2standard1a_replay_*.sh; do
            echo "=== replay $s ==="
            bash "$s"
          done

      - name: Apply true native SAT2 selection
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum "$ROOT/app/src/main/cpp/m9color_jni.cpp" > SAT2STANDARD1B_NATIVE_BEFORE.sha256
          python3 patches/apply-m9cam-m9nativehsm1a-sat2standard1b-nativefix.py "$ROOT"
          python3 patches/verify-m9cam-m9nativehsm1a-sat2standard1b-nativefix.py "$ROOT" | tee SAT2STANDARD1B_NATIVEFIX_VERIFY.txt
          sha256sum "$ROOT/app/src/main/cpp/m9color_jni.cpp" > SAT2STANDARD1B_NATIVE_AFTER.sha256
          diff -u SAT2STANDARD1B_NATIVE_BEFORE.sha256 SAT2STANDARD1B_NATIVE_AFTER.sha256
          grep -n 'nativeSaturationMode1A\|nativeSaturationBankActuallySelected\|nativeSaturationMatrixPairActuallySelected' \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" \
            | tee SAT2STANDARD1B_NATIVE_MODE_ANCHORS.txt

      - name: Snapshot corrected assembled source
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/assembled-m9nativehsm1a-sat2standard1b-nativefix"
          mkdir -p "$OUT"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" "$OUT/"
          cp "$ROOT/app/src/main/cpp/m9color_jni.cpp" "$OUT/"
          cp SAT2STANDARD1B_NATIVEFIX_VERIFY.txt SAT2STANDARD1B_NATIVE_MODE_ANCHORS.txt "$OUT/"
          cp SAT2STANDARD1B_NATIVE_BEFORE.sha256 SAT2STANDARD1B_NATIVE_AFTER.sha256 "$OUT/"
          cp M9NATIVEHSM1A_SAT2STANDARD1A_VERIFY.txt TARGETINPUT_PRE_CANDIDATE_VERIFY.txt "$OUT/"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate runner Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk "${ANDROID_HOME:-/nonexistent}" "${ANDROID_SDK_ROOT:-/nonexistent}" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then echo 'No usable sdkmanager found' >&2; exit 1; fi
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build SAT2STANDARD1B NATIVEFIX APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/SAT2STANDARD1B_NATIVEFIX_GRADLE.log"

      - name: Verify built APK contains native SAT2 bank
        if: success()
        run: |
          set -euo pipefail
          APK="$(find PhotonCamera/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          rm -rf /tmp/sat2b-apk
          mkdir -p /tmp/sat2b-apk
          unzip -q "$APK" 'lib/arm64-v8a/libm9color.so' -d /tmp/sat2b-apk
          python3 - <<'PY' | tee SAT2STANDARD1B_APK_NATIVE_BANK_PROOF.txt
          from pathlib import Path
          import struct
          b=Path('/tmp/sat2b-apk/lib/arm64-v8a/libm9color.so').read_bytes()
          sat2=[13659,-4457,-1004,-2244,13469,-3033,-199,-6014,14398,
                14811,-5604,-1004,-2455,13688,-3033,393,-6588,14398]
          # Native bank is stored as signed 64-bit coefficients in the compiled library.
          p1=b''.join(struct.pack('<q',x) for x in sat2[:9])
          p2=b''.join(struct.pack('<q',x) for x in sat2[9:])
          ok1=p1 in b; ok2=p2 in b
          print('SAT2_M04_PRESENT', ok1)
          print('SAT2_M05_PRESENT', ok2)
          if not (ok1 and ok2): raise SystemExit(1)
          print('SAT2STANDARD1B APK NATIVE BANK PROOF PASS')
          PY

      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee SAT2STANDARD1B_NATIVEFIX_APK_SHA256.txt

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-M9NATIVEHSM1A-SAT2STANDARD1B-NATIVEFIX-ASSEMBLED-SOURCE
          path: assembled-m9nativehsm1a-sat2standard1b-nativefix/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-M9NATIVEHSM1A-SAT2STANDARD1B-NATIVEFIX-BUILDLOG
          path: SAT2STANDARD1B_NATIVEFIX_GRADLE.log
          if-no-files-found: ignore

      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-M9NATIVEHSM1A-SAT2STANDARD1B-NATIVEFIX
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            SAT2STANDARD1B_NATIVEFIX_APK_SHA256.txt
            SAT2STANDARD1B_NATIVEFIX_VERIFY.txt
            SAT2STANDARD1B_NATIVE_MODE_ANCHORS.txt
            SAT2STANDARD1B_APK_NATIVE_BANK_PROOF.txt
