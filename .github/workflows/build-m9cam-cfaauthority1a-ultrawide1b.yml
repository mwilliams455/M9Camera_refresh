name: Build M9Cam CFAAUTHORITY1A ULTRAWIDE1B

on:
  workflow_dispatch:
  push:
    branches: [research/cfaauthority1a-ultrawide1b]
    paths:
      - 'patches/apply-m9cam-cfaauthority1a-ultrawide1b.py'
      - 'patches/verify-m9cam-cfaauthority1a-ultrawide1b.py'
      - '.github/workflows/build-m9cam-cfaauthority1a-ultrawide1b.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-cfaauthority1a-ultrawide1b.py
          python3 -m py_compile patches/verify-m9cam-cfaauthority1a-ultrawide1b.py

      - name: Replay exact SHARPSOURCE1C RBANCHOR1A validated baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-sharpness-sharpsource1c-rbanchor1a.yml')
          lines = wf.read_text().splitlines()
          names = [
              'Replay exact UPSTREAMAXIS1A parent assembly',
              'Assemble frozen neutral-MHC parent',
              'Assemble SHARPSOURCE1C RBANCHOR1A',
          ]
          for idx, name in enumerate(names):
              target = '      - name: ' + name
              i = lines.index(target)
              while i < len(lines) and lines[i].strip() != 'run: |': i += 1
              if i >= len(lines): raise SystemExit('baseline run block missing: ' + name)
              i += 1
              out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name:'): break
                  if line.startswith('          '): out.append(line[10:])
                  elif not line.strip(): out.append('')
                  else: raise SystemExit('unexpected baseline indentation: ' + line)
                  i += 1
              Path(f'/tmp/cfaauthority_baseline_{idx}.sh').write_text('\n'.join(out) + '\n')
          PY
          for s in /tmp/cfaauthority_baseline_*.sh; do bash "$s"; done

      - name: Apply DEVICEPORT1A and CFAABSTRACT1B
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-deviceport1a-cfaabstract1a.py "$ROOT"
          python3 patches/verify-m9cam-deviceport1a-cfaabstract1a.py "$ROOT"
          python3 patches/apply-m9cam-cfaabstract1b-ultrawide1a.py "$ROOT"
          python3 patches/verify-m9cam-cfaabstract1b-ultrawide1a.py "$ROOT"

      - name: Freeze native photographic core before CFA authority patch
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" \
            > "$GITHUB_WORKSPACE/CFAAUTHORITY1A_NATIVE_BEFORE.sha256"

      - name: Apply CFAAUTHORITY1A ULTRAWIDE1B
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-cfaauthority1a-ultrawide1b.py "$ROOT"
          python3 patches/verify-m9cam-cfaauthority1a-ultrawide1b.py "$ROOT" | tee CFAAUTHORITY1A_VERIFY.txt

      - name: Prove native photographic core unchanged
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" \
            > "$GITHUB_WORKSPACE/CFAAUTHORITY1A_NATIVE_AFTER.sha256"
          diff -u CFAAUTHORITY1A_NATIVE_BEFORE.sha256 CFAAUTHORITY1A_NATIVE_AFTER.sha256

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Host-test four Bayer layouts and authority rule
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          TESTDIR="$RUNNER_TEMP/m9-cfa-authority-test"
          mkdir -p "$TESTDIR/com/particlesdevs/photoncamera/m9/render"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9CfaResolver.java" \
             "$TESTDIR/com/particlesdevs/photoncamera/m9/render/"
          cat > "$TESTDIR/M9CfaAuthorityTest.java" <<'JAVA'
          import com.particlesdevs.photoncamera.m9.render.M9CfaResolver;
          public final class M9CfaAuthorityTest {
              static int resolve(int camera2, int photon) {
                  if (M9CfaResolver.isSupported(camera2)) return camera2;
                  if (M9CfaResolver.isSupported(photon)) return photon;
                  throw new IllegalArgumentException();
              }
              static void eq(int a, int b) { if (a != b) throw new AssertionError(a + " != " + b); }
              static void eq(String a, String b) { if (!b.equals(a)) throw new AssertionError(a + " != " + b); }
              public static void main(String[] args) {
                  eq(resolve(0,0),0);                 // 15U main: no change
                  eq(resolve(1,0),1);                 // 15U ultrawide: physical GRBG wins
                  eq(resolve(2,0),2);
                  eq(resolve(3,0),3);
                  eq(resolve(-1,0),0);                // missing metadata: Photon fallback
                  eq(M9CfaResolver.localPhaseName(M9CfaResolver.Pattern.GRBG,0,0),"GRBG");
                  System.out.println("CFAAUTHORITY1A HOST PASS");
              }
          }
          JAVA
          (cd "$TESTDIR" && javac com/particlesdevs/photoncamera/m9/render/M9CfaResolver.java M9CfaAuthorityTest.java && java M9CfaAuthorityTest) \
            | tee CFAAUTHORITY1A_HOST_TEST.txt

      - name: Snapshot assembled authority sources
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/assembled-cfaauthority1a-ultrawide1b"
          mkdir -p "$OUT"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9CfaResolver.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9PrimaryRenderQueue.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/ImageSaver.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/DngCreator.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/Parameters.java" "$OUT/"
          cp CFAAUTHORITY1A_VERIFY.txt CFAAUTHORITY1A_HOST_TEST.txt "$OUT/"
          cp CFAAUTHORITY1A_NATIVE_BEFORE.sha256 CFAAUTHORITY1A_NATIVE_AFTER.sha256 "$OUT/"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Locate runner Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
              "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
              "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk "${ANDROID_HOME:-/nonexistent}" "${ANDROID_SDK_ROOT:-/nonexistent}" \
              -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo 'No usable sdkmanager found' >&2; exit 1
          fi
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build CFAAUTHORITY1A APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/CFAAUTHORITY1A_ULTRAWIDE1B_GRADLE.log"

      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee CFAAUTHORITY1A_ULTRAWIDE1B_APK_SHA256.txt

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-CFAAUTHORITY1A-ULTRAWIDE1B-ASSEMBLED-SOURCE
          path: assembled-cfaauthority1a-ultrawide1b/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-CFAAUTHORITY1A-ULTRAWIDE1B-BUILDLOG
          path: CFAAUTHORITY1A_ULTRAWIDE1B_GRADLE.log
          if-no-files-found: ignore

      - name: Upload CFAAUTHORITY1A APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-CFAAUTHORITY1A-ULTRAWIDE1B
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            CFAAUTHORITY1A_ULTRAWIDE1B_APK_SHA256.txt
            CFAAUTHORITY1A_VERIFY.txt
            CFAAUTHORITY1A_HOST_TEST.txt
