name: M9 R/B Blackfin Simulator Smoke

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-bfin-sim-smoke.yml'
      - 'research/bfin/standalone_smoke.s'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev

      - name: Download pinned GNU sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          curl --fail --location --retry 4 --retry-all-errors -o gdb-17.2.tar.xz https://ftp.gnu.org/gnu/gdb/gdb-17.2.tar.xz
          sha256sum binutils-2.44.tar.xz gdb-17.2.tar.xz | tee source_sha256.txt
          tar -xf binutils-2.44.tar.xz
          tar -xf gdb-17.2.tar.xz

      - name: Build bfin assembler linker and objdump
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir binutils-build && cd binutils-build
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-sim
          make -j2 all-binutils all-gas all-ld
          AS="$PWD/gas/as-new"
          LD="$PWD/ld/ld-new"
          OBJDUMP="$PWD/binutils/objdump"
          test -x "$AS"; test -x "$LD"; test -x "$OBJDUMP"
          echo "BFIN_AS=$AS" >> "$GITHUB_ENV"
          echo "BFIN_LD=$LD" >> "$GITHUB_ENV"
          echo "BFIN_OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"
          "$AS" --version | head -1
          "$LD" --version | head -1
          "$OBJDUMP" --version | head -1

      - name: Build bfin simulator
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir gdb-build && cd gdb-build
          ../gdb-17.2/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gdbserver
          make -j2 all-sim
          SIM=$(find "$PWD" -type f \( -path '*/sim/bfin/run' -o -name 'bfin-elf-run' \) -perm -111 | head -1 || true)
          if [ -z "$SIM" ]; then
            echo 'Simulator executable candidates:'
            find "$PWD/sim" -maxdepth 4 -type f -perm -111 -print || true
            exit 1
          fi
          echo "BFIN_SIM=$SIM" >> "$GITHUB_ENV"
          echo "simulator=$SIM"

      - name: Assemble link and execute standalone Blackfin smoke harness
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          SRC="$GITHUB_WORKSPACE/research/bfin/standalone_smoke.s"
          test -f "$SRC"

          "$BFIN_AS" "$SRC" -o standalone_smoke.o
          "$BFIN_LD" -e _start standalone_smoke.o -o standalone_smoke.elf
          "$BFIN_OBJDUMP" -h -d standalone_smoke.elf | tee standalone_smoke.objdump.txt

          set +e
          "$BFIN_SIM" standalone_smoke.elf > sim_stdout.txt 2> sim_stderr.txt
          rc=$?
          set -e

          echo "sim_rc=$rc" | tee sim_result.txt
          cat sim_stdout.txt
          cat sim_stderr.txt >&2

          # HLT is the only success exit in the harness; every failed
          # arithmetic or memory assertion reaches ABORT and returns 1.
          test "$rc" -eq 0

      - name: Record standalone simulator evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sim-evidence"; mkdir -p "$OUT"
          cp "$GITHUB_WORKSPACE/research/bfin/standalone_smoke.s" "$OUT/"
          cp "$RUNNER_TEMP/source_sha256.txt" "$OUT/"
          for f in standalone_smoke.o standalone_smoke.elf standalone_smoke.objdump.txt sim_result.txt sim_stdout.txt sim_stderr.txt; do
            if [ -f "$RUNNER_TEMP/$f" ]; then cp "$RUNNER_TEMP/$f" "$OUT/"; fi
          done
          {
            echo "BFIN_AS=${BFIN_AS:-unavailable}"
            echo "BFIN_LD=${BFIN_LD:-unavailable}"
            echo "BFIN_OBJDUMP=${BFIN_OBJDUMP:-unavailable}"
            echo "BFIN_SIM=${BFIN_SIM:-unavailable}"
          } > "$OUT/tool_paths.txt"

      - name: Publish standalone simulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-BFIN-SIM-SMOKE
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/sim-evidence/*
