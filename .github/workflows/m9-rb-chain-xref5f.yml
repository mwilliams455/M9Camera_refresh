name: M9 R/B RBCLOSURE5F Chain Xrefs

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-chain-xref5f.yml'

permissions:
  contents: read

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Recover canonical BF561 and exact producer/final xrefs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rb5f"; mkdir -p "$ROOT/evidence"
          curl -fsSL --retry 4 -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl -fsSL --retry 4 -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$ROOT/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$ROOT/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json" >/dev/null
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$ROOT/m9.dec" | sha256sum -c --strict
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass" >/dev/null
          python3 - <<'PY'
          import json,os,pathlib,importlib.util,sys,bisect,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb5f'; d=json.load(open(root/'pass/report.json')); cand=[]
          for i,x in enumerate(d.get('bf561_deep',[])):
              det=x.get('detail',{}) if isinstance(x.get('detail'),dict) else {}; t=det.get('targets',{}) if isinstance(det,dict) else {}
              if x.get('covered',0)>0 and 'error' not in det: cand.append((sum(k in t for k in ('Run','Process_Sharpness','Process_Noise','Process_WB')),x.get('covered',0),i))
          cand.sort(reverse=True); pair=cand[0][2]; pdir=root/'pass'/f'bf561_pair_{pair:02d}'; bf0=next(pdir.rglob('bf0.bin')); mp=next(pdir.rglob('bf0.map'))
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py'); m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          syms=sorted(m.parse_map(mp),key=lambda s:s['addr']); starts=[s['addr'] for s in syms]; _,blocks=m.parse_ldr(bf0)
          def owners(a):
              # Preserve all map symbols whose declared range contains a; overlapping map entries are expected.
              out=[]
              for s in syms:
                  size=max(int(s.get('size',0)),1)
                  if int(s['addr']) <= a < int(s['addr'])+size:
                      out.append({'name':s['name'],'addr':f"0x{int(s['addr']):08x}",'size':int(s.get('size',0)),'offset':a-int(s['addr'])})
              return out
          targets={0xfeb10660:'GreenInterpolationWithCo',0xffa03410:'ASMRedBlueInterpolation1'}
          hits=[]
          for bi,b in enumerate(blocks):
              for q in m.long_branches(b['data'],int(b['addr'])):
                  if q['type']=='CALL' and q['target'] in targets:
                      hits.append({'site':f"0x{q['pc']:08x}",'target':f"0x{q['target']:08x}",'target_name':targets[q['target']],'block':bi,'containing_symbols':owners(q['pc'])})
          hits.sort(key=lambda x:int(x['site'],16))
          rep={'schema':'m9.rbclosure5f.chain-xrefs.v1','selected_pair':pair,'hits':hits,'green_xrefs':[x for x in hits if x['target_name']=='GreenInterpolationWithCo'],'interp_xrefs':[x for x in hits if x['target_name']=='ASMRedBlueInterpolation1']}
          raw=(json.dumps(rep,indent=2)+'\n').encode(); (root/'evidence'/'chain_xrefs.json').write_bytes(raw); (root/'evidence'/'chain_xrefs.sha256.txt').write_text(hashlib.sha256(raw).hexdigest()+'  chain_xrefs.json\n')
          print(json.dumps(rep,indent=2))
          if not rep['green_xrefs'] or not rep['interp_xrefs']: raise SystemExit('missing producer or interpolation xref')
          PY
          sha256sum "$ROOT/evidence"/* > "$ROOT/evidence/SHA256SUMS.txt"
      - name: Upload derived chain evidence
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-RBCLOSURE5F-CHAIN-XREFS
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/rb5f/evidence/*
      - name: Remove firmware material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/rb5f/pass" "$RUNNER_TEMP/rb5f/m9.upd" "$RUNNER_TEMP/rb5f/mm.upm" "$RUNNER_TEMP/rb5f/m9.dec"
