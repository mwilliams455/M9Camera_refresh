name: M9 Sharpness Auto ISO Writer Closure

on:
  workflow_dispatch:
  push:
    branches: [research/sharpnessforensics1a]
    paths:
      - '.github/workflows/m9-sharpness-autoiso-writer-closure.yml'
      - 'tools/recover_m9_key_from_shared_body.py'
      - 'tools/m9_sharpness_gateb_control_trace.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"
      - name: Recover canonical BF547
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/m9autowriter"
          mkdir -p "$ROOT/evidence"
          curl -sS --fail --location --retry 4 --retry-all-errors -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl -sS --fail --location --retry 4 --retry-all-errors -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$ROOT/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$ROOT/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json" >/dev/null
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$ROOT/m9.dec" | sha256sum -c --strict
          python3 - <<'PY'
          import importlib.util,os,pathlib,sys,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9autowriter'
          spec=importlib.util.spec_from_file_location('gateb',pathlib.Path('tools/m9_sharpness_gateb_control_trace.py'))
          m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          bf=m.get_bf547((root/'m9.dec').read_bytes())
          if hashlib.sha256(bf).hexdigest()!=m.BF_SHA: raise SystemExit('BF547 mismatch')
          (root/'BF547.bin').write_bytes(bf)
          PY
          "$OBJDUMP" -D -b binary -m bfin --adjust-vma=0x20000 "$ROOT/BF547.bin" > "$ROOT/BF547.full.gnu.dis.txt"
      - name: Trace enum conversion, row selector, and effective nIso writer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re,json,struct
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9autowriter'; ev=root/'evidence'
          lines=(root/'BF547.full.gnu.dis.txt').read_text(errors='replace').splitlines(); bf=(root/'BF547.bin').read_bytes()
          are=re.compile(r'^\s*([0-9a-f]+):',re.I)
          def addr(i):
            m=are.match(lines[i]); return int(m.group(1),16) if m else None
          def slice_addr(lo,hi):
            out=[]
            for l in lines:
              m=are.match(l)
              if m and lo <= int(m.group(1),16) < hi: out.append(l)
            return '\n'.join(out)+'\n'
          def windows(ids,before=50,after=100):
            return [{'line':i+1,'addr':hex(addr(i) or 0),'text':lines[i],
                     'context':'\n'.join(lines[max(0,i-before):min(len(lines),i+after)])} for i in ids]
          for lo,hi,name in [
            (0x70ec0,0x71080,'iso_enum_helpers_70ec0_71080'),
            (0x7fc80,0x7ff40,'autoiso_consumer_7fc80_7ff40'),
            (0x385c0,0x38720,'capture_iso_energy_385c0_38720'),
            (0x374f0,0x37980,'capture_record_state_374f0_37980'),
            (0x75240,0x75740,'settings_property_core_75240_75740')]:
              (ev/f'{name}.txt').write_text(slice_addr(lo,hi))
          refs={}
          for target in [0x70fa8,0x70ec0,0x70e6c,0x753ac,0x75264,0x60054,0x6007c]:
            patt=re.compile(r'\b(?:CALL|JUMP(?:\.L|\.S)?)\s+0x(?:0x)?0*'+format(target,'x')+r'\b',re.I)
            ids=[i for i,l in enumerate(lines) if patt.search(l)]
            refs[hex(target)]=windows(ids,35,70)
          # Descriptor table used by 0x753ac: 24-byte records at VMA 0x103ee4.
          desc=[]; base=0x103ee4-0x20000
          for i in range(96):
            q=bf[base+i*24:base+(i+1)*24]
            if len(q)<24: break
            u=list(struct.unpack('<6I',q))
            desc.append({'selector':i,'vma':hex(0x103ee4+i*24),'u32':u,
                         'off4':hex(u[1]),'flagA':q[10],'raw':q.hex()})
          iso_desc=[x for x in desc if x['u32'][1] in (0x40,0x80,0xac,0x440,0x444)]
          (ev/'property_descriptors.json').write_text(json.dumps(desc,indent=2)+'\n')
          # Literal row+0x80 accesses and only the likely controller/current-row contexts.
          row80=[i for i,l in enumerate(lines) if re.search(r'\+ 0x80\]',l,re.I)]
          selector=[i for i,l in enumerate(lines) if re.search(r'\+ 0x488\]',l,re.I)]
          likely=[]
          for i in row80:
            ctx='\n'.join(lines[max(0,i-90):min(len(lines),i+90)]).lower()
            if '0x488' in ctx and '0xac' in ctx: likely.append(i)
          # Search all contexts where current-row ISO is compared to AUTO 0xff.
          auto=[]
          for i,l in enumerate(lines):
            if re.search(r'0xff\b',l,re.I):
              ctx='\n'.join(lines[max(0,i-45):min(len(lines),i+90)]).lower()
              if '0x488' in ctx and ('0x80]' in ctx or '+ 0x80' in ctx): auto.append(i)
          # ISO table, with all 16 bytes decoded. Field +12 is the already-proven nIso enum.
          tab=[]; t0=0xc99ec
          for i in range(17):
            q=bf[t0+i*16:t0+(i+1)*16]; u=list(struct.unpack('<4I',q))
            tab.append({'i':i,'physical_iso':u[0],'calibration_q':u[1],'valid':u[2],
                        'nIso_enum':u[3],'offset':hex(t0+i*16),'runtime':hex(t0+i*16+0x20000)})
          report={'schema':'m9.sharpness.autoiso-writer-closure.v1','callers':refs,
                  'property_iso_candidates':iso_desc,
                  'likely_current_row_iso_accesses':windows(likely,90,90),
                  'auto_current_row_contexts':windows(auto,45,90),
                  'selector_488_accesses':windows(selector,30,55),
                  'iso_table':tab,
                  'known':'record writer uses active +0x40 copied from current row +0x80; BF561 requires concrete nIso 1 or 4..16'}
          (ev/'autoiso_writer_closure.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'callers':{k:len(v) for k,v in refs.items()},
                            'iso_descriptor_candidates':iso_desc,
                            'likely_row80':len(likely),'auto_contexts':len(auto)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-AUTOISO-WRITER-CLOSURE
          retention-days: 30
          path: ${{ runner.temp }}/m9autowriter/evidence/*
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/m9autowriter"
