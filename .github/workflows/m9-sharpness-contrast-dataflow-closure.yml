name: M9 Sharpness Contrast Dataflow Closure

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpnessforensics1a
    paths:
      - '.github/workflows/m9-sharpness-contrast-dataflow-closure.yml'
      - 'tools/recover_m9_key_from_shared_body.py'
      - 'tools/m9_sharpnessforensics1a_firmwarepass.py'
      - 'tools/m9_sharpnessforensics1a.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install or build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"
      - name: Download verify decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9sharp"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$RUNNER_TEMP/m9sharp/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$RUNNER_TEMP/m9sharp/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" --m9-out "$RUNNER_TEMP/m9sharp/m9.dec" --meta-out "$RUNNER_TEMP/m9sharp/recovery_meta.json"
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$RUNNER_TEMP/m9sharp/m9.dec" | sha256sum -c --strict
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$RUNNER_TEMP/m9sharp/m9.dec" --out "$RUNNER_TEMP/m9sharp/pass"
      - name: Extract coherent BF561 overlay and full disassembly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,importlib.util,sys
          rt=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp'; d=json.load(open(rt/'pass/report.json'))
          cand=[]
          for i,x in enumerate(d.get('bf561_deep',[])):
              t=x.get('detail',{}).get('targets',{}) if isinstance(x.get('detail'),dict) else {}
              cand.append((sum(k in t for k in ('Run','Set','SetStructParameter','Process_Sharpness','Process_Noise')),x.get('covered',0),i))
          cand.sort(reverse=True); pair=cand[0][2]
          root=rt/'pass'/f'bf561_pair_{pair:02d}'
          spec=importlib.util.spec_from_file_location('base',pathlib.Path('tools/m9_sharpnessforensics1a.py'))
          m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          syms=sorted(m.parse_map(root/'bf0.map'),key=lambda s:(s['addr'],s['name']))
          _,blocks=m.parse_ldr(root/'bf0.bin')
          ev=rt/'evidence'; ev.mkdir(exist_ok=True); bd=rt/'blocks'; bd.mkdir(exist_ok=True)
          manifest=[]
          for i,b in enumerate(blocks):
              if isinstance(b,dict): addr=int(b.get('addr',b.get('address',0))); data=b.get('data',b.get('bytes',b''))
              else: addr=int(b[0]); data=b[1]
              if not data: continue
              p=bd/f'block_{i:03d}_{addr:08x}.bin'; p.write_bytes(bytes(data)); manifest.append({'file':p.name,'addr':addr,'size':len(data)})
          json.dump({'pair':pair,'symbols':syms,'blocks':manifest},open(ev/'manifest.json','w'),indent=2)
          print(json.dumps({'pair':pair,'symbols':len(syms),'blocks':len(manifest)},indent=2))
          PY
          for f in "$RUNNER_TEMP/m9sharp/blocks"/*.bin; do
            bn=$(basename "$f" .bin); base=$(printf '%s' "$bn" | sed -nE 's/^block_[0-9]+_([0-9a-fA-F]{8})$/\1/p')
            "$OBJDUMP" -D -b binary -m bfin --adjust-vma="0x$base" "$f" > "$RUNNER_TEMP/m9sharp/blocks/${bn}.dis.txt"
          done
      - name: Trace Contrast control and indirect entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re,bisect
          rt=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp'; ev=rt/'evidence'; bd=rt/'blocks'
          m=json.load(open(ev/'manifest.json')); syms=m['symbols']
          exact={}
          for s in syms: exact.setdefault(int(s['addr']),[]).append(s)
          starts=sorted(exact)
          def resolve(a):
              if a in exact: return {'exact':[x['name'] for x in exact[a]]}
              j=bisect.bisect_right(starts,a)-1
              if j<0:return {}
              st=starts[j]; return {'nearest_addr':hex(st),'nearest':[x['name'] for x in exact[st]],'offset':a-st}
          def containers(a):
              return [{'name':s['name'],'addr':hex(int(s['addr'])),'size':s['size']} for s in syms if int(s['size'])>0 and int(s['addr'])<=a<int(s['addr'])+int(s['size'])]
          contrast_names={'Process_Contrast','ExecuteContrast_11LUT8_7','ExecuteContrast_11LUT8_2','ExecuteContrast_11LUT8_3'}
          cranges=[]
          for s in syms:
              if s['name'] in contrast_names and int(s['size'])>0: cranges.append((int(s['addr']),int(s['addr'])+int(s['size']),s['name']))
          are=re.compile(r'^\s*([0-9a-f]+):')
          xfer=re.compile(r'\b(?:CALL|JUMP(?:\.S)?)\s+0x0*([0-9a-f]+)',re.I)
          indirect=re.compile(r'\bCALL\s*\(P([0-5])\)',re.I)
          hits790=[]; range_xfers=[]; indirect_ctx=[]; addr_literals=[]
          for p in sorted(bd.glob('*.dis.txt')):
              ls=p.read_text(errors='replace').splitlines()
              for i,l in enumerate(ls):
                  am=are.match(l); a=int(am.group(1),16) if am else None
                  low=l.lower()
                  if re.search(r'\+\s*0x790\]',low) or re.search(r'\+\s*0x78c\]',low) or re.search(r'\+\s*0x798\]',low):
                      hits790.append({'file':p.name,'line':i+1,'addr':hex(a) if a is not None else None,'text':l,'resolve':resolve(a or 0),'containers':containers(a or 0),'context':'\n'.join(ls[max(0,i-35):min(len(ls),i+85)])})
                  xm=xfer.search(l)
                  if xm:
                      t=int(xm.group(1),16)
                      inside=[{'start':hex(lo),'end':hex(hi),'name':n,'offset':t-lo} for lo,hi,n in cranges if lo<=t<hi]
                      if inside:
                          range_xfers.append({'file':p.name,'line':i+1,'site':hex(a) if a is not None else None,'target':hex(t),'inside':inside,'target_resolve':resolve(t),'site_resolve':resolve(a or 0),'site_containers':containers(a or 0),'context':'\n'.join(ls[max(0,i-20):min(len(ls),i+35)])})
                  im=indirect.search(l)
                  if im:
                      ctx='\n'.join(ls[max(0,i-22):min(len(ls),i+12)])
                      if any(tok in ctx.lower() for tok in ('0x790','0x78c','0x798','contrast','0xb30','0xd70','0x860','0xaa0','0xc78','0xd64')):
                          indirect_ctx.append({'file':p.name,'line':i+1,'addr':hex(a) if a is not None else None,'preg':'P'+im.group(1),'resolve':resolve(a or 0),'containers':containers(a or 0),'context':ctx})
                  # potential two-half immediate construction of known contrast addresses
                  if any(f'{v & 0xffff:#x}' in low or f'{v>>16:#x}' in low for lo,hi,n in cranges for v in (lo,)):
                      if any(tok in low for tok in ('0xff60','0xffa0','0xfeb1','0xb30','0xd70','0x860','0xaa0','0xc78','0xd64')):
                          addr_literals.append({'file':p.name,'line':i+1,'addr':hex(a) if a is not None else None,'text':l,'context':'\n'.join(ls[max(0,i-8):min(len(ls),i+12)])})
          # Also inventory symbols most likely to prepare or consume LUTs.
          focus_words=('Contrast','Lut','LUT','SetLut','LoadLut','Archive','Process_Y','FPGA_Y','Set','Init')
          focus=[s for s in syms if any(w in s['name'] for w in focus_words)]
          report={'schema':'m9.sharpness.contrast-dataflow-closure.v1','pair':m['pair'],'contrast_ranges':[{'start':hex(a),'end':hex(b),'name':n} for a,b,n in cranges],'field_hits':hits790,'range_control_transfers':range_xfers,'relevant_indirect_calls':indirect_ctx,'possible_address_literals':addr_literals,'focus_symbols':focus}
          json.dump(report,open(ev/'contrast_dataflow_report.json','w'),indent=2)
          with open(ev/'contrast_dataflow.txt','w') as f:
              f.write('=== +0x790/+0x78c/+0x798 FIELD HITS ===\n')
              for h in hits790:f.write(json.dumps({k:v for k,v in h.items() if k!='context'},indent=2)+'\n'+h['context']+'\n\n')
              f.write('=== CONTROL TRANSFERS INTO CONTRAST-LABELED RANGES ===\n')
              for h in range_xfers:f.write(json.dumps({k:v for k,v in h.items() if k!='context'},indent=2)+'\n'+h['context']+'\n\n')
              f.write('=== RELEVANT INDIRECT CALLS ===\n')
              for h in indirect_ctx:f.write(json.dumps({k:v for k,v in h.items() if k!='context'},indent=2)+'\n'+h['context']+'\n\n')
              f.write('=== POSSIBLE CONTRAST ADDRESS LITERALS ===\n')
              for h in addr_literals:f.write(h['context']+'\n\n')
              f.write('=== FOCUS SYMBOLS ===\n')
              for s in focus:f.write(f"{int(s['addr']):#010x} {int(s['size']):6d} {s['name']}\n")
          print(json.dumps({'field_hits':len(hits790),'range_xfers':len(range_xfers),'indirect_ctx':len(indirect_ctx),'addr_literals':len(addr_literals),'focus_symbols':len(focus)},indent=2))
          PY
      - name: Publish derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-CONTRAST-DATAFLOW-CLOSURE
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/m9sharp/evidence/*.json
            ${{ runner.temp }}/m9sharp/evidence/*.txt
            ${{ runner.temp }}/m9sharp/recovery_meta.json
      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/m9sharp/pass" "$RUNNER_TEMP/m9sharp/blocks" "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" "$RUNNER_TEMP/m9sharp/m9.dec"
