name: Build M9Cam 2.07 CAPTURECOLOR1A metadata diagnostic

on:
  workflow_dispatch:
  push:
    branches: [research/m9-capturecolor1a]
    paths:
      - patches/capturecolor1a/**
      - .github/workflows/build-m9cam-capturecolor1a.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: m9-capturecolor1a
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Replay exact 2.06 QUALITYGATE1B source
        run: |
          set -euo pipefail
          python3 patches/tapmeter1a/apply.py --check-payload
          python3 patches/autoexposurefinish1n/ci.py source
          python3 patches/autoexposurefinish1n/apply.py PhotonCamera > CC1A_AE1N.json
          python3 patches/tapmeter1a/apply.py PhotonCamera > CC1A_TAP1A.json
          python3 patches/tapexactpatchclip1b/apply.py apply PhotonCamera > CC1A_EXACTPATCH1B.json
          python3 patches/qualitygate1b/apply.py PhotonCamera > CC1A_QUALITYGATE1B.json

      - name: Apply and verify metadata-only overlay
        run: |
          set -euo pipefail
          python3 patches/capturecolor1a/apply.py PhotonCamera | tee CC1A_APPLY.json
          python3 patches/capturecolor1a/apply.py PhotonCamera > CC1A_VERIFY.json

      - name: Build diagnostic APK
        run: |
          set -euo pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/CC1A_GRADLE.log"

      - name: Retrieve exact delivered 2.06 baseline
        uses: actions/download-artifact@v4
        with:
          name: M9Cam-2.06-QUALITYGATE1B-SATDIAG
          run-id: 36473077276
          github-token: ${{ github.token }}
          path: BASELINE206

      - name: Verify packaged diagnostic and frozen rendering payloads
        run: |
          set -euo pipefail
          python3 patches/capturecolor1a/postbuild.py PhotonCamera \
            BASELINE206/M9Cam_2.06_QUALITYGATE1B_SATDIAG.apk M9_CAPTURECOLOR1A_DELIVERY
          cp CC1A_APPLY.json CC1A_VERIFY.json M9_CAPTURECOLOR1A_DELIVERY/

      - name: Verify Android update identity and alignment
        run: |
          set -euo pipefail
          APK="M9_CAPTURECOLOR1A_DELIVERY/M9Cam_2.07_CAPTURECOLOR1A.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p /tmp/m9capturecolor1a-installcheck
          javac -cp "$BUILD_TOOLS/lib/apksigner.jar" -d /tmp/m9capturecolor1a-installcheck \
            patches/tests/m9livegl2g/ApkInstallCheck.java
          java -cp "/tmp/m9capturecolor1a-installcheck:$BUILD_TOOLS/lib/apksigner.jar" \
            ApkInstallCheck "$APK" 2.07-m9capturecolor1a-qualitygate1b \
            | tee M9_CAPTURECOLOR1A_DELIVERY/INSTALL_CHECK.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK" \
            | tee -a M9_CAPTURECOLOR1A_DELIVERY/INSTALL_CHECK.txt

      - uses: actions/upload-artifact@v4
        with:
          name: M9Cam-2.07-CAPTURECOLOR1A
          path: M9_CAPTURECOLOR1A_DELIVERY/
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-CAPTURECOLOR1A-BUILDLOG
          path: |
            CC1A_GRADLE.log
            CC1A_APPLY.json
            CC1A_VERIFY.json
            CC1A_QUALITYGATE1B.json
          if-no-files-found: ignore
