name: M9 R/B RBCOMPOSITE8A Shared Phase Init

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-rbcomposite8a-sharedphase-init.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 4 -o b.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          tar -xf b.tar.xz
          mkdir b && cd b
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim >/dev/null
          make -j4 all-binutils >/dev/null
          echo "BFIN_OBJDUMP=$PWD/binutils/objdump" >> "$GITHUB_ENV"

      - name: Recover canonical Run body
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rb8a"; mkdir -p "$ROOT/evidence"
          curl -fsSL --retry 4 -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl -fsSL --retry 4 -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$ROOT/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$ROOT/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json" >/dev/null
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$ROOT/m9.dec" | sha256sum -c --strict
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass" >/dev/null
          python3 - <<'PY'
          import json,os,pathlib,importlib.util,sys,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb8a'
          d=json.load(open(root/'pass/report.json'))
          cand=[]
          for i,x in enumerate(d.get('bf561_deep',[])):
              det=x.get('detail',{}) if isinstance(x.get('detail'),dict) else {}
              t=det.get('targets',{}) if isinstance(det,dict) else {}
              if x.get('covered',0)>0 and 'error' not in det:
                  cand.append((sum(k in t for k in ('Run','Process_Sharpness','Process_Noise','Process_WB')),x.get('covered',0),i))
          cand.sort(reverse=True); pair=cand[0][2]
          pdir=root/'pass'/f'bf561_pair_{pair:02d}'; bf0=next(pdir.rglob('bf0.bin')); mp=next(pdir.rglob('bf0.map'))
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py'); m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          _,blocks=m.parse_ldr(bf0); syms=m.parse_map(mp)
          runs=[s for s in syms if s['name']=='Run']
          if not runs: raise SystemExit('Run symbol missing')
          s=max(runs,key=lambda q:int(q.get('size',0))); addr,size=int(s['addr']),int(s['size']); body=m.read_overlay(blocks,addr,size)
          if addr!=0xffa10320: raise SystemExit(f'unexpected Run entry 0x{addr:08x}')
          (root/'run.bin').write_bytes(body); (root/'base.txt').write_text(f'{addr:x}\n')
          (root/'evidence'/'run_meta.json').write_text(json.dumps({'selected_pair':pair,'entry':f'0x{addr:08x}','size':size,'sha256':hashlib.sha256(body).hexdigest()},indent=2)+'\n')
          PY
          BASE=$(cat "$ROOT/base.txt")
          "$BFIN_OBJDUMP" -D -b binary -m bfin --adjust-vma="0x$BASE" "$ROOT/run.bin" > "$ROOT/run.dis"

      - name: Trace shared FP+8 state and case-body chronology
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rb8a"
          python3 - <<'PY'
          import os,pathlib,re,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb8a'
          lines=(root/'run.dis').read_text(errors='replace').splitlines()
          rx=re.compile(r'^\s*([0-9a-f]+):\s+([0-9a-f ]+?)\s+(.+)$',re.I)
          ins=[]
          for line in lines:
              m=rx.match(line)
              if m: ins.append({'addr':int(m.group(1),16),'bytes':m.group(2).strip(),'asm':m.group(3).strip()})
          if not ins: raise SystemExit('no disassembly instructions')
          def ser(xs): return [{'addr':f"0x{x['addr']:08x}",'bytes':x['bytes'],'asm':x['asm']} for x in xs]
          # GNU Blackfin objdump can print offsets as + 0x8, +0x8, or + 8.
          fp8_rx=re.compile(r'\[\s*FP\s*\+\s*(?:0x0*8|8)\s*\]',re.I)
          accesses=[]
          for i,x in enumerate(ins):
              if fp8_rx.search(x['asm']):
                  before=ins[max(0,i-12):i]; after=ins[i+1:min(len(ins),i+13)]
                  left=x['asm'].split('=',1)[0] if '=' in x['asm'] else ''
                  kind='write' if fp8_rx.search(left) else 'read'
                  accesses.append({'addr':f"0x{x['addr']:08x}",'bytes':x['bytes'],'asm':x['asm'],'kind':kind,
                                   'context_before':ser(before),'context_after':ser(after)})
          # Also catch FP-relative stores/loads expressed through P-register setup nearby by
          # exporting broad windows around the two production cases and Run prologue.
          windows={
              'prologue':(0xffa10320,0xffa10420),
              'green_case':(0xffa10c80,0xffa10d10),
              'rb_case':(0xffa10b80,0xffa10c20),
              'dispatch_green_to_rb':(0xffa107c0,0xffa10920),
          }
          slices={k:ser([x for x in ins if lo<=x['addr']<hi]) for k,(lo,hi) in windows.items()}
          # Record every instruction mentioning FP in case the slot is accessed via pointer arithmetic.
          fp_mentions=ser([x for x in ins if re.search(r'\bFP\b',x['asm'],re.I)])
          rep={'schema':'m9.rbcomposite8a.shared-phase-init.v1','run_entry':'0xffa10320',
               'shared_slot':'FP+8','direct_fp8_accesses':accesses,'direct_access_count':len(accesses),
               'fp_mentions':fp_mentions,'windows':slices,
               'known_calls':{'green':'0xffa10cbc -> 0xfeb10660','rb':'0xffa10bea -> 0xffa03410'},
               'question':'What exact value is stored in the shared FP+8 word before Green, and what value reaches R/B after Green?'}
          raw=(json.dumps(rep,indent=2)+'\n').encode(); (root/'evidence'/'shared_phase_trace.json').write_bytes(raw)
          with open(root/'evidence'/'shared_phase_trace.txt','w') as f:
              f.write('DIRECT [FP+8] ACCESSES\n')
              for a in accesses:
                  f.write(f"{a['addr']} {a['kind']}  {a['asm']}\n")
                  for q in a['context_before'][-6:]: f.write(f"    PRE {q['addr']}  {q['asm']}\n")
                  for q in a['context_after'][:6]: f.write(f"    POST {q['addr']}  {q['asm']}\n")
              for name,xs in slices.items():
                  f.write(f'\n{name.upper()}\n')
                  for q in xs: f.write(f"{q['addr']}  {q['asm']}\n")
          (root/'evidence'/'shared_phase_trace.sha256.txt').write_text(hashlib.sha256(raw).hexdigest()+'  shared_phase_trace.json\n')
          if not any(a['kind']=='write' for a in accesses):
              print('WARNING: no direct [FP+8] write found; inspect FP mentions/windows for alias setup')
          print((root/'evidence'/'shared_phase_trace.txt').read_text())
          PY
          sha256sum "$ROOT/evidence"/* > "$ROOT/evidence/SHA256SUMS.txt"

      - name: Upload derived shared-state evidence
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-RBCOMPOSITE8A-SHARED-PHASE-INIT
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/rb8a/evidence/*

      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/rb8a/pass" "$RUNNER_TEMP/rb8a/m9.upd" "$RUNNER_TEMP/rb8a/mm.upm" "$RUNNER_TEMP/rb8a/m9.dec" "$RUNNER_TEMP/rb8a/run.bin" "$RUNNER_TEMP/rb8a/run.dis" "$RUNNER_TEMP/rb8a/base.txt"
