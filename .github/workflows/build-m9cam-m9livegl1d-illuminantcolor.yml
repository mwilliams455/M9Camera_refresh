name: Build M9Cam M9LIVEGL1D Illuminant Color

on:
  workflow_dispatch:
  pull_request:
    branches: [research/m9livegl1c-appearanceparity]
    paths:
      - 'patches/apply-m9cam-m9livegl1d-illuminantcolor.py'
      - 'patches/verify-m9cam-m9livegl1d-illuminantcolor.py'
      - '.github/workflows/build-m9cam-m9livegl1d-illuminantcolor.yml'
  push:
    branches: [research/m9livegl1d-illuminantcolor]
    paths:
      - 'patches/apply-m9cam-m9livegl1d-illuminantcolor.py'
      - 'patches/verify-m9cam-m9livegl1d-illuminantcolor.py'
      - '.github/workflows/build-m9cam-m9livegl1d-illuminantcolor.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify GL1D patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-m9livegl1d-illuminantcolor.py
          python3 -m py_compile patches/verify-m9cam-m9livegl1d-illuminantcolor.py

      - name: Replay exact M9LIVEGL1C assembled baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/build-m9cam-m9livegl1c-appearanceparity.yml')
          lines=wf.read_text().splitlines()
          names=[
              'Verify GL1C patch syntax',
              'Replay exact M9LIVEGL1B assembled baseline',
              'Freeze exact still M9 renderer before GL1C',
              'Apply appearance-parity transform',
              'Prove exact still M9 renderer unchanged',
          ]
          for idx,name in enumerate(names):
              target='      - name: '+name
              if target not in lines:
                  raise SystemExit('GL1C replay block missing: '+name)
              i=lines.index(target)
              while i<len(lines) and lines[i].strip()!='run: |':
                  i+=1
              if i>=len(lines):
                  raise SystemExit('GL1C run block missing: '+name)
              i+=1
              out=[]
              while i<len(lines):
                  line=lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif not line.strip():
                      out.append('')
                  else:
                      raise SystemExit('unexpected GL1C indentation: '+line)
                  i+=1
              Path(f'/tmp/m9livegl1d_parent_{idx:02d}.sh').write_text('\n'.join(out)+'\n')
          PY
          for s in /tmp/m9livegl1d_parent_*.sh; do
            echo "=== replay $s ==="
            bash "$s"
          done

      - name: Freeze exact still M9 renderer before GL1D
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9EdgePlacementBestFit2AController.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java" \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > M9LIVEGL1D_STILL_BEFORE.sha256

      - name: Apply illuminant-aware color transform
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-m9livegl1d-illuminantcolor.py "$ROOT"
          python3 patches/verify-m9cam-m9livegl1d-illuminantcolor.py "$ROOT" \
            | tee M9LIVEGL1D_VERIFY.txt

      - name: Prove exact still M9 renderer unchanged
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9EdgePlacementBestFit2AController.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java" \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > M9LIVEGL1D_STILL_AFTER.sha256
          diff -u M9LIVEGL1D_STILL_BEFORE.sha256 M9LIVEGL1D_STILL_AFTER.sha256

      - name: Snapshot GL1D sources
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/assembled-m9livegl1d"
          mkdir -p "$OUT"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/capture/CaptureController.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/ui/camera/CameraFragment.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/viewfinder/GLPreview.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/viewfinder/MainRenderer.java" "$OUT/"
          cp "$ROOT/app/src/main/assets/shaders/preview/main_fs.glsl" "$OUT/"
          cp M9LIVEGL1D_VERIFY.txt "$OUT/"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate runner Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "\${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "\${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then exit 1; fi
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build M9LIVEGL1D APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/M9LIVEGL1D_GRADLE.log"

      - name: Verify packaged GL1D contract
        if: success()
        run: |
          set -euo pipefail
          APK="$(find PhotonCamera/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          rm -rf /tmp/m9livegl1d-apk
          mkdir -p /tmp/m9livegl1d-apk
          unzip -q "$APK" -d /tmp/m9livegl1d-apk
          python3 - <<'PY' | tee M9LIVEGL1D_APK_PROOF.txt
          from pathlib import Path
          root=Path('/tmp/m9livegl1d-apk')
          mainfs=root/'assets/shaders/preview/main_fs.glsl'
          if not mainfs.exists():
              raise SystemExit('main preview shader missing')
          t=mainfs.read_text()
          for marker in (
              'M9LIVEGL1D_ILLUMINANTCOLOR',
              'uM9SourceMatrixA1D',
              'uM9IlluminantWeightA1D',
              'sourceToM9Target1D',
              'target *= yin / yout',
              'tungstenGuard1D',
              'linear *= uM9ExposureScale1B',
              'tonePlacement1C',
              'sat2M9',
              'curve02M9'):
              ok=marker in t
              print(marker, ok)
              if not ok:
                  raise SystemExit('shader marker missing '+marker)
          dex=b''.join(p.read_bytes() for p in sorted(root.glob('classes*.dex')))
          for marker in (
              b'M9LIVEGL1D_ILLUMINANTCOLOR',
              b'setM9IlluminantState1D',
              b'M9LIVEGL1B_EXPOSUREINTENT',
              b'Photon_GL_IsoExpoSelector_intended_pair'):
              ok=marker in dex
              print(marker.decode('ascii'), ok)
              if not ok:
                  raise SystemExit('DEX marker missing '+marker.decode('ascii'))
          print('M9LIVEGL1D APK PROOF PASS')
          PY

      - name: Record APK SHA256
        if: success()
        run: |
          sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk \
            | tee M9LIVEGL1D_APK_SHA256.txt

      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-M9LIVEGL1D-ILLUMINANTCOLOR
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            M9LIVEGL1D_APK_SHA256.txt
            M9LIVEGL1D_VERIFY.txt
            M9LIVEGL1D_APK_PROOF.txt
            M9LIVEGL1D_STILL_BEFORE.sha256
            M9LIVEGL1D_STILL_AFTER.sha256

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-M9LIVEGL1D-ASSEMBLED-SOURCE
          path: assembled-m9livegl1d/
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-M9LIVEGL1D-BUILDLOG
          path: M9LIVEGL1D_GRADLE.log
          if-no-files-found: ignore
