name: M9 R/B BFINSCALAR2B Difference Direct Parity

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-bfin-differ-scalar2b.yml'
      - 'research/bfin/redblue_differ_scalar_exact.py'
      - 'research/bfin/redblue_differ_oracle_single.s'
      - 'research/bfin/BFINORACLE2A_DIFFER_ARITHMETIC_FROZEN.json'

permissions:
  contents: read

jobs:
  direct-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install and build pinned Blackfin toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          curl --fail --location --retry 4 --retry-all-errors -o gdb-17.2.tar.xz https://ftp.gnu.org/gnu/gdb/gdb-17.2.tar.xz
          tar -xf binutils-2.44.tar.xz; tar -xf gdb-17.2.tar.xz
          mkdir binutils-build && cd binutils-build
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-sim >/dev/null
          make -j2 all-binutils all-gas all-ld >/dev/null
          echo "BFIN_AS=$PWD/gas/as-new" >> "$GITHUB_ENV"; echo "BFIN_LD=$PWD/ld/ld-new" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"; mkdir gdb-build && cd gdb-build
          ../gdb-17.2/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gdbserver >/dev/null
          make -j2 all-sim >/dev/null
          SIM=$(find "$PWD" -type f \( -path '*/sim/bfin/run' -o -name 'bfin-elf-run' \) -perm -111 | head -1 || true); test -n "$SIM"; echo "BFIN_SIM=$SIM" >> "$GITHUB_ENV"
      - name: Recover exact Leica differ body
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/bfindiffer2b"; mkdir -p "$ROOT/evidence"
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json"
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass"
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'bfindiffer2b'; d=json.load(open(root/'pass/report.json')); addr=0xffa00008; size=0xb6; expected='5dc7738b5a63f01e69287eaabf9cde39bfde677da489513b490debf27a4878c1'
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py'); m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          for i,_ in enumerate(d.get('bf561_deep',[])):
            try:
              bf0=next((root/'pass'/f'bf561_pair_{i:02d}').rglob('bf0.bin')); _,blocks=m.parse_ldr(bf0); body=m.read_overlay(blocks,addr,size)
              if hashlib.sha256(body).hexdigest()==expected: (root/'ASMRedBlueAndGreenDiffer.bin').write_bytes(body); break
            except Exception: pass
          else: raise SystemExit('canonical differ body not found')
          PY
      - name: Execute deterministic machine corpus and compare scalar
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/bfindiffer2b"; cp research/bfin/redblue_differ_oracle_single.s "$ROOT/"
          cat > "$ROOT/oracle.ld" <<'LDS'
          ENTRY(_start)
          SECTIONS {
            . = 0x1000; .text : { *(.text.start) *(.text*) }
            . = 0x4000; .plane0 : { *(.plane0) }
            . = 0x5000; .plane1 : { *(.plane1) }
            . = 0x6000; .threshold : { *(.threshold) }
            . = 0x7000; .output : { *(.output) }
            . = 0x8800; .stack : { *(.stack) }
          }
          LDS
          cd "$ROOT"
          PYTHONPATH="$GITHUB_WORKSPACE/research/bfin" python3 - <<'PY'
          import hashlib,json,os,pathlib,random,re,subprocess
          from redblue_differ_scalar_exact import differ_sample
          rng=random.Random(0x4d394432)
          cases=[]
          for d,t,s in [(0,0,0),(1,1,0),(1,2,0),(-1,1,0),(-1,2,0),(100,100,2),(100,101,2),(-100,100,2),(-100,101,2),(16383,16383,4),(-16383,16383,4)]:
            b=8192; a=b+d
            if 0 <= a <= 16383: cases.append((a,b,t,s))
          for _ in range(117):
            cases.append((rng.randrange(16384),rng.randrange(16384),rng.randrange(65536),rng.randrange(8)))
          ev=pathlib.Path('evidence'); rows=[]
          for i,(a,b,t,s) in enumerate(cases):
            n=f'v{i:03d}'
            subprocess.run([os.environ['BFIN_AS'],'--defsym',f'AVAL={a}','--defsym',f'BVAL={b}','--defsym',f'TVAL={t}','--defsym',f'SHIFTVAL={s}','redblue_differ_oracle_single.s','-o',f'{n}.o'],check=True,stdout=subprocess.DEVNULL)
            subprocess.run([os.environ['BFIN_LD'],'-T','oracle.ld',f'{n}.o','-o',f'{n}.elf'],check=True,stdout=subprocess.DEVNULL)
            p=subprocess.run([os.environ['BFIN_SIM'],f'{n}.elf'],capture_output=True,text=True)
            if p.returncode: raise SystemExit(f'{n}: simulator rc={p.returncode}: {p.stderr}')
            vals=[int(x,16) for x in re.findall(r'DBG\s*:\s*R0\s*=\s*0x([0-9a-fA-F]+)',p.stdout)]
            if len(vals)!=1: raise SystemExit(f'{n}: DBG count={len(vals)}')
            machine=vals[0]&0xffff; scalar=differ_sample(a,b,t,s)
            if machine!=scalar: raise SystemExit(f'{n}: a={a} b={b} t={t} s={s} machine={machine} scalar={scalar}')
            rows.append({'name':n,'a':a,'b':b,'threshold':t,'shift':s,'machine_u16':machine,'scalar_u16':scalar,'exact_match':True})
          report={'schema':'m9.bfinscalar2b.differ-direct-parity.v1','routine_sha256':'5dc7738b5a63f01e69287eaabf9cde39bfde677da489513b490debf27a4878c1','case_count':len(rows),'exact_match':True,'cases':rows}
          raw=(json.dumps(report,indent=2)+'\n').encode(); (ev/'differ_direct_parity.json').write_bytes(raw); (ev/'differ_direct_parity.sha256.txt').write_text(hashlib.sha256(raw).hexdigest()+'  differ_direct_parity.json\n'); print(json.dumps({'case_count':len(rows),'exact_match':True},indent=2))
          PY
      - name: Publish parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-BFINSCALAR2B-DIFFER-DIRECT-PARITY
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/bfindiffer2b/evidence/*
      - name: Remove firmware and binaries
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/bfindiffer2b/pass" "$RUNNER_TEMP/bfindiffer2b/m9.upd" "$RUNNER_TEMP/bfindiffer2b/mm.upm" "$RUNNER_TEMP/bfindiffer2b/m9.dec" "$RUNNER_TEMP/bfindiffer2b/ASMRedBlueAndGreenDiffer.bin" "$RUNNER_TEMP/bfindiffer2b"/*.o "$RUNNER_TEMP/bfindiffer2b"/*.elf
