name: M9 Sharpness L3 Archive Extract

on:
  workflow_dispatch:
  push:
    branches: [research/sharpnessforensics1a]
    paths:
      - '.github/workflows/m9-sharpness-l3-archive-extract.yml'
      - 'tools/recover_m9_key_from_shared_body.py'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download verify decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9sharp/evidence"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$RUNNER_TEMP/m9sharp/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$RUNNER_TEMP/m9sharp/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" --m9-out "$RUNNER_TEMP/m9sharp/m9.dec" --meta-out "$RUNNER_TEMP/m9sharp/recovery_meta.json"
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$RUNNER_TEMP/m9sharp/m9.dec" | sha256sum -c --strict
      - name: Locate L3 archive and derive Sharp LUT bank
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,struct,json,hashlib,statistics
          rt=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp'; ev=rt/'evidence'; data=(rt/'m9.dec').read_bytes()
          def u32(o): return struct.unpack_from('<I',data,o)[0]
          def s16buf(b): return list(struct.unpack('<'+'h'*(len(b)//2),b))
          # Runtime proof: LutsFile header begins with 13; descriptor count at archive+0x5f4 is 2050.
          # Search exact relative pair in decrypted firmware. Also allow 13 as a 16-bit value in a 32-bit slot.
          candidates=[]
          pat13=struct.pack('<I',13)
          for off in range(0,len(data)-0x5f8):
              if data[off:off+4] != pat13: continue
              if u32(off+0x5f4) != 2050: continue
              hdr=[u32(off+i) for i in range(0,0x4c,4)]
              sharp_off=hdr[4] # header +0x10
              # source bank is 13 ISO LUTs x 2050 int16 = 53300 bytes if contiguous as proven by loader indexing
              bank_bytes=13*2050*2
              valid=0 <= sharp_off <= len(data)-off-bank_bytes
              c={'archive_offset':off,'archive_offset_hex':hex(off),'header_u32':hdr,'sharp_bank_offset':sharp_off,'sharp_bank_offset_hex':hex(sharp_off),'count_at_5f4':u32(off+0x5f4),'bank_bytes_expected':bank_bytes,'bank_within_firmware':valid}
              if valid:
                  b=data[off+sharp_off:off+sharp_off+bank_bytes]
                  vals=s16buf(b); luts=[vals[i*2050:(i+1)*2050] for i in range(13)]
                  c['bank_sha256']=hashlib.sha256(b).hexdigest()
                  c['lut_summaries']=[]
                  for i,lut in enumerate(luts):
                      c['lut_summaries'].append({'index':i,'min':min(lut),'max':max(lut),'first16':lut[:16],'center16':lut[1017:1033],'last16':lut[-16:],'nonzero':sum(v!=0 for v in lut)})
                  c['symmetry_absdiff_max']=[max(abs(lut[j]+lut[-1-j]) for j in range(1025)) for lut in luts]
              candidates.append(c)
          # Secondary scan: count+header may live in a decompressed/packed payload not directly present as one contiguous sequence.
          count_hits=[]
          p802=struct.pack('<I',2050)
          pos=0
          while True:
              pos=data.find(p802,pos)
              if pos<0:break
              count_hits.append(pos);pos+=1
          report={'schema':'m9.sharpness.l3-archive-extract.v1','firmware_sha256':hashlib.sha256(data).hexdigest(),'exact_candidate_count':len(candidates),'candidates':candidates,'u32_2050_hit_count':len(count_hits),'u32_2050_hits_hex':[hex(x) for x in count_hits[:500]],'proof_basis':{'header_count':13,'count_relative_offset':'0x5f4','lut_count':2050,'iso_bank_count':13,'lut_element_type':'int16','expected_bank_bytes':13*2050*2}}
          (ev/'l3_archive_candidates.json').write_text(json.dumps(report,indent=2)+'\n')
          # If exactly one coherent candidate exists, publish the derived signed LUT values only.
          coherent=[c for c in candidates if c.get('bank_within_firmware')]
          if len(coherent)==1:
              c=coherent[0];off=c['archive_offset'];so=c['sharp_bank_offset'];n=13*2050
              vals=s16buf(data[off+so:off+so+n*2]);luts=[vals[i*2050:(i+1)*2050] for i in range(13)]
              out={'schema':'m9.sharpness.base-lut-bank.v1','archive_offset_hex':hex(off),'sharp_bank_offset_hex':hex(so),'bank_sha256':c['bank_sha256'],'count_per_lut':2050,'lut_count':13,'luts':luts}
              (ev/'sharp_base_lut_bank.json').write_text(json.dumps(out,separators=(',',':'))+'\n')
          print(json.dumps({'exact_candidates':len(candidates),'coherent_candidates':len(coherent),'u32_2050_hits':len(count_hits)},indent=2))
          PY
      - name: Publish derived text evidence only
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-L3-ARCHIVE-EXTRACT
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/m9sharp/evidence/*.json
            ${{ runner.temp }}/m9sharp/recovery_meta.json
      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" "$RUNNER_TEMP/m9sharp/m9.dec"
