name: M9Cam 2.70 Mono RAW gain budget
on:
  pull_request:
    branches: ['codex/monodiag2a-v2.69']
    paths: ['patches/monorawgain1a/**', '.github/workflows/build-m9cam-monorawgain1a.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Provision pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Reconstruct pinned source
        run: python3 patches/monorawgain1a/assemble.py "$RUNNER_TEMP/PhotonCamera_270"
      - name: Verify exposure allocation
        run: |
          python3 patches/monorawgain1a/host_test.py "$RUNNER_TEMP/PhotonCamera_270"
      - name: Build Android and test real preference widget
        working-directory: ${{ runner.temp }}/PhotonCamera_270
        run: |
          bash gradlew :app:assembleDebug :app:testDebugUnitTest --tests '*MonoRawGainTest' --tests '*MonoPrimaryEvidenceTest' --tests '*MonoDiagnosticPreferenceTest' --tests '*ProfileCaptureTest' --tests '*M9OutputSettingsTest' --no-daemon --max-workers=2
      - name: Retain packaging tools
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/packaging-tools/lib"
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" "$ANDROID_HOME/build-tools/35.0.0/aapt2" "$RUNNER_TEMP/packaging-tools/"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/packaging-tools/lib/"
      - name: Retain build and test results for final packaging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorawgain1a-android-build
          path: |
            ${{ runner.temp }}/packaging-tools/**
            ${{ runner.temp }}/PhotonCamera_270/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/PhotonCamera_270/app/build/test-results/testDebugUnitTest/**
            ${{ runner.temp }}/PhotonCamera_270/app/build/reports/tests/testDebugUnitTest/**
          retention-days: 7
