name: M9 R/B RBCLOSURE5O Init Parameter Direction

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-initparam5o.yml'

permissions:
  contents: read

jobs:
  initparam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 4 -o b.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          tar -xf b.tar.xz
          mkdir b && cd b
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim >/dev/null
          make -j4 all-binutils >/dev/null
          echo "BFIN_OBJDUMP=$PWD/binutils/objdump" >> "$GITHUB_ENV"

      - name: Recover Init body and selected BF561 image
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rb5o"
          mkdir -p "$ROOT/evidence" "$ROOT/blocks" "$ROOT/dis"
          curl -fsSL --retry 4 -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl -fsSL --retry 4 -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$ROOT/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$ROOT/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json" >/dev/null
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$ROOT/m9.dec" | sha256sum -c --strict
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass" >/dev/null
          python3 - <<'PY'
          import json,os,pathlib,importlib.util,sys,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb5o'; d=json.load(open(root/'pass/report.json')); cand=[]
          for i,x in enumerate(d.get('bf561_deep',[])):
              det=x.get('detail',{}) if isinstance(x.get('detail'),dict) else {}; t=det.get('targets',{}) if isinstance(det,dict) else {}
              if x.get('covered',0)>0 and 'error' not in det: cand.append((sum(k in t for k in ('Run','Process_Sharpness','Process_Noise','Process_WB')),x.get('covered',0),i))
          cand.sort(reverse=True); pair=cand[0][2]; pdir=root/'pass'/f'bf561_pair_{pair:02d}'; bf0=next(pdir.rglob('bf0.bin')); mp=next(pdir.rglob('bf0.map'))
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py'); m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          _,blocks=m.parse_ldr(bf0); syms=m.parse_map(mp)
          init_addr=0xfeb16190
          init_syms=[s for s in syms if int(s.get('addr',-1))==init_addr and int(s.get('size',0))>0]
          if not init_syms: raise SystemExit('Init @ 0xfeb16190 exact symbol missing')
          init=max(init_syms,key=lambda s:int(s['size'])); body=m.read_overlay(blocks,init_addr,int(init['size']))
          (root/'init.bin').write_bytes(body)
          meta=[]
          for i,b in enumerate(blocks):
              data=bytes(b['data']); (root/'blocks'/f'block_{i:03d}.bin').write_bytes(data); meta.append({'index':i,'addr':f"0x{int(b['addr']):08x}",'count':int(b['count'])})
          def exact(a):
              out=[]
              for s in syms:
                  try:sa=int(s['addr']); z=int(s.get('size',0))
                  except Exception:continue
                  if sa==a:out.append({'name':s.get('name'),'addr':f'0x{sa:08x}','size':z})
              return out
          post=[s for s in syms if s.get('name') in ('Kernel_PostEvent','Kernel_SetEvent','Kernel_SignalEvent','Kernel_SetEventFlag')]
          rep={'schema':'m9.rbclosure5o.setup.v1','selected_pair':pair,'init':{'addr':'0xfeb16190','name':init.get('name'),'size':int(init['size']),'sha256':hashlib.sha256(body).hexdigest()},'event_object_0xfeb00250_symbols':exact(0xfeb00250),'g_L2Parameter_symbols':exact(0xfeb002e8),'event_post_symbol_candidates':[{'name':s.get('name'),'addr':f"0x{int(s['addr']):08x}",'size':int(s.get('size',0))} for s in post]}
          (root/'setup.json').write_text(json.dumps(rep,indent=2)+'\n'); (root/'symbols.json').write_text(json.dumps(syms,indent=2)+'\n'); (root/'blocks_meta.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(rep,indent=2))
          PY
          "$BFIN_OBJDUMP" -D -b binary -m bfin --adjust-vma=0xfeb16190 "$ROOT/init.bin" > "$ROOT/init.dis"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb5o'; meta=json.load(open(root/'blocks_meta.json'))
          with open(root/'objdump_all.sh','w') as f:
              f.write('set -euo pipefail\n')
              for x in meta:
                  i=x['index']; f.write(f'"$BFIN_OBJDUMP" -D -b binary -m bfin --adjust-vma={x["addr"]} "$RUNNER_TEMP/rb5o/blocks/block_{i:03d}.bin" > "$RUNNER_TEMP/rb5o/dis/block_{i:03d}.dis"\n')
          PY
          bash "$ROOT/objdump_all.sh"

      - name: Trace Init R2 lineage and start-event producers
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rb5o"
          python3 - <<'PY'
          import os,pathlib,re,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb5o'; setup=json.load(open(root/'setup.json')); syms=json.load(open(root/'symbols.json')); bmeta=json.load(open(root/'blocks_meta.json'))
          rx=re.compile(r'^\s*([0-9a-f]+):\s+([0-9a-f ]+?)\s+(.+)$',re.I); tr=re.compile(r'0x0?([0-9a-f]{8})',re.I)
          def parse(path,block=None):
              out=[]
              for line in path.read_text(errors='replace').splitlines():
                  m=rx.match(line)
                  if m:out.append({'addr':int(m.group(1),16),'bytes':m.group(2).strip(),'asm':m.group(3).strip(),'block':block})
              return out
          def syminfo(addr):
              ex=[];cv=[]
              for s in syms:
                  try:a=int(s['addr']);z=int(s.get('size',0))
                  except Exception:continue
                  if a==addr:ex.append({'name':s.get('name'),'addr':f'0x{a:08x}','size':z})
                  if z>0 and a<=addr<a+z:cv.append({'name':s.get('name'),'addr':f'0x{a:08x}','size':z})
              return {'exact':ex,'covering':cv}
          def ser(xs):return [{'addr':f"0x{x['addr']:08x}",'bytes':x['bytes'],'asm':x['asm'],'block':x.get('block')} for x in xs]
          init=parse(root/'init.dis')
          r2_refs=[]; copies=[]; loads=[]; stores=[]; calls=[]
          aliases={'R2'}
          for idx,x in enumerate(init):
              u=x['asm'].upper()
              if re.search(r'\bR2\b',u):r2_refs.append(x)
              # Track simple copies from a known alias into register/pointer.
              m=re.search(r'^\s*([RP][0-7]?)\s*=\s*([RP][0-7]?)\s*;',u)
              if m and m.group(2) in aliases:
                  aliases.add(m.group(1)); copies.append(x)
              if any(re.search(r'\['+re.escape(a)+r'(?:\s*[+\-][^\]]+)?\]',u) for a in aliases):
                  if re.search(r'\[[^\]]+\]\s*=',u):stores.append(x)
                  if re.search(r'=\s*(?:B|W)?\[[^\]]+\]',u):loads.append(x)
              if 'CALL ' in u:
                  mt=tr.search(x['asm']); tgt=int(mt.group(1),16) if mt else None
                  calls.append({'addr':f"0x{x['addr']:08x}",'asm':x['asm'],'target':f'0x{tgt:08x}' if tgt is not None else None,'target_symbols':syminfo(tgt) if tgt is not None else None,'aliases_at_call':sorted(aliases)})
          # Search event object materializations and calls to known event-post candidates.
          allins=[]
          for bm in bmeta:
              i=bm['index']; allins.extend(parse(root/'dis'/f'block_{i:03d}.dis',i))
          low_event=re.compile(r'\b([RPI][0-7]?)\.L\s*=\s*0x0?250\b',re.I); hi_event=re.compile(r'\b([RPI][0-7]?)\.H\s*=\s*0xfeb0\b',re.I)
          event_mats=[]
          for j,x in enumerate(allins):
              ml=low_event.search(x['asm'])
              if not ml:continue
              reg=ml.group(1).upper()
              for k in range(j+1,min(len(allins),j+12)):
                  if allins[k].get('block')!=x.get('block'):break
                  mh=hi_event.search(allins[k]['asm'])
                  if mh and mh.group(1).upper()==reg:
                      ctx=allins[max(0,j-20):min(len(allins),k+40)]
                      event_mats.append({'low_site':f"0x{x['addr']:08x}",'high_site':f"0x{allins[k]['addr']:08x}",'register':reg,'owner':syminfo(x['addr']),'context':ser(ctx)})
                      break
          post_addrs={int(s['addr'],16):s['name'] for s in setup.get('event_post_symbol_candidates',[])}
          post_calls=[]
          for j,x in enumerate(allins):
              if 'CALL ' not in x['asm'].upper():continue
              mt=tr.search(x['asm'])
              if not mt:continue
              t=int(mt.group(1),16)
              if t in post_addrs:
                  post_calls.append({'site':f"0x{x['addr']:08x}",'target':f'0x{t:08x}','name':post_addrs[t],'owner':syminfo(x['addr']),'context':ser(allins[max(0,j-30):min(len(allins),j+8)])})
          rep={'schema':'m9.rbclosure5o.init-parameter-direction.v1','setup':setup,'init_body':ser(init),'r2_direct_references':ser(r2_refs),'r2_alias_copies':ser(copies),'parameter_aliases_seen':sorted(aliases),'loads_via_parameter_aliases':ser(loads),'stores_via_parameter_aliases':ser(stores),'calls':calls,'event_object_materializations':event_mats,'event_post_calls':post_calls,'analysis_guard':'Alias scan is conservative/simple. Use exact disassembly semantics before declaring read-only or write-only.'}
          raw=(json.dumps(rep,indent=2)+'\n').encode(); (root/'evidence'/'init_parameter_direction.json').write_bytes(raw)
          with open(root/'evidence'/'init_parameter_direction.txt','w') as f:
              f.write('INIT BODY\n'); [f.write(f"{q['addr']}  {q['asm']}\n") for q in ser(init)]
              f.write('\nR2 DIRECT REFS\n'); [f.write(f"{q['addr']}  {q['asm']}\n") for q in ser(r2_refs)]
              f.write('\nALIAS COPIES\n'); [f.write(f"{q['addr']}  {q['asm']}\n") for q in ser(copies)]
              f.write('\nLOADS VIA ALIASES\n'); [f.write(f"{q['addr']}  {q['asm']}\n") for q in ser(loads)]
              f.write('\nSTORES VIA ALIASES\n'); [f.write(f"{q['addr']}  {q['asm']}\n") for q in ser(stores)]
              f.write('\nEVENT OBJECT MATERIALIZATIONS\n'); [f.write(json.dumps(q)+'\n') for q in event_mats]
              f.write('\nEVENT POST CALLS\n'); [f.write(json.dumps(q)+'\n') for q in post_calls]
          (root/'evidence'/'init_parameter_direction.sha256.txt').write_text(hashlib.sha256(raw).hexdigest()+'  init_parameter_direction.json\n')
          print((root/'evidence'/'init_parameter_direction.txt').read_text())
          PY
          sha256sum "$ROOT/evidence"/* > "$ROOT/evidence/SHA256SUMS.txt"

      - name: Upload Init/event evidence
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-RBCLOSURE5O-INIT-PARAMETER-DIRECTION
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/rb5o/evidence/*

      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/rb5o/pass" "$RUNNER_TEMP/rb5o/m9.upd" "$RUNNER_TEMP/rb5o/mm.upm" "$RUNNER_TEMP/rb5o/m9.dec" "$RUNNER_TEMP/rb5o/blocks" "$RUNNER_TEMP/rb5o/dis" "$RUNNER_TEMP/rb5o/init.bin" "$RUNNER_TEMP/rb5o/init.dis" "$RUNNER_TEMP/rb5o/setup.json" "$RUNNER_TEMP/rb5o/symbols.json" "$RUNNER_TEMP/rb5o/blocks_meta.json" "$RUNNER_TEMP/rb5o/objdump_all.sh"
