name: M9Cam 2.90 custom colour validation
on:
  pull_request:
    branches: ['main', 'codex/rawgeometry1a-v2.89']
    paths: ['patches/cctguard1a/**', '.github/workflows/build-m9cam-cctguard1a.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Provision pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Reconstruct pinned source
        run: |
          python3 patches/focustrack1a/assemble.py "$RUNNER_TEMP/PhotonCamera_272"
          python3 patches/afcontinuity1a/assemble.py "$RUNNER_TEMP/PhotonCamera_273" --parent "$RUNNER_TEMP/PhotonCamera_272"
          python3 patches/afcontinuity1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_272" "$RUNNER_TEMP/PhotonCamera_273"
          python3 patches/aflifecycle1a/assemble.py "$RUNNER_TEMP/PhotonCamera_274" --parent "$RUNNER_TEMP/PhotonCamera_273"
          python3 patches/aflifecycle1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_273" "$RUNNER_TEMP/PhotonCamera_274"
          python3 patches/aftaphandover1a/assemble.py "$RUNNER_TEMP/PhotonCamera_275" --parent "$RUNNER_TEMP/PhotonCamera_274"
          python3 patches/aftaphandover1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_274" "$RUNNER_TEMP/PhotonCamera_275"
          python3 patches/monoplanwait1a/assemble.py "$RUNNER_TEMP/PhotonCamera_276" --parent "$RUNNER_TEMP/PhotonCamera_275"
          python3 patches/monoplanwait1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_275" "$RUNNER_TEMP/PhotonCamera_276"
          python3 patches/uisettings1a/assemble.py "$RUNNER_TEMP/PhotonCamera_277" --parent "$RUNNER_TEMP/PhotonCamera_276"
          python3 patches/uisettings1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_276" "$RUNNER_TEMP/PhotonCamera_277"
          python3 patches/focuspoint1a/assemble.py "$RUNNER_TEMP/PhotonCamera_278" --parent "$RUNNER_TEMP/PhotonCamera_277"
          python3 patches/focuspoint1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_277" "$RUNNER_TEMP/PhotonCamera_278"
          python3 patches/monosavepipe1a/assemble.py "$RUNNER_TEMP/PhotonCamera_279" --parent "$RUNNER_TEMP/PhotonCamera_278"
          python3 patches/monosavepipe1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_278" "$RUNNER_TEMP/PhotonCamera_279"
          python3 patches/monoplanwait1b/assemble.py "$RUNNER_TEMP/PhotonCamera_280" --parent "$RUNNER_TEMP/PhotonCamera_279"
          python3 patches/monoplanwait1b/verify_source.py "$RUNNER_TEMP/PhotonCamera_279" "$RUNNER_TEMP/PhotonCamera_280"
          python3 patches/monodiagexport1c/assemble.py "$RUNNER_TEMP/PhotonCamera_281" --parent "$RUNNER_TEMP/PhotonCamera_280"
          python3 patches/monodiagexport1c/verify_source.py "$RUNNER_TEMP/PhotonCamera_280" "$RUNNER_TEMP/PhotonCamera_281"
          python3 patches/monodiagview1d/assemble.py "$RUNNER_TEMP/PhotonCamera_282" --parent "$RUNNER_TEMP/PhotonCamera_281"
          python3 patches/monodiagview1d/verify_source.py "$RUNNER_TEMP/PhotonCamera_281" "$RUNNER_TEMP/PhotonCamera_282"
          python3 patches/monoaeref1a/assemble.py "$RUNNER_TEMP/PhotonCamera_283" --parent "$RUNNER_TEMP/PhotonCamera_282"
          python3 patches/monoaeref1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_282" "$RUNNER_TEMP/PhotonCamera_283"
          python3 patches/monoaeref1b/assemble.py "$RUNNER_TEMP/PhotonCamera_284" --parent "$RUNNER_TEMP/PhotonCamera_283"
          python3 patches/monoaeref1b/verify_source.py "$RUNNER_TEMP/PhotonCamera_283" "$RUNNER_TEMP/PhotonCamera_284"
          python3 patches/upstreamui1a/assemble.py "$RUNNER_TEMP/PhotonCamera_285" --parent "$RUNNER_TEMP/PhotonCamera_284"
          python3 patches/upstreamui1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_284" "$RUNNER_TEMP/PhotonCamera_285"
          python3 patches/upstreamui1b/assemble.py "$RUNNER_TEMP/PhotonCamera_286" --parent "$RUNNER_TEMP/PhotonCamera_285"
          python3 patches/upstreamui1b/verify_source.py "$RUNNER_TEMP/PhotonCamera_285" "$RUNNER_TEMP/PhotonCamera_286"
          python3 patches/rawsize1a/assemble.py "$RUNNER_TEMP/PhotonCamera_287" --parent "$RUNNER_TEMP/PhotonCamera_286"
          python3 patches/rawsize1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_286" "$RUNNER_TEMP/PhotonCamera_287"
          python3 patches/gallerypause1a/assemble.py "$RUNNER_TEMP/PhotonCamera_288" --parent "$RUNNER_TEMP/PhotonCamera_287"
          python3 patches/gallerypause1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_287" "$RUNNER_TEMP/PhotonCamera_288"
          python3 patches/rawgeometry1a/assemble.py "$RUNNER_TEMP/PhotonCamera_289" --parent "$RUNNER_TEMP/PhotonCamera_288"
          python3 patches/rawgeometry1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_288" "$RUNNER_TEMP/PhotonCamera_289"
          python3 patches/cctguard1a/assemble.py "$RUNNER_TEMP/PhotonCamera_290" --parent "$RUNNER_TEMP/PhotonCamera_289"
          python3 patches/cctguard1a/verify_source.py "$RUNNER_TEMP/PhotonCamera_289" "$RUNNER_TEMP/PhotonCamera_290"
          python3 patches/cctguard1a/host_probe.py "$RUNNER_TEMP/PhotonCamera_290" "$RUNNER_TEMP/PhotonCamera_289"
      - name: Build Android and verify gallery, exposure and capture lifecycle
        working-directory: ${{ runner.temp }}/PhotonCamera_290
        run: |
          bash gradlew :app:assembleDebug :app:testDebugUnitTest --tests '*MonoReadinessDialogTest' --tests '*MonoExposureReadinessTest' --tests '*MonoReadinessExportTest' --tests '*MonoPrimaryEvidenceTest' --tests '*MonoDiagnosticPreferenceTest' --tests '*StillCaptureLifecycleTest' --tests '*MonoPlanObservationTest' --tests '*ProfileCaptureTest' --tests '*GalleryThumbnailThreadTest' --tests '*RendererSwitchLifecycleTest' --tests '*ExifHistogramRequestTest' --tests '*RawSizeCompatibilityTest' --tests '*GalleryPauseLifecycleTest' --tests '*RawGeometryTest' --tests '*ColorCorrectionTransformTest' --tests '*CustomColorGuardTest' --no-daemon --max-workers=2
          bash gradlew :circularbarlib:verifyReleaseResources --no-daemon --max-workers=2
      - name: Verify focused test results
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import os, xml.etree.ElementTree as ET
          paths=list((Path(os.environ['RUNNER_TEMP'])/'PhotonCamera_290/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          suites=[ET.parse(p).getroot() for p in paths]
          assert suites and sum(int(s.get('tests',0)) for s in suites) >= 235
          assert all(int(s.get(k,0)) == 0 for s in suites for k in ['failures','errors','skipped'])
          assert any(s.get('name','').endswith('MonoReadinessDialogTest') and int(s.get('tests')) == 4 for s in suites)
          assert any(s.get('name','').endswith('MonoPlanObservationTest') and int(s.get('tests')) == 32 for s in suites)
          assert any(t.get('name') == 'phoneReportMissingAeModeAndStateUsesMeasuredExposureAndAppliesEvOnce' for s in suites for t in s.findall('testcase'))
          assert any(s.get('name','').endswith('ExifHistogramRequestTest') and int(s.get('tests')) == 6 for s in suites)
          assert any(s.get('name','').endswith('GalleryThumbnailThreadTest') and int(s.get('tests')) == 7 for s in suites)
          assert any(s.get('name','').endswith('RendererSwitchLifecycleTest') and int(s.get('tests')) == 5 for s in suites)
          assert any(s.get('name','').endswith('RawSizeCompatibilityTest') and int(s.get('tests')) == 29 for s in suites)
          assert any(s.get('name','').endswith('GalleryPauseLifecycleTest') and int(s.get('tests')) == 5 for s in suites)
          assert any(s.get('name','').endswith('RawGeometryTest') and int(s.get('tests')) == 22 for s in suites)
          assert any(s.get('name','').endswith('ColorCorrectionTransformTest') and int(s.get('tests')) == 5 for s in suites)
          assert any(s.get('name','').endswith('CustomColorGuardTest') and int(s.get('tests')) == 28 for s in suites)
          print('All focused tests passed:',sum(int(s.get('tests',0)) for s in suites))
          PYTEST
      - name: Download verified 2.89 installer
        uses: actions/download-artifact@v4
        with:
          name: M9Cam-2.89-READY-TO-INSTALL
          run-id: 38795325624
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/accepted289
      - name: Package signed installer with accepted native libraries
        run: |
          python3 patches/cctguard1a/package.py "$RUNNER_TEMP/PhotonCamera_290" "$RUNNER_TEMP/PhotonCamera_290/app/build/outputs/apk/debug/M9Cam_2.90_CCTGUARD1A-debug.apk" "$RUNNER_TEMP/accepted289/M9Cam_2.89_RAWGEOMETRY1A.apk" "$ANDROID_HOME/build-tools/35.0.0" "$RUNNER_TEMP/installer290"
          python3 patches/cctguard1a/verify_installer.py "$RUNNER_TEMP/installer290" "$ANDROID_HOME/build-tools/35.0.0"
      - name: Upload ready-to-install package
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-2.90-READY-TO-INSTALL
          path: |
            ${{ runner.temp }}/installer290/M9Cam_2.90_CCTGUARD1A.apk
            ${{ runner.temp }}/installer290/SHA256SUMS.txt
            ${{ runner.temp }}/installer290/PACKAGED_VERIFICATION.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain packaging tools
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/packaging-tools/lib"
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" "$ANDROID_HOME/build-tools/35.0.0/aapt2" "$RUNNER_TEMP/packaging-tools/"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/packaging-tools/lib/"
          cp -r "$ANDROID_HOME/build-tools/35.0.0/lib64" "$RUNNER_TEMP/packaging-tools/"
      - name: Retain build and test results for final packaging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cctguard1a-android-build
          path: |
            ${{ runner.temp }}/packaging-tools/**
            ${{ runner.temp }}/PhotonCamera_290/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/PhotonCamera_290/app/build/test-results/testDebugUnitTest/**
            ${{ runner.temp }}/PhotonCamera_290/app/build/reports/tests/testDebugUnitTest/**
          retention-days: 7
