name: M9Cam 3.49 JPEGPERF build, parity, tests and installer

# 3.49 is delivered (run 46130662666); later stages on this branch rebuild it on request only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m9cam-jpegperf349-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Provision pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'

      - name: Reconstruct the 3.44 through 3.49 sources
        run: python3 scripts/ci/prepare_349.py "$RUNNER_TEMP/ci-source"

      - name: Rebuild 3.44 and 3.48 native libraries at the accepted build path
        # The accepted libraries embed /home/runner/work/M9Camera_refresh/M9Camera_refresh/PhotonCamera.
        run: |
          for parent in 344 348; do
            cp -a "$RUNNER_TEMP/ci-source/PhotonCamera_$parent" "$GITHUB_WORKSPACE/PhotonCamera"
            # Retry: Maven Central occasionally rate-limits hosted runners (HTTP 429).
            for attempt in 1 2 3; do
              (cd PhotonCamera && bash gradlew :app:externalNativeBuildDebug --no-daemon --max-workers=2) && break
              [ "$attempt" = 3 ] && exit 1
              sleep 60
            done
            for abi in arm64-v8a armeabi-v7a; do
              mkdir -p "$RUNNER_TEMP/native-$parent/$abi"
              find PhotonCamera/app/build/intermediates/cxx -path "*/obj/$abi/*.so" -exec cp -n {} "$RUNNER_TEMP/native-$parent/$abi/" \;
              ls -la "$RUNNER_TEMP/native-$parent/$abi"
            done
            rm -rf "$GITHUB_WORKSPACE/PhotonCamera"
          done

      - name: Place the 3.49 candidate at the same build path
        run: |
          mv "$RUNNER_TEMP/ci-source/PhotonCamera_349" "$GITHUB_WORKSPACE/PhotonCamera"
          mkdir -p ci-reports
          cp -r "$RUNNER_TEMP/ci-source/verification" ci-reports/verification

      - name: Host native parity (3.44 kernels, ThreadSanitizer, DNG writer; 3.46 scheduling; 3.48 vs 3.49 noise cancel)
        run: |
          python3 -m pip install numpy
          python3 patches/exactperf1a/host/native_parity.py "$RUNNER_TEMP/ci-source/PhotonCamera_344" PhotonCamera ci-reports/native-parity
          python3 patches/jpegperf346/host/native_parity346.py "$RUNNER_TEMP/ci-source/PhotonCamera_346" PhotonCamera ci-reports/native-parity-346
          python3 patches/jpegperf349/host/noise_parity349.py "$RUNNER_TEMP/ci-source/PhotonCamera_348" PhotonCamera ci-reports/noise-parity-349

      - name: Verify 12 MP JPEG denoising under allocation pressure
        run: |
          g++ -std=c++17 -O2 -pthread -DM9NOISEPERF1A_HOST patches/jpegperf347/host/noise_pressure.cpp \
            PhotonCamera/app/src/main/cpp/m9noisecancel1b.cpp -o "$RUNNER_TEMP/noise_pressure"
          "$RUNNER_TEMP/noise_pressure" | tee ci-reports/noise-pressure-347.txt

      - name: Exercise DNG storage failures, worker memory pressure and face-meter frame matching
        run: |
          bash patches/performance345/host/check_java.sh PhotonCamera
          python3 patches/performance345/host/worker_pressure.py PhotonCamera ci-reports/native-parity

      - name: Run tracking and focus policy checks against 3.49
        run: bash scripts/ci/test_tracking.sh PhotonCamera

      - name: Initialize Java and Kotlin analysis
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          source-root: PhotonCamera
          threads: 2

      - name: Build and run all selected regression suites
        # Retry: Maven Central occasionally rate-limits hosted runners (HTTP 429).
        run: |
          for attempt in 1 2 3; do
            python3 scripts/ci/verify_tests.py "$GITHUB_WORKSPACE/PhotonCamera" --run && break
            [ "$attempt" = 3 ] && exit 1
            sleep 60
          done

      - name: Verify library release resources
        working-directory: PhotonCamera
        run: bash gradlew :circularbarlib:verifyReleaseResources --no-daemon --max-workers=2

      - name: Native provenance and 3.48 delta gates
        run: |
          mkdir -p installer
          python3 patches/exactperf1a/native_provenance.py patches/trackingrecovery1a/baseline \
            "$RUNNER_TEMP/native-344" \
            PhotonCamera/app/build/outputs/apk/debug/M9Cam_3.49_JPEGPERF-debug.apk installer
          python3 patches/jpegperf346/native_delta.py "$RUNNER_TEMP/native-348" \
            PhotonCamera/app/build/outputs/apk/debug/M9Cam_3.49_JPEGPERF-debug.apk installer 348 349

      - name: Package and verify the 3.49 installer
        run: |
          cp ci-reports/verification/jpegperf349.json installer/SOURCE_VERIFICATION.json
          cp ci-reports/verification/MODEL_PROVENANCE.json installer/
          cp ci-reports/native-parity/NATIVE_PARITY.json installer/
          cp ci-reports/native-parity-346/NATIVE_PARITY_346.json installer/
          cp ci-reports/noise-parity-349/NOISE_PARITY_349.json installer/
          cp TEST_VERIFICATION.json installer/
          python3 patches/exactperf1a/package.py PhotonCamera \
            PhotonCamera/app/build/outputs/apk/debug/M9Cam_3.49_JPEGPERF-debug.apk \
            patches/trackingrecovery1a/baseline "$ANDROID_HOME/build-tools/35.0.0" installer

      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-3.49-JPEGPERF-installer
          path: installer/
          if-no-files-found: error
          retention-days: 90

      - name: Build the scoped-storage instrumentation tests
        working-directory: PhotonCamera
        run: bash gradlew -I ../patches/jpegstore348/device-tests.gradle :app:assembleDebugAndroidTest --no-daemon --max-workers=2

      - uses: actions/upload-artifact@v4
        with:
          name: jpegperf349-device-tests
          path: PhotonCamera/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Analyze reconstructed production source
        uses: github/codeql-action/analyze@v4
        with:
          category: /m9cam-jpegperf349/java-kotlin
          output: ci-reports/codeql
          wait-for-processing: true

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9cam-jpegperf349-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-reports/**
            installer/*.json
            TEST_VERIFICATION.json
            PhotonCamera/app/build/test-results/testDebugUnitTest/**
            PhotonCamera/app/build/reports/tests/testDebugUnitTest/**
          retention-days: 30
          if-no-files-found: warn

  device-storage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: M9Cam-3.49-JPEGPERF-installer
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: jpegperf349-device-tests
          path: tests
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the signed APK in Android shared DCIM storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          script: |
            adb install -t installer/M9Cam_3.49_JPEGPERF.apk
            adb install -t tests/*.apk
            adb shell am instrument -w -r -e class com.particlesdevs.photoncamera.m9.render.M9SharedJpegTest com.m9project.m9cam.photon.test/androidx.test.runner.AndroidJUnitRunner | tee storage-tests.txt
            grep -F 'OK (5 tests)' storage-tests.txt
      - name: Retain device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpegperf349-emulator-results
          path: storage-tests.txt
