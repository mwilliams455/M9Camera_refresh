name: M9 R/B GREENORACLE6D Filter010 Direct Observe

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-greenoracle6d-filter010-observe.yml'
      - 'research/bfin/filter010101010_oracle_observe.s'
      - 'research/bfin/GREENORACLE6C2_FILTER010_BODY_FROZEN.json'

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Blackfin toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          curl --fail --location --retry 4 --retry-all-errors -o gdb-17.2.tar.xz https://ftp.gnu.org/gnu/gdb/gdb-17.2.tar.xz
          tar -xf binutils-2.44.tar.xz; tar -xf gdb-17.2.tar.xz
          mkdir binutils-build && cd binutils-build
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-sim >/dev/null
          make -j2 all-binutils all-gas all-ld >/dev/null
          echo "BFIN_AS=$PWD/gas/as-new" >> "$GITHUB_ENV"; echo "BFIN_LD=$PWD/ld/ld-new" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"; mkdir gdb-build && cd gdb-build
          ../gdb-17.2/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gdbserver >/dev/null
          make -j2 all-sim >/dev/null
          SIM=$(find "$PWD" -type f \( -path '*/sim/bfin/run' -o -name 'bfin-elf-run' \) -perm -111 | head -1 || true)
          test -n "$SIM"; echo "BFIN_SIM=$SIM" >> "$GITHUB_ENV"

      - name: Recover exact Leica Filter010 body
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/green6d"; mkdir -p "$ROOT/evidence"
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json" >/dev/null
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass" >/dev/null
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'green6d'
          d=json.load(open(root/'pass/report.json'))
          expected='7d6846f6954ff09bb532ea99fac8633bfa0716458a4f8dbb448704517bb0f5a7'
          addr=0xffa03e00; size=0x1a2
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py')
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          hits=[]
          for i,_ in enumerate(d.get('bf561_deep',[])):
            try:
              bf0=next((root/'pass'/f'bf561_pair_{i:02d}').rglob('bf0.bin'))
              _,blocks=m.parse_ldr(bf0); body=m.read_overlay(blocks,addr,size); sha=hashlib.sha256(body).hexdigest()
              if sha==expected:
                hits.append(i); (root/'ASMFilter_010_101_010_2.bin').write_bytes(body); break
            except Exception: pass
          if not hits: raise SystemExit('canonical Filter010 body not found')
          json.dump({'address':hex(addr),'size':size,'sha256':expected,'selected_pair':hits[0]},open(root/'evidence'/'filter010_body.json','w'),indent=2)
          PY

      - name: Execute deterministic observation matrix
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/green6d"
          cp research/bfin/filter010101010_oracle_observe.s "$ROOT/"
          cat > "$ROOT/oracle.ld" <<'LDS'
          ENTRY(_start)
          SECTIONS {
            . = 0x1000; .text : { *(.text.start) *(.text*) }
            . = 0x4000; .source : { *(.source) }
            . = 0x7000; .dest : { *(.dest) }
            . = 0x9800; .stack : { *(.stack) }
          }
          LDS
          cd "$ROOT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,random,re,subprocess
          N=2048; INNER=8; OUTER=4; DESTBASE=0x7044; SENT=0x5a5a
          ev=pathlib.Path('evidence')
          edge=[0,1,2,3,4,7,8,0x1fff,0x3fff,0x4000,0x7fff,0x8000,0xfffe,0xffff]
          def pattern(kind,seed):
              if kind=='zero': return [0]*N
              if kind=='one': return [1]*N
              if kind=='ramp': return [i & 0xffff for i in range(N)]
              if kind=='edges': return [edge[i%len(edge)] for i in range(N)]
              rng=random.Random(seed); a=[rng.randrange(65536) for _ in range(N)]
              for j,v in enumerate(edge): a[480+j]=v
              return a
          report={'schema':'m9.greenoracle6d.filter010-direct-observe.v1','routine_sha256':'7d6846f6954ff09bb532ea99fac8633bfa0716458a4f8dbb448704517bb0f5a7','inner':INNER,'outer':OUTER,'destbase':hex(DESTBASE),'sentinel':hex(SENT),'runs':{}}
          for mode in (2,0):
            for stride in (16,17):
              for phase,srcbase in (('p0',0x4400),('p2',0x4402)):
                for pi,kind in enumerate(('zero','one','ramp','edges','random')):
                  seed=0x01010100 + mode*0x10000 + stride*0x100 + (2 if phase=='p2' else 0) + pi
                  src=pattern(kind,seed)
                  pathlib.Path('source_data.inc').write_text(''.join(f'.short 0x{v:04x}\n' for v in src))
                  name=f'm{mode}_s{stride}_{phase}_{kind}'
                  subprocess.run([os.environ['BFIN_AS'],'--defsym',f'INNER={INNER}','--defsym',f'OUTER={OUTER}','--defsym',f'STRIDE={stride}','--defsym',f'SRCBASE={srcbase}','--defsym',f'DESTBASE={DESTBASE}','--defsym',f'MODE={mode}','filter010101010_oracle_observe.s','-o',f'{name}.o'],check=True,stdout=subprocess.DEVNULL)
                  subprocess.run([os.environ['BFIN_LD'],'-T','oracle.ld',f'{name}.o','-o',f'{name}.elf'],check=True,stdout=subprocess.DEVNULL)
                  p=subprocess.run([os.environ['BFIN_SIM'],f'{name}.elf'],capture_output=True,text=True)
                  if p.returncode: raise SystemExit(f'{name}: rc={p.returncode}: {p.stderr}')
                  vals=[int(x,16) for x in re.findall(r'DBG\s*:\s*R0\s*=\s*0x([0-9a-fA-F]+)',p.stdout)]
                  if len(vals)!=128: raise SystemExit(f'{name}: dbg={len(vals)}')
                  dest=[]
                  for q in vals: dest += [q&0xffff,(q>>16)&0xffff]
                  touched=[i for i,v in enumerate(dest) if v!=SENT]
                  base=(srcbase-0x4000)//2
                  report['runs'][name]={
                    'mode':mode,'stride':stride,'phase':phase,'srcbase':hex(srcbase),'source_base_halfword':base,'pattern':kind,'seed':seed,
                    'touched_count':len(touched),'touched_indices':touched,
                    'first_touched':min(touched) if touched else None,'last_touched':max(touched) if touched else None,
                    'touched_values':[dest[i] for i in touched],
                    'destination':dest
                  }
          raw=(json.dumps(report,indent=2)+'\n').encode(); (ev/'filter010_direct_observe.json').write_bytes(raw); (ev/'filter010_direct_observe.sha256.txt').write_text(hashlib.sha256(raw).hexdigest()+'  filter010_direct_observe.json\n')
          # Compact geometry summary: one row per mode/stride/phase, using random pattern.
          lines=[]
          for n,r in report['runs'].items():
              if r['pattern']=='random': lines.append(f"{n} touched={r['touched_count']} first={r['first_touched']} last={r['last_touched']} idx={r['touched_indices']}")
          (ev/'filter010_geometry_summary.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
          sha256sum "$ROOT/evidence"/* > "$ROOT/evidence/SHA256SUMS.txt"

      - name: Publish observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-GREENORACLE6D-FILTER010-DIRECT-OBSERVE
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/green6d/evidence/*

      - name: Remove firmware and binaries
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/green6d/pass" "$RUNNER_TEMP/green6d/m9.upd" "$RUNNER_TEMP/green6d/mm.upm" "$RUNNER_TEMP/green6d/m9.dec" "$RUNNER_TEMP/green6d/ASMFilter_010_101_010_2.bin" "$RUNNER_TEMP/green6d"/*.o "$RUNNER_TEMP/green6d"/*.elf "$RUNNER_TEMP/green6d/source_data.inc"
