name: Build M9Cam BASISHSM1J SHADEDGUARDCAP20EV1A

on:
  workflow_dispatch:
  push:
    branches:
      - m9nohdr1a-sourcecal2a-basishsm1j-shadedguardcap20ev1a

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout M9 recovery repo
        uses: actions/checkout@v4

      - name: Verify cap20EV patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-basishsm1j-shadedguardcap20ev1a.py
          python3 -m py_compile patches/verify-m9cam-basishsm1j-shadedguardcap20ev1a.py

      - name: Clone pinned PhotonCamera baseline
        run: |
          set -euo pipefail
          PHOTON_SHA=f0e6425d2509fb8ab834d5d3af593183038b778c
          git clone --depth 1 --branch dev https://github.com/eszdman/PhotonCamera.git PhotonCamera
          git -C PhotonCamera fetch --depth 1 origin "$PHOTON_SHA"
          git -C PhotonCamera checkout --detach FETCH_HEAD
          test "$(git -C PhotonCamera rev-parse HEAD)" = "$PHOTON_SHA"
          git -C PhotonCamera rev-parse HEAD | tee PHOTON_UPSTREAM_COMMIT.txt

      - name: Apply frozen FINALCLIPAUDIT1A chain plus cap20EV candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-basishsm1i-finalclipaudit.yml')
          if not wf.exists():
              raise SystemExit('BASISHSM1J missing parent 1I workflow')
          lines = wf.read_text().splitlines()
          target = '      - name: Apply frozen SHADEDGUARDAB1A chain plus final clipping audit'
          try:
              i = lines.index(target)
          except ValueError:
              raise SystemExit('BASISHSM1J parent 1I apply step not found')
          while i < len(lines) and lines[i].strip() != 'run: |':
              i += 1
          if i >= len(lines):
              raise SystemExit('BASISHSM1J parent 1I run block not found')
          i += 1
          out = []
          while i < len(lines):
              line = lines[i]
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  out.append(line[10:])
              elif not line.strip():
                  out.append('')
              else:
                  raise SystemExit('BASISHSM1J unexpected parent run indentation: ' + line)
              i += 1
          script = '\n'.join(out) + '\n'
          if 'apply-m9cam-basishsm1i-finalclipaudit1a.py' not in script:
              raise SystemExit('BASISHSM1J extracted parent chain lacks FINALCLIPAUDIT1A')
          Path('/tmp/m9_apply_1i.sh').write_text(script)
          PY
          bash /tmp/m9_apply_1i.sh
          python3 patches/apply-m9cam-basishsm1j-shadedguardcap20ev1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1j-shadedguardcap20ev1a.py "$ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build debug APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/BASISHSM1J_SHADEDGUARDCAP20EV1A_GRADLE.log"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-BASISHSM1J-SHADEDGUARDCAP20EV1A-BUILDLOG
          path: BASISHSM1J_SHADEDGUARDCAP20EV1A_GRADLE.log
          if-no-files-found: ignore

      - name: Upload APK and upstream commit
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-BASISHSM1J-SHADEDGUARDCAP20EV1A
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            PHOTON_UPSTREAM_COMMIT.txt
          if-no-files-found: error
