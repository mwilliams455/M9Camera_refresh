name: Build M9Cam 2.15 DNGNOISESTAGE1A
on:
  workflow_dispatch:
  push:
    branches: [research/m9-dngnoisestage1a]
    paths:
      - patches/dngnoisestage1a/**
      - .github/workflows/build-m9cam-dngnoisestage1a.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: m9-dngnoisestage1a
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble DNGNOISEMETA1A plus isolated RAW noise stage
        run: python3 patches/dngnoisestage1a/assemble.py PhotonCamera
      - name: Independently validate production TIFF serializer
        run: |
          python3 -m pip install numpy tifffile
          python3 patches/dngnoisemeta1a/verify_writer.py PhotonCamera WRITER_TESTS
          python3 patches/dngnoisestage1a/verify_stage.py PhotonCamera STAGE_TESTS
      - name: Build and retain RAW16 and diagnostic policy regression gates
        working-directory: PhotonCamera
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --tests '*M9DngNoiseProfileTest' --tests '*M9DngNoiseStageTest' --tests '*M9DngExportMetadataTest' --tests '*M9RenderDiagnosticsTest' --tests '*M9Upstream2RRawPackingTest' --stacktrace
      - uses: actions/download-artifact@v4
        with:
          name: M9Cam-2.14-DNGNOISEMETA1A
          run-id: 36837955297
          github-token: ${{ github.token }}
          path: CONTROL
      - name: Preserve accepted native rendering and verify signed APK
        run: python3 patches/dngnoisestage1a/package.py PhotonCamera CONTROL/M9Cam_2.14_DNGNOISEMETA1A.apk "$ANDROID_HOME/build-tools/35.0.0" DELIVERY
      - uses: actions/upload-artifact@v4
        with:
          name: M9Cam-2.15-DNGNOISESTAGE1A
          path: DELIVERY/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M9-DNGNOISESTAGE1A-TEST-RESULTS
          path: |
            PhotonCamera/app/build/test-results/testDebugUnitTest/
            WRITER_TESTS/WRITER_VERIFICATION.json
            STAGE_TESTS/STAGE_VERIFICATION.json
