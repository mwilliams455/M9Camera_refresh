name: M9 Sharpness ISO Enum Table Closure

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpnessforensics1a
    paths:
      - '.github/workflows/m9-sharpness-iso-enum-table-closure.yml'
      - 'tools/recover_m9_key_from_shared_body.py'
      - 'tools/m9_sharpness_gateb_control_trace.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install or build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"

      - name: Download verify decrypt canonical firmware and extract BF547
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9iso2/evidence"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9iso2/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9iso2/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$RUNNER_TEMP/m9iso2/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$RUNNER_TEMP/m9iso2/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$RUNNER_TEMP/m9iso2/m9.upd" "$RUNNER_TEMP/m9iso2/mm.upm" --m9-out "$RUNNER_TEMP/m9iso2/m9.dec" --meta-out "$RUNNER_TEMP/m9iso2/evidence/recovery_meta.json"
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$RUNNER_TEMP/m9iso2/m9.dec" | sha256sum -c --strict
          python3 - <<'PY'
          import importlib.util, os, pathlib, sys, hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9iso2'
          spec=importlib.util.spec_from_file_location('gateb', pathlib.Path('tools/m9_sharpness_gateb_control_trace.py'))
          m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          bf=m.get_bf547((root/'m9.dec').read_bytes())
          if hashlib.sha256(bf).hexdigest()!=m.BF_SHA: raise SystemExit('BF547 hash mismatch')
          (root/'BF547.bin').write_bytes(bf)
          PY
          "$OBJDUMP" -D -b binary -m bfin --adjust-vma=0x20000 "$RUNNER_TEMP/m9iso2/BF547.bin" > "$RUNNER_TEMP/m9iso2/BF547.full.gnu.dis.txt"

      - name: Decode dense ISO table and cross references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,struct,json,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9iso2'; ev=root/'evidence'
          b=(root/'BF547.bin').read_bytes(); lines=(root/'BF547.full.gnu.dis.txt').read_text(errors='replace').splitlines()
          iso=[80,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400,8000,10000]
          # Exact occurrences around the dense ISO calibration region.
          occ=[]
          lo,hi=0xc9800,0xc9c00
          for width,fmt in [(2,'H'),(4,'I')]:
              for val in iso:
                  pat=struct.pack('<'+fmt,val); st=lo
                  while True:
                      p=b.find(pat,st,hi)
                      if p<0:break
                      occ.append({'offset':hex(p),'runtime':hex(p+0x20000),'width':width,'value':val})
                      st=p+1
          occ.sort(key=lambda x:(int(x['offset'],16),x['width']))
          # Dump 16-byte records spanning all dense hits and interpret as u8/u16/u32.
          records=[]
          starts=sorted(set((int(x['offset'],16)//16)*16 for x in occ))
          # expand around likely table
          if starts:
              a=max(lo,min(starts)-0x40); z=min(hi,max(starts)+0x50)
              starts=list(range(a-(a%16),z,16))
          for s in starts:
              d=b[s:s+16]
              records.append({'offset':hex(s),'runtime':hex(s+0x20000),'hex':d.hex(),
                              'u8':list(d),'u16le':list(struct.unpack('<8H',d)) if len(d)==16 else [],
                              'u32le':list(struct.unpack('<4I',d)) if len(d)==16 else []})
          (ev/'iso_dense_table_records.json').write_text(json.dumps({'occurrences':occ,'records':records},indent=2)+'\n')
          with open(ev/'iso_dense_table_records.txt','w') as f:
              for r in records:f.write(f"{r['offset']} {r['hex']} u32={r['u32le']} u16={r['u16le']}\n")

          # All exact 16-byte-stride runs where same field offset yields the M9 160..2500 sequence.
          base=[160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500]
          runs=[]
          for width,fmt in [(2,'H'),(4,'I')]:
              for field in range(0,16-width+1):
                  for start in range(lo,hi-16*len(base),1):
                      ok=True
                      for i,v in enumerate(base):
                          if b[start+i*16+field:start+i*16+field+width]!=struct.pack('<'+fmt,v): ok=False; break
                      if ok:
                          runs.append({'record_start':hex(start),'field_offset':hex(field),'width':width,'runtime':hex(start+0x20000)})
          # disassembly references to table address range or isoIndex/menu strings.
          are=re.compile(r'^\s*([0-9a-f]+):',re.I)
          refs=[]
          patterns=[r'0x0*e9[89ab][0-9a-f]{3}',r'0x0*f56e8',r'0x0*f5774',r'0x0*f3a84',r'0x0*f3a90',r'0x0*f3a98']
          for i,l in enumerate(lines):
              if any(re.search(p,l,re.I) for p in patterns):
                  m=are.match(l); refs.append({'line':i+1,'addr':hex(int(m.group(1),16)) if m else None,'text':l,'context':'\n'.join(lines[max(0,i-25):min(len(lines),i+45)])})
          # Blackfin often loads addresses as Pn.H / Pn.L pairs; collect low halves near 0x98xx-0x9bxx with high 0x000e nearby.
          pairrefs=[]
          for i,l in enumerate(lines):
              if re.search(r'P[0-5]\.L\s*=\s*0x(?:98|99|9a|9b)[0-9a-f]{2}',l,re.I):
                  ctx='\n'.join(lines[max(0,i-8):min(len(lines),i+16)])
                  if re.search(r'P[0-5]\.H\s*=\s*0xe\b',ctx,re.I): pairrefs.append({'line':i+1,'text':l,'context':ctx})
          report={'schema':'m9.sharpness.iso-enum-table-closure.v1','dense_occurrences':occ,'stride_runs':runs,'table_xrefs':refs,'hl_pair_refs':pairrefs,
                  'expected_sharp_decode':'record nIso code 4..16 -> sharp LUT 0..12; code1 -> LUT0 with special flag'}
          (ev/'iso_enum_table_closure.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'occ':len(occ),'runs':runs,'xref_count':len(refs),'hl_pair_refs':len(pairrefs)},indent=2))
          PY

      - name: Extract ISO semantic / invalid-index neighborhoods from raw bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9iso2'; ev=root/'evidence'; b=(root/'BF547.bin').read_bytes()
          needles=[b'AUTO ISO',b'PULL 80',b'ISO 160',b'isoIndex INVALID',b'ISO %4d:',b'nIso']
          out=[]
          for n in needles:
              st=0
              while True:
                  p=b.find(n,st)
                  if p<0:break
                  chunk=b[max(0,p-128):min(len(b),p+256)]
                  printable=''.join(chr(x) if 32<=x<127 else '.' for x in chunk)
                  out.append({'needle':n.decode(),'offset':hex(p),'runtime':hex(p+0x20000),'nearby_printable':printable})
                  st=p+1
          (ev/'iso_semantic_neighborhoods.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Publish derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-ISO-ENUM-TABLE-CLOSURE
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/m9iso2/evidence/*.json
            ${{ runner.temp }}/m9iso2/evidence/*.txt

      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/m9iso2/m9.upd" "$RUNNER_TEMP/m9iso2/mm.upm" "$RUNNER_TEMP/m9iso2/m9.dec" "$RUNNER_TEMP/m9iso2/BF547.bin" "$RUNNER_TEMP/m9iso2/BF547.full.gnu.dis.txt"
