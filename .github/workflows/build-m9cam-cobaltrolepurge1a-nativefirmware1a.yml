name: Build M9Cam COBALTROLEPURGE1A NATIVEFIRMWARE1A

on:
  workflow_dispatch:
  push:
    branches: [research/cobaltrolepurge1a-nativefirmware1a]
    paths:
      - 'patches/apply-m9cam-cobaltrolepurge1a-nativefirmware1a.py'
      - 'patches/verify-m9cam-cobaltrolepurge1a-nativefirmware1a.py'
      - 'M9_PRODUCTION_ARCHITECTURE_CONTRACT.md'
      - '.github/workflows/build-m9cam-cobaltrolepurge1a-nativefirmware1a.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-cobaltrolepurge1a-nativefirmware1a.py
          python3 -m py_compile patches/verify-m9cam-cobaltrolepurge1a-nativefirmware1a.py

      - name: Replay exact SHARPSOURCE1C RBANCHOR1A validated baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-sharpness-sharpsource1c-rbanchor1a.yml')
          lines = wf.read_text().splitlines()
          names = [
              'Replay exact UPSTREAMAXIS1A parent assembly',
              'Assemble frozen neutral-MHC parent',
              'Assemble SHARPSOURCE1C RBANCHOR1A',
          ]
          for idx, name in enumerate(names):
              target = '      - name: ' + name
              i = lines.index(target)
              while i < len(lines) and lines[i].strip() != 'run: |': i += 1
              if i >= len(lines): raise SystemExit('baseline run block missing: ' + name)
              i += 1; out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name:'): break
                  if line.startswith('          '): out.append(line[10:])
                  elif not line.strip(): out.append('')
                  else: raise SystemExit('unexpected baseline indentation: ' + line)
                  i += 1
              Path(f'/tmp/cobaltrolepurge_baseline_{idx}.sh').write_text('\n'.join(out) + '\n')
          PY
          for s in /tmp/cobaltrolepurge_baseline_*.sh; do bash "$s"; done

      - name: Apply DEVICEPORT1A and CFAABSTRACT1B
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-deviceport1a-cfaabstract1a.py "$ROOT"
          python3 patches/verify-m9cam-deviceport1a-cfaabstract1a.py "$ROOT"
          python3 patches/apply-m9cam-cfaabstract1b-ultrawide1a.py "$ROOT"
          python3 patches/verify-m9cam-cfaabstract1b-ultrawide1a.py "$ROOT"

      - name: Apply CFAAUTHORITY1A
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-cfaauthority1a-ultrawide1b.py "$ROOT"
          python3 patches/verify-m9cam-cfaauthority1a-ultrawide1b.py "$ROOT" | tee CFAAUTHORITY1A_VERIFY.txt

      - name: Freeze portability and native core before architecture correction
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9CfaResolver.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9PrimaryRenderQueue.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/ImageSaver.java" \
            "$ROOT/app/src/main/assets/m9/m9_r35_calibration.bin" \
            > COBALTROLEPURGE1A_FROZEN_BEFORE.sha256

      - name: Apply COBALTROLEPURGE1A NATIVEFIRMWARE1A
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-cobaltrolepurge1a-nativefirmware1a.py "$ROOT"
          python3 patches/verify-m9cam-cobaltrolepurge1a-nativefirmware1a.py "$ROOT" | tee COBALTROLEPURGE1A_VERIFY.txt

      - name: Prove native core and portability plumbing unchanged
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9CfaResolver.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9PrimaryRenderQueue.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/ImageSaver.java" \
            "$ROOT/app/src/main/assets/m9/m9_r35_calibration.bin" \
            > COBALTROLEPURGE1A_FROZEN_AFTER.sha256
          diff -u COBALTROLEPURGE1A_FROZEN_BEFORE.sha256 COBALTROLEPURGE1A_FROZEN_AFTER.sha256
          test -f "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin"
          test "$(stat -c%s "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin")" = 2048

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Snapshot corrected production architecture
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/assembled-cobaltrolepurge1a-nativefirmware1a"
          mkdir -p "$OUT"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9CfaResolver.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9PrimaryRenderQueue.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/ImageSaver.java" "$OUT/"
          cp COBALTROLEPURGE1A_VERIFY.txt CFAAUTHORITY1A_VERIFY.txt "$OUT/"
          cp COBALTROLEPURGE1A_FROZEN_BEFORE.sha256 COBALTROLEPURGE1A_FROZEN_AFTER.sha256 "$OUT/"
          sha256sum "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" > "$OUT/M9_CURVE02_FIRMWARE_SHA256.txt"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Locate runner Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk "${ANDROID_HOME:-/nonexistent}" "${ANDROID_SDK_ROOT:-/nonexistent}" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then echo 'No usable sdkmanager found' >&2; exit 1; fi
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build COBALTROLEPURGE1A APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/COBALTROLEPURGE1A_NATIVEFIRMWARE1A_GRADLE.log"

      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee COBALTROLEPURGE1A_NATIVEFIRMWARE1A_APK_SHA256.txt

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-COBALTROLEPURGE1A-NATIVEFIRMWARE1A-ASSEMBLED-SOURCE
          path: assembled-cobaltrolepurge1a-nativefirmware1a/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-COBALTROLEPURGE1A-NATIVEFIRMWARE1A-BUILDLOG
          path: COBALTROLEPURGE1A_NATIVEFIRMWARE1A_GRADLE.log
          if-no-files-found: ignore

      - name: Upload COBALTROLEPURGE1A APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-COBALTROLEPURGE1A-NATIVEFIRMWARE1A
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            COBALTROLEPURGE1A_NATIVEFIRMWARE1A_APK_SHA256.txt
            COBALTROLEPURGE1A_VERIFY.txt
            CFAAUTHORITY1A_VERIFY.txt
