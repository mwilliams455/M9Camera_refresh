name: Build M9Cam 2.20 CAPTUREREQUEST1A
on:
  workflow_dispatch:
  push:
    branches: [research/m9-capturerequest1a]
    paths:
      - patches/capturerequest1a/**
      - .github/workflows/build-m9cam-capturerequest1a.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: m9-capturerequest1a
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble capture request policy diagnostic
        run: python3 patches/capturerequest1a/assemble.py PhotonCamera
      - name: Validate production profile and RAW transport
        run: |
          python3 -m pip install numpy tifffile
          python3 patches/capturerequest1a/verify_request.py PhotonCamera REQUEST_TESTS
          python3 patches/dngprofile1a/verify_profile.py PhotonCamera PROFILE_TESTS
          python3 patches/dngprofile1b/verify_storage.py PhotonCamera STORAGE_TESTS
          python3 patches/capturerequest1a/verify_pair.py PhotonCamera PAIR_TESTS
          python3 patches/dngnoisemeta1a/verify_writer.py PhotonCamera WRITER_TESTS
          python3 patches/dngcolormeta1a/verify_color.py PhotonCamera COLOR_TESTS
      - name: Build and retain accepted RAW and metadata regression gates
        working-directory: PhotonCamera
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --tests '*M9CaptureRequestPolicyTest' --tests '*M9DngColorMetadataTest' --tests '*M9DngNoiseProfileTest' --tests '*M9DngNoiseStageTest' --tests '*M9DngExportMetadataTest' --tests '*M9RenderDiagnosticsTest' --tests '*M9Upstream2RRawPackingTest' --stacktrace
      - uses: actions/download-artifact@v4
        with:
          name: M9Cam-2.16-DNGCOLORMETA1A
          run-id: 36858015752
          github-token: ${{ github.token }}
          path: CONTROL
      - name: Preserve all native renderer binaries and verify signed APK
        run: python3 patches/capturerequest1a/package.py PhotonCamera CONTROL/M9Cam_2.16_DNGCOLORMETA1A.apk "$ANDROID_HOME/build-tools/35.0.0" DELIVERY
      - uses: actions/upload-artifact@v4
        with:
          name: M9Cam-2.20-CAPTUREREQUEST1A
          path: DELIVERY/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M9-CAPTUREREQUEST1A-TEST-RESULTS
          path: |
            PhotonCamera/app/build/test-results/testDebugUnitTest/
            REQUEST_TESTS/REQUEST_VERIFICATION.json
            PROFILE_TESTS/PROFILE_VERIFICATION.json
            STORAGE_TESTS/STORAGE_VERIFICATION.json
            PAIR_TESTS/PAIR_VERIFICATION.json
            WRITER_TESTS/WRITER_VERIFICATION.json
            COLOR_TESTS/COLOR_VERIFICATION.json
