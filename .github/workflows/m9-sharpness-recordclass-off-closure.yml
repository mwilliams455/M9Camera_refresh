name: M9 Sharpness Record Class Off Closure

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpnessforensics1a
    paths:
      - '.github/workflows/m9-sharpness-recordclass-off-closure.yml'
      - 'tools/recover_m9_key_from_shared_body.py'
      - 'tools/m9_sharpness_gateb_control_trace.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install or build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"

      - name: Download verify decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9sharp"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$RUNNER_TEMP/m9sharp/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$RUNNER_TEMP/m9sharp/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" --m9-out "$RUNNER_TEMP/m9sharp/m9.dec" --meta-out "$RUNNER_TEMP/m9sharp/recovery_meta.json"
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$RUNNER_TEMP/m9sharp/m9.dec" | sha256sum -c --strict

      - name: Extract and disassemble canonical BF547
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, os, pathlib, sys, hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp'
          spec=importlib.util.spec_from_file_location('gateb', pathlib.Path('tools/m9_sharpness_gateb_control_trace.py'))
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          fw=(root/'m9.dec').read_bytes(); bf=m.get_bf547(fw)
          if hashlib.sha256(bf).hexdigest()!=m.BF_SHA: raise SystemExit('canonical BF547 hash mismatch')
          (root/'BF547.bin').write_bytes(bf)
          PY
          "$OBJDUMP" -D -b binary -m bfin --adjust-vma=0x20000 "$RUNNER_TEMP/m9sharp/BF547.bin" > "$RUNNER_TEMP/m9sharp/BF547.full.gnu.dis.txt"

      - name: Trace sibling processing-record builders and 37070 callers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp'
          lines=(root/'BF547.full.gnu.dis.txt').read_text(errors='replace').splitlines()
          are=re.compile(r'^\s*([0-9a-f]+):')
          def A(i):
              m=are.match(lines[i]); return int(m.group(1),16) if m else None
          def windows(indices,before,after,name):
              spans=[]
              for i in sorted(set(indices)):
                  lo=max(0,i-before); hi=min(len(lines),i+after+1)
                  if spans and lo <= spans[-1][1]+4: spans[-1]=(spans[-1][0],max(spans[-1][1],hi))
                  else: spans.append((lo,hi))
              out=[]
              for n,(lo,hi) in enumerate(spans):
                  out.append(f'===== WINDOW {n} runtime {hex(A(lo) or 0)}..{hex(A(hi-1) or 0)} lines {lo+1}-{hi} =====')
                  out.extend(lines[lo:hi]); out.append('')
              (root/name).write_text('\n'.join(out)+'\n')
              return [{'lo':hex(A(lo) or 0),'hi':hex(A(hi-1) or 0),'lines':[lo+1,hi]} for lo,hi in spans]

          # Direct callers/tail-jumpers of the now-proven serializer.
          caller_idx=[]
          for i,l in enumerate(lines):
              ll=l.lower()
              if ('0x37070' in ll or '0x0x37070' in ll) and (('call' in ll) or ('jump' in ll)):
                  caller_idx.append(i)
          caller_spans=windows(caller_idx,120,80,'serializer_37070_callers.txt')

          # The 4-byte ASCII magic source used by 0x37070. Find every code construction/xref.
          magic_idx=[]
          for i,l in enumerate(lines):
              ll=l.lower()
              if '2c38' in ll or 'f2c38' in ll:
                  magic_idx.append(i)
          magic_spans=windows(magic_idx,50,120,'magic_3141_xref_contexts.txt')

          # Writes to object-relative bytes corresponding to record +4/+5/+6 in 0x37070,
          # plus the proven +7..+14 neighborhood. These expose sibling builder variants.
          obj_idx=[]; obj_hits=[]
          rx=re.compile(r'B\[P([0-7]) \+ 0x(130|131|132|133|134|135|136|137|138|139|13a)\] = R([0-7])',re.I)
          for i,l in enumerate(lines):
              m=rx.search(l)
              if m:
                  obj_idx.append(i); obj_hits.append({'runtime':hex(A(i) or 0),'base':'P'+m.group(1),'offset':'0x'+m.group(2).lower(),'src':'R'+m.group(3),'text':l})
          obj_spans=windows(obj_idx,90,110,'record_object_offsets_130_13a.txt')

          # Generic byte +4 writers: retain contexts only when nearby code also writes +0x0c
          # through the same pointer register, indicating a 68-byte processing-record writer.
          generic=[]; gen_idx=[]
          store=re.compile(r'B\[P([0-7]) \+ 0x([0-9a-f]+)\] = R([0-7])',re.I)
          parsed=[]
          for i,l in enumerate(lines):
              m=store.search(l)
              if m: parsed.append((i,'P'+m.group(1),int(m.group(2),16),'R'+m.group(3),l))
          byreg={f'P{k}':[] for k in range(8)}
          for row in parsed: byreg[row[1]].append(row)
          for row in parsed:
              i,reg,off,src,l=row
              if off!=4: continue
              nearby=[q for q in byreg[reg] if abs(q[0]-i)<=120 and q[2]==0xc]
              if nearby:
                  generic.append({'runtime':hex(A(i) or 0),'base':reg,'src':src,'text':l,'nearby_c':[{'runtime':hex(A(q[0]) or 0),'src':q[3],'text':q[4]} for q in nearby]})
                  gen_idx.append(i)
          gen_spans=windows(gen_idx,100,140,'generic_record_plus4_with_plus0c.txt')

          # Calls into common 68-byte list/transport helpers near serializer and list-building area.
          # Keep full 0x36f00..0x37d00 block so control flow and sibling constructors can be compared.
          region=[]
          for l in lines:
              m=are.match(l)
              if m and 0x36f00 <= int(m.group(1),16) < 0x37d00: region.append(l)
          (root/'bf547_processing_builders_36f00_37d00.txt').write_text('\n'.join(region)+'\n')

          report={
            'schema':'m9.sharpness.recordclass-off-closure.v1',
            'serializer_37070_call_count':len(caller_idx),
            'serializer_37070_callers':[{'runtime':hex(A(i) or 0),'text':lines[i]} for i in caller_idx],
            'magic_3141_xref_count':len(magic_idx),
            'record_object_offset_hits':obj_hits,
            'generic_plus4_candidates':generic,
            'spans':{'callers':caller_spans,'magic':magic_spans,'object':obj_spans,'generic':gen_spans},
            'known_mapping':'BF561 record+4 0->mode2 mask0x1401 (Sharp off); 3->mode1 mask0x17ff (Sharp on). Goal: classify BF547 sibling record builders/output paths without assuming 0x37070 is JPEG.'
          }
          (root/'recordclass_off_closure_report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'callers':len(caller_idx),'magic_xrefs':len(magic_idx),'object_hits':len(obj_hits),'generic_plus4':len(generic)},indent=2))
          PY

      - name: Publish derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-RECORDCLASS-OFF-CLOSURE
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/m9sharp/recordclass_off_closure_report.json
            ${{ runner.temp }}/m9sharp/serializer_37070_callers.txt
            ${{ runner.temp }}/m9sharp/magic_3141_xref_contexts.txt
            ${{ runner.temp }}/m9sharp/record_object_offsets_130_13a.txt
            ${{ runner.temp }}/m9sharp/generic_record_plus4_with_plus0c.txt
            ${{ runner.temp }}/m9sharp/bf547_processing_builders_36f00_37d00.txt
            ${{ runner.temp }}/m9sharp/recovery_meta.json

      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" "$RUNNER_TEMP/m9sharp/m9.dec" "$RUNNER_TEMP/m9sharp/BF547.bin" "$RUNNER_TEMP/m9sharp/BF547.full.gnu.dis.txt"
