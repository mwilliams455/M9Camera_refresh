name: Build M9Cam BASISHSM1P SKYCHROMA1B

on:
  workflow_dispatch:
  push:
    branches:
      - m9nohdr1a-sourcecal2a-basishsm1p-skychroma1b

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout M9 recovery repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify diagnostic patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-basishsm1p-skychroma1a.py
          python3 -m py_compile patches/verify-m9cam-basishsm1p-skychroma1a.py
          python3 -m py_compile patches/apply-m9cam-basishsm1p-skychroma1b.py
          python3 -m py_compile patches/verify-m9cam-basishsm1p-skychroma1b.py
          python3 -m py_compile patches/apply-m9cam-basishsm1p-nativesource1a.py
          python3 -m py_compile patches/verify-m9cam-basishsm1p-nativesource1a.py

      - name: Clone pinned PhotonCamera baseline
        run: |
          set -euo pipefail
          PHOTON_SHA=f0e6425d2509fb8ab834d5d3af593183038b778c
          git clone --depth 1 --branch dev https://github.com/eszdman/PhotonCamera.git PhotonCamera
          git -C PhotonCamera fetch --depth 1 origin "$PHOTON_SHA"
          git -C PhotonCamera checkout --detach FETCH_HEAD
          test "$(git -C PhotonCamera rev-parse HEAD)" = "$PHOTON_SHA"
          git -C PhotonCamera rev-parse HEAD | tee PHOTON_UPSTREAM_COMMIT.txt

      - name: Apply exact 1P plus SKYCHROMA1A scaffold then refine 1B
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-basishsm1p-nativesource1a.yml')
          lines = wf.read_text().splitlines()
          target = '      - name: Apply validated 1O chain then promote native source 1P'
          try: i = lines.index(target)
          except ValueError: raise SystemExit('SKYCHROMA1B 1P apply step not found')
          while i < len(lines) and lines[i].strip() != 'run: |': i += 1
          if i >= len(lines): raise SystemExit('SKYCHROMA1B 1P run block missing')
          i += 1; out=[]
          while i < len(lines):
              line=lines[i]
              if line.startswith('      - name:'): break
              if line.startswith('          '): out.append(line[10:])
              elif not line.strip(): out.append('')
              else: raise SystemExit('SKYCHROMA1B unexpected 1P indentation: '+line)
              i += 1
          script='\n'.join(out)+'\n'
          if 'apply-m9cam-basishsm1p-nativesource1a.py' not in script:
              raise SystemExit('SKYCHROMA1B extracted chain lacks 1P')
          Path('/tmp/m9_apply_1p.sh').write_text(script)
          PY
          bash /tmp/m9_apply_1p.sh

          SKIN_BRANCH=m9nohdr1a-sourcecal2a-basishsm1p-skinluma1a-hsmvalueprobe1a
          git fetch --depth 1 origin "$SKIN_BRANCH"
          TMP=/tmp/skinluma_scaffold
          rm -rf "$TMP" && mkdir -p "$TMP"
          for f in \
            patches/apply-m9cam-basishsm1p-skinluma1a-hsmvalueprobe1a.py \
            patches/verify-m9cam-basishsm1p-skinluma1a-hsmvalueprobe1a.py \
            patches/skinluma1a_payload_01a.txt \
            patches/skinluma1a_payload_01b1.txt \
            patches/skinluma1a_payload_01b2.txt \
            patches/skinluma1a_payload_01c1.txt \
            patches/skinluma1a_payload_01c2.txt \
            patches/skinluma1a_payload_02.txt \
            patches/skinluma1a_payload_03.txt \
            patches/skinluma1a_payload_04.txt; do
              git show FETCH_HEAD:"$f" > "$TMP/$(basename "$f")"
          done
          python3 "$TMP/apply-m9cam-basishsm1p-skinluma1a-hsmvalueprobe1a.py" "$ROOT"
          python3 "$TMP/verify-m9cam-basishsm1p-skinluma1a-hsmvalueprobe1a.py" "$ROOT"
          python3 patches/apply-m9cam-basishsm1p-skychroma1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-skychroma1a.py "$ROOT"
          python3 patches/apply-m9cam-basishsm1p-skychroma1b.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-skychroma1b.py "$ROOT"

      - name: Snapshot assembled SKYCHROMA1B source
        run: |
          set -euo pipefail
          mkdir -p assembled-skychroma1b
          cp PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java assembled-skychroma1b/
          cp PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java assembled-skychroma1b/
          cp PhotonCamera/app/src/main/cpp/m9color_jni.cpp assembled-skychroma1b/
          cp PhotonCamera/app/build.gradle assembled-skychroma1b/app-build.gradle
          sha256sum assembled-skychroma1b/* | tee assembled-skychroma1b/SHA256SUMS.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build debug APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/BASISHSM1P_SKYCHROMA1B_GRADLE.log"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-BASISHSM1P-SKYCHROMA1B-BUILDLOG
          path: BASISHSM1P_SKYCHROMA1B_GRADLE.log
          if-no-files-found: ignore

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-BASISHSM1P-SKYCHROMA1B-ASSEMBLED-SOURCE
          path: assembled-skychroma1b/
          if-no-files-found: ignore

      - name: Upload APK and upstream commit
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-BASISHSM1P-SKYCHROMA1B
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            PHOTON_UPSTREAM_COMMIT.txt
          if-no-files-found: error
