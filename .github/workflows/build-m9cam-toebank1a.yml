name: Build M9Cam TOEBANK1A

on:
  workflow_dispatch:
  push:
    branches: [research/m9toebank1a]
    paths:
      - '.github/workflows/build-m9cam-toebank1a.yml'
      - '.github/workflows/build-m9cam-tonebank1a.yml'
      - 'patches/apply-m9cam-m9toebank1a.py'
      - 'patches/verify-m9cam-m9toebank1a.py'
      - 'patches/apply-m9cam-m9toneauth1a.py'
      - 'patches/apply-m9cam-tonebank1a-targetdirectfix.py'
      - 'patches/verify-m9cam-tonebank1a-targetdirectfix.py'
      - 'patches/apply-m9cam-fullsourcenorm1a.py'
      - 'patches/verify-m9cam-fullsourcenorm1a.py'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify TOEBANK patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-m9toebank1a.py
          python3 -m py_compile patches/verify-m9cam-m9toebank1a.py

      - name: Replay exact TONEBANK1A assembled parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-tonebank1a.yml')
          lines = wf.read_text().splitlines()
          names = [
              'Verify experiment patch syntax',
              'Replay exact FULLSOURCENORM1A assembled parent',
              'Freeze source and target assets before tone bank',
              'Apply same-RAW TC20 authority bank',
              'Verify experiment contract',
          ]
          for idx, name in enumerate(names):
              target = '      - name: ' + name
              if target not in lines:
                  raise SystemExit('TONEBANK1A parent step missing: ' + name)
              i = lines.index(target)
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit('TONEBANK1A parent run block missing: ' + name)
              i += 1
              out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif not line.strip():
                      out.append('')
                  else:
                      raise SystemExit('unexpected parent indentation: ' + line)
                  i += 1
              Path(f'/tmp/toebank1a_parent_{idx:02d}.sh').write_text('\n'.join(out) + '\n')
          PY
          for script in /tmp/toebank1a_parent_*.sh; do
            echo "=== replay $script ==="
            bash "$script"
          done

      - name: Freeze source and target assets before toe isolation
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > TOEBANK1A_FROZEN_BEFORE.sha256

      - name: Apply bounded lower-tone bank
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-m9toebank1a.py "$ROOT" | tee TOEBANK1A_METHOD.txt
          python3 patches/verify-m9cam-m9toebank1a.py "$ROOT" | tee TOEBANK1A_VERIFY.txt

      - name: Verify toe isolation contract
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          R="$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          grep -F 'M9TOEBANK1A_sameRAW_control_mild_moderate' "$R"
          grep -F '_M9_TOE1A_A_CONTROL' "$R"
          grep -F '_M9_TOE1A_B_MILD20' "$R"
          grep -F '_M9_TOE1A_C_MODERATE40' "$R"
          grep -F 'double[] toeStrength1AFlags = {0.0, 0.20, 0.40};' "$R"
          grep -F 'variantFixedGain = skyChromaControlEffectiveRenderGain;' "$R"
          grep -F 'm9cam.toe.v1a.global_bt601_bounded' "$R"
          grep -F 'm9cam.tonebound.v1a.050ev' "$R"
          grep -F '_M9_SOURCEFULLNORM1A_GAINLOCK.jpg' "$R"
          grep -F 'SAT2_M04_M05' "$R"
          grep -F 'curve02' "$R"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > TOEBANK1A_FROZEN_AFTER.sha256
          diff -u TOEBANK1A_FROZEN_BEFORE.sha256 TOEBANK1A_FROZEN_AFTER.sha256
          cat > TOEBANK1A_CONTRACT.txt <<'EOF'
          M9TOEBANK1A
          Parent: successful TONEBANK1A / FULLSOURCENORM1A / TARGETDIRECT1A / M9SENSORTARGET1A / TONEBOUND050.
          Primary JPEG remains unchanged.
          Existing FULLSOURCENORM1A gain-locked secondary remains available.
          A = current bounded-TC20 self-meter control.
          B = exact A final-linear-gain lock + mild global toe strength 0.20.
          C = exact A final-linear-gain lock + moderate global toe strength 0.40.
          Toe acts only on finished-output BT.601-Q14 luma 1..63.
          Y=0 remains exact black; Y>=64 is exact identity before JPEG encoding.
          RGB channels receive one common scale factor; no independent channel curve.
          Scale is bounded before any channel would clip.
          Capture exposure unchanged.
          TC20/TONEBOUND050 control decision unchanged.
          Source calibration unchanged.
          M9 sensor target unchanged.
          Identity HSM unchanged.
          SAT2 M04/M05 unchanged.
          curve02 unchanged.
          BT.601/TG1 unchanged.
          No local masks, semantic scene recognition, HDR, falloff change, or global EV offset.
          This is a diagnostic output-domain toe probe, not yet a claimed final M9 firmware stage.
          EOF

      - name: Snapshot assembled source
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/assembled-toebank1a"
          mkdir -p "$OUT"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" "$OUT/"
          cp TOEBANK1A_METHOD.txt TOEBANK1A_VERIFY.txt TOEBANK1A_CONTRACT.txt "$OUT/"
          cp TOEBANK1A_FROZEN_BEFORE.sha256 TOEBANK1A_FROZEN_AFTER.sha256 "$OUT/"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate runner Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk "${ANDROID_HOME:-/nonexistent}" "${ANDROID_SDK_ROOT:-/nonexistent}" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then echo 'No usable sdkmanager found' >&2; exit 1; fi
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build TOEBANK1A APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/TOEBANK1A_GRADLE.log"

      - name: Verify packaged experiment markers
        if: success()
        run: |
          set -euo pipefail
          APK="$(find PhotonCamera/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          rm -rf /tmp/toebank1a-apk
          mkdir -p /tmp/toebank1a-apk
          unzip -q "$APK" -d /tmp/toebank1a-apk
          python3 - <<'PY' | tee TOEBANK1A_APK_PROOF.txt
          from pathlib import Path
          root=Path('/tmp/toebank1a-apk')
          dex=b''.join(p.read_bytes() for p in sorted(root.glob('classes*.dex')))
          markers=[
              b'FULLSOURCENORM1A',
              b'_M9_SOURCEFULLNORM1A_GAINLOCK.jpg',
              b'M9TOEBANK1A_sameRAW_control_mild_moderate',
              b'_M9_TOE1A_A_CONTROL',
              b'_M9_TOE1A_B_MILD20',
              b'_M9_TOE1A_C_MODERATE40',
              b'm9cam.toe.v1a.global_bt601_bounded',
              b'm9cam.tonebound.v1a.050ev',
              b'SAT2_M04_M05',
          ]
          for marker in markers:
              ok=marker in dex
              print(marker.decode('ascii'), ok)
              if not ok:
                  raise SystemExit('missing APK marker '+marker.decode('ascii'))
          print('M9TOEBANK1A APK PROOF PASS')
          PY

      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee TOEBANK1A_APK_SHA256.txt

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-TOEBANK1A-ASSEMBLED-SOURCE
          path: assembled-toebank1a/
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-TOEBANK1A-BUILDLOG
          path: TOEBANK1A_GRADLE.log
          if-no-files-found: ignore

      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-TOEBANK1A-CONTROL-MILD20-MODERATE40
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            TOEBANK1A_APK_SHA256.txt
            TOEBANK1A_APK_PROOF.txt
            TOEBANK1A_CONTRACT.txt
            TOEBANK1A_VERIFY.txt
