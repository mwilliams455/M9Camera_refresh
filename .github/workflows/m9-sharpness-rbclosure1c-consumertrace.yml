name: M9 Sharpness RBCLOSURE1C Consumer Trace

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1a-forensics]
    paths:
      - '.github/workflows/m9-sharpness-rbclosure1c-consumertrace.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"

      - name: Recover canonical M9 BF561 image
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rbclosure1c"
          mkdir -p "$ROOT/evidence"
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$ROOT/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$ROOT/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/recovery_meta.json"
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$ROOT/m9.dec" | sha256sum -c --strict
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rbclosure1c'
          d=json.load(open(root/'pass/report.json'))
          cand=[]
          for i,x in enumerate(d.get('bf561_deep',[])):
              det=x.get('detail',{}) if isinstance(x.get('detail'),dict) else {}
              t=det.get('targets',{}) if isinstance(det,dict) else {}
              score=sum(k in t for k in ('Run','Process_Sharpness','Process_Noise','Process_WB'))
              if x.get('covered',0)>0 and 'error' not in det: cand.append((score,x.get('covered',0),i))
          if not cand: raise SystemExit('no coherent BF561 pair')
          cand.sort(reverse=True); pair=cand[0][2]
          pdir=root/'pass'/f'bf561_pair_{pair:02d}'
          shutil.copy2(next(pdir.rglob('bf0.bin')), root/'bf0.bin')
          shutil.copy2(next(pdir.rglob('bf0.map')), root/'bf0.map')
          (root/'evidence'/'selected_pair.json').write_text(json.dumps({'pair':pair},indent=2)+'\n')
          PY

      - name: Parse map and extract consumer functions
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rbclosure1c"
          python3 - <<'PY'
          import os,pathlib,json,hashlib,subprocess
          from tools.m9_sharpnessforensics1a import parse_map,parse_ldr,read_overlay,long_branches
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rbclosure1c'
          syms=sorted(parse_map(root/'bf0.map'),key=lambda x:(x['addr'],x['mapoff']))
          _,blocks=parse_ldr(root/'bf0.bin')
          exact={}
          for s in syms: exact.setdefault(s['addr'],[]).append(s['name'])
          wanted=[
            'Run','ASMRedBlueInterpolation1','ASMRedBlueAndGreenDiffer',
            'GreenInterpolationWithCo','Process_WB','Process_Sharpness',
            'ExecuteColorMatrix_14FM1','ASMExecuteColorMatrix_10',
            'Process_DualOutputCorrec','CorrectionDualOutput',
            'L3L1_Put16BitRGB','L3L1_Put3rgb','L3L1_Put16Bit',
            'Process_FPGA_YCrCb','L3L1_Put3yycrcb'
          ]
          out=root/'evidence'/'functions'; out.mkdir(parents=True,exist_ok=True)
          entries=[]
          for name in wanted:
            for idx,s in enumerate([x for x in syms if x['name']==name]):
              size=int(s['size']) if int(s['size'])>0 else 0x1000
              code=read_overlay(blocks,s['addr'],size)
              calls=long_branches(code,s['addr'])
              for c in calls: c['target_names']=exact.get(c['target'],[])
              stem=f"{name}_{idx:02d}_{s['addr']:08x}"
              fn=out/(stem+'.bin'); fn.write_bytes(code)
              entries.append({'name':name,'index':idx,'address':f"0x{s['addr']:08x}",'size':int(s['size']),'extracted_size':size,'calls':calls,'file':fn.name})
          (root/'evidence'/'consumer_manifest.json').write_text(json.dumps(entries,indent=2,sort_keys=True)+'\n')
          # Full parsed symbol table for nearby consumers; no binary bytes.
          keep=[]
          for s in syms:
            n=s['name'].lower()
            if any(k in n for k in ('red','blue','green','rgb','color','colour','matrix','interpol','wb','white','sharp','dng','output','put3','put16')):
              keep.append({'name':s['name'],'address':f"0x{s['addr']:08x}",'size':int(s['size'])})
          (root/'evidence'/'parsed_colour_symbols.json').write_text(json.dumps(keep,indent=2,sort_keys=True)+'\n')
          PY

      - name: Disassemble consumer functions
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rbclosure1c"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rbclosure1c'
          man=json.load(open(root/'evidence/consumer_manifest.json'))
          out=root/'evidence'/'disassembly'; out.mkdir(parents=True,exist_ok=True)
          for e in man:
            src=root/'evidence/functions'/e['file']
            dst=out/(src.stem+'.gnu.dis.txt')
            r=subprocess.run([os.environ['OBJDUMP'],'-D','-b','binary','-m','bfin',f"--adjust-vma={e['address']}",str(src)],capture_output=True,text=True,check=True)
            dst.write_text(r.stdout)
          PY

      - name: Build Run call-chain and frame-field evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rbclosure1c"
          python3 - <<'PY'
          import os,pathlib,re,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rbclosure1c'
          d=root/'evidence'/'disassembly'
          # Preserve textual bodies for Run + channel consumers for human ABI tracing.
          names=('Run_','ASMRedBlueInterpolation1_','ExecuteColorMatrix_14FM1_','ASMExecuteColorMatrix_10_','Process_WB_','L3L1_Put16BitRGB_','L3L1_Put3rgb_','Process_DualOutputCorrec_','CorrectionDualOutput_')
          picks=[]
          for p in sorted(d.glob('*.gnu.dis.txt')):
            if p.name.startswith(names): picks.append((p.name,p.read_text(errors='replace')))
          with (root/'evidence'/'consumer_disassembly.txt').open('w') as f:
            for n,t in picks: f.write('\n===== '+n+' =====\n'+t+'\n')
          # Machine-readable pointer/frame-field lines and calls from Run.
          report={}
          for n,t in picks:
            rows=[]
            for ln in t.splitlines():
              if re.search(r'CALL|JUMP|\[P[0-5]\s*[+-]|\[P[0-5]\+\+|\[SP|R[0-7]\s*=\s*\[|\[P[0-5].*\]\s*=\s*R',ln): rows.append(ln.strip())
            report[n]=rows
          (root/'evidence'/'consumer_access_trace.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          sha256sum "$ROOT/evidence"/*.json "$ROOT/evidence"/*.txt | tee "$ROOT/evidence/SHA256SUMS.txt"

      - name: Publish RBCLOSURE1C evidence
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-RBCLOSURE1C-CONSUMERTRACE
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/rbclosure1c/evidence/*.json
            ${{ runner.temp }}/rbclosure1c/evidence/*.txt

      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/rbclosure1c/pass" "$RUNNER_TEMP/rbclosure1c/m9.upd" "$RUNNER_TEMP/rbclosure1c/mm.upm" "$RUNNER_TEMP/rbclosure1c/m9.dec" "$RUNNER_TEMP/rbclosure1c/bf0.bin" "$RUNNER_TEMP/rbclosure1c/bf0.map" "$RUNNER_TEMP/rbclosure1c/evidence/functions" "$RUNNER_TEMP/rbclosure1c/evidence/disassembly"
