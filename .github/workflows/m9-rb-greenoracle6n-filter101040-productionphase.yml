name: M9 R/B GREENORACLE6N Filter101040 Production Phase

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-greenoracle6n-filter101040-productionphase.yml'
      - 'research/bfin/filter101040_productionphase_oracle.s'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Blackfin toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          curl --fail --location --retry 4 --retry-all-errors -o gdb-17.2.tar.xz https://ftp.gnu.org/gnu/gdb/gdb-17.2.tar.xz
          tar -xf binutils-2.44.tar.xz; tar -xf gdb-17.2.tar.xz
          mkdir binutils-build && cd binutils-build
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-sim >/dev/null
          make -j2 all-binutils all-gas all-ld >/dev/null
          echo "BFIN_AS=$PWD/gas/as-new" >> "$GITHUB_ENV"
          echo "BFIN_LD=$PWD/ld/ld-new" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"; mkdir gdb-build && cd gdb-build
          ../gdb-17.2/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gdbserver >/dev/null
          make -j2 all-sim >/dev/null
          SIM=$(find "$PWD" -type f \( -path '*/sim/bfin/run' -o -name 'bfin-elf-run' \) -perm -111 | head -1 || true)
          test -n "$SIM"; echo "BFIN_SIM=$SIM" >> "$GITHUB_ENV"

      - name: Recover exact Leica Filter101040 body
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/green6n"; mkdir -p "$ROOT/evidence"
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json" >/dev/null
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass" >/dev/null
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'green6n'; report=json.load(open(root/'pass/report.json'))
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py'); m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          addr,size,sha=0xffa000be,400,'c09c342ca374a32eb08b86b8136c27af403ccad5eba57aa25aee6c0526e30389'
          body=None; pair=None
          for i,_ in enumerate(report.get('bf561_deep',[])):
            try:
              bf0=next((root/'pass'/f'bf561_pair_{i:02d}').rglob('bf0.bin')); _,blocks=m.parse_ldr(bf0); b=m.read_overlay(blocks,addr,size)
              if len(b)==size and hashlib.sha256(b).hexdigest()==sha: body=b; pair=i; break
            except Exception: pass
          if body is None: raise SystemExit('canonical Filter101040 body not found')
          (root/'ASMFilter_101_040_101_An.bin').write_bytes(body)
          (root/'evidence'/'body.json').write_text(json.dumps({'pair':pair,'address':hex(addr),'size':size,'sha256':sha},indent=2)+'\n')
          PY

      - name: Run production-phase whole-window write oracle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/green6n"
          cp research/bfin/filter101040_productionphase_oracle.s "$ROOT/"
          cat > "$ROOT/oracle.ld" <<'LDS'
          ENTRY(_start)
          SECTIONS {
            . = 0x4000; .source : { *(.source) }
            . = 0x7000; .out1 : { *(.out1) }
            . = 0x8000; .out2 : { *(.out2) }
            . = 0xa000; .stack : { *(.stack) }
            . = 0x10000; .filter : { *(.filter) }
            . = 0x20000; .text : { *(.text.start) }
          }
          LDS
          cd "$ROOT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,random,re,subprocess
          ev=pathlib.Path('evidence')
          # These reproduce the second 101040 call's geometry/phase in the three
          # GREENORACLE6L production cases.  For the first two, all three pointers
          # are mod4==2; the phase_initial=1 case is the aligned control.
          cases=[
            ('s16_h12_q0',8,5,16,0x4402,0x7202,0x8202),
            ('s18_h14_q0',8,6,18,0x4402,0x7202,0x8202),
            ('s20_h16_q1',8,6,20,0x4400,0x7200,0x8200),
            ('mixed_src2_out0',8,5,16,0x4402,0x7200,0x8200),
          ]
          report={'schema':'m9.greenoracle6n.filter101040-production-phase.v1',
                  'routine_sha256':'c09c342ca374a32eb08b86b8136c27af403ccad5eba57aa25aee6c0526e30389',
                  'cases':{}}
          for ci,(name,inner,outer,stride,srcbase,out1base,out2base) in enumerate(cases):
            seed=0x6e000000+ci*0x10000+stride*0x100+outer
            rng=random.Random(seed)
            src=[rng.randrange(65536) for _ in range(4096)]
            pathlib.Path('source_data.inc').write_text(''.join(f'.short 0x{x:04x}\n' for x in src))
            subprocess.run([os.environ['BFIN_AS'],
                            '--defsym',f'INNER={inner}','--defsym',f'OUTER={outer}','--defsym',f'STRIDE={stride}',
                            '--defsym',f'SRCBASE={srcbase}','--defsym',f'OUT1BASE={out1base}','--defsym',f'OUT2BASE={out2base}',
                            'filter101040_productionphase_oracle.s','-o',name+'.o'],check=True)
            subprocess.run([os.environ['BFIN_LD'],'-T','oracle.ld',name+'.o','-o',name+'.elf'],check=True)
            sim=subprocess.run([os.environ['BFIN_SIM'],name+'.elf'],capture_output=True,text=True)
            if sim.returncode: raise SystemExit(f'{name}: simulator rc={sim.returncode}: {sim.stderr[-1000:]}')
            words=[int(x,16) for x in re.findall(r'DBG\s*:\s*R0\s*=\s*0x([0-9a-fA-F]+)',sim.stdout)]
            if len(words)!=512: raise SystemExit(f'{name}: expected 512 dwords, got {len(words)}')
            def hw(ws):
              out=[]
              for q in ws: out.extend([q&0xffff,(q>>16)&0xffff])
              return out
            out1=hw(words[:256]); out2=hw(words[256:])
            f1={(out1base-0x7000)//2 + 2*c + 2*stride*r for r in range(outer) for c in range(inner)}
            f2={(out2base-0x8000)//2 + 2*c + 2*stride*r for r in range(outer) for c in range(inner)}
            ch1=[i for i,v in enumerate(out1) if v!=0x1357]
            ch2=[i for i,v in enumerate(out2) if v!=0x2468]
            ex1=[i for i in ch1 if i not in f1]
            ex2=[i for i in ch2 if i not in f2]
            miss1=[i for i in sorted(f1) if out1[i]==0x1357]
            miss2=[i for i in sorted(f2) if out2[i]==0x2468]
            report['cases'][name]={
              'seed':seed,'inner':inner,'outer':outer,'stride':stride,
              'srcbase':hex(srcbase),'out1base':hex(out1base),'out2base':hex(out2base),
              'pointer_mod4':[srcbase&3,out1base&3,out2base&3],
              'formal_out1':sorted(f1),'formal_out2':sorted(f2),
              'changed_out1':ch1,'changed_out2':ch2,
              'extra_out1':ex1,'extra_out2':ex2,
              'formal_sentinel_collisions_out1':miss1,'formal_sentinel_collisions_out2':miss2,
              'out1_sha256':hashlib.sha256(b''.join(v.to_bytes(2,'little') for v in out1)).hexdigest(),
              'out2_sha256':hashlib.sha256(b''.join(v.to_bytes(2,'little') for v in out2)).hexdigest(),
            }
          raw=(json.dumps(report,indent=2)+'\n').encode()
          (ev/'production_phase_writes.json').write_bytes(raw)
          (ev/'production_phase_writes.sha256.txt').write_text(hashlib.sha256(raw).hexdigest()+'  production_phase_writes.json\n')
          summary={k:{'pointer_mod4':v['pointer_mod4'],'extra_out1':v['extra_out1'],'extra_out2':v['extra_out2']} for k,v in report['cases'].items()}
          (ev/'production_phase_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          sha256sum "$ROOT/evidence"/* > "$ROOT/evidence/SHA256SUMS.txt"

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-GREENORACLE6N-FILTER101040-PRODUCTION-PHASE
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/green6n/evidence/*

      - name: Remove firmware and executable material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/green6n/pass" "$RUNNER_TEMP/green6n/m9.upd" "$RUNNER_TEMP/green6n/mm.upm" "$RUNNER_TEMP/green6n/m9.dec"
          rm -f "$RUNNER_TEMP/green6n"/*.bin "$RUNNER_TEMP/green6n"/*.o "$RUNNER_TEMP/green6n"/*.elf "$RUNNER_TEMP/green6n"/*.inc
