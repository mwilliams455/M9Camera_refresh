name: Build M9Cam M9LIVEPREVIEW1A Full Render 720p

on:
  workflow_dispatch:
  push:
    branches: [research/m9livepreview1a-fullrender720p]
    paths:
      - 'patches/apply-m9cam-m9livepreview1a-fullrender720p.py'
      - 'patches/verify-m9cam-m9livepreview1a-fullrender720p.py'
      - '.github/workflows/build-m9cam-m9livepreview1a-fullrender720p.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify experiment patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-m9livepreview1a-fullrender720p.py
          python3 -m py_compile patches/verify-m9cam-m9livepreview1a-fullrender720p.py
          python3 -m py_compile patches/apply-m9cam-m9sensortarget1a.py
          python3 -m py_compile patches/verify-m9cam-m9sensortarget1a.py

      - name: Replay exact M9SENSORTARGET1A assembled baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-m9sensortarget1a.yml')
          lines = wf.read_text().splitlines()
          name = 'Replay exact TARGETDIRECT1A assembled baseline'
          target = '      - name: ' + name
          if target not in lines:
              raise SystemExit('M9SENSORTARGET1A replay step missing')
          i = lines.index(target)
          while i < len(lines) and lines[i].strip() != 'run: |':
              i += 1
          if i >= len(lines):
              raise SystemExit('M9SENSORTARGET1A replay run block missing')
          i += 1
          out = []
          while i < len(lines):
              line = lines[i]
              if line.startswith('      - name:') or line.startswith('      - uses:'):
                  break
              if line.startswith('          '): out.append(line[10:])
              elif not line.strip(): out.append('')
              else: raise SystemExit('unexpected parent indentation: ' + line)
              i += 1
          Path('/tmp/m9livepreview_parent.sh').write_text('\n'.join(out) + '\n')
          PY
          bash /tmp/m9livepreview_parent.sh
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-m9sensortarget1a.py "$ROOT"
          python3 patches/verify-m9cam-m9sensortarget1a.py "$ROOT" | tee M9SENSORTARGET1A_VERIFY.txt

      - name: Freeze photographic core before live preview patch
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java')
          s=p.read_text()
          def method(sig):
              start=s.find(sig)
              if start < 0: raise SystemExit('method missing: '+sig)
              brace=s.find('{',start); depth=0; state='code'; quote=''; esc=False; i=brace
              while i < len(s):
                  ch=s[i]; nxt=s[i+1] if i+1<len(s) else ''
                  if state=='line':
                      if ch=='\n': state='code'
                  elif state=='block':
                      if ch=='*' and nxt=='/': state='code'; i+=1
                  elif state=='string':
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: state='code'
                  else:
                      if ch=='/' and nxt=='/': state='line'; i+=1
                      elif ch=='/' and nxt=='*': state='block'; i+=1
                      elif ch in ('"',"'"): state='string'; quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0: return s[start:i+1].encode()
                  i+=1
              raise SystemExit('unterminated '+sig)
          sigs=['private static RenderCore renderNativeSourceProduction1P(',
                'private static RenderCore renderNativeProspectiveCore(']
          with open('M9LIVEPREVIEW1A_CORE_BEFORE.sha256','w') as f:
              for sig in sigs: f.write(hashlib.sha256(method(sig)).hexdigest()+'  '+sig+'\n')
          PY
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > M9LIVEPREVIEW1A_ASSETS_BEFORE.sha256

      - name: Apply full-render 720p live preview
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-m9livepreview1a-fullrender720p.py "$ROOT"
          python3 patches/verify-m9cam-m9livepreview1a-fullrender720p.py "$ROOT" | tee M9LIVEPREVIEW1A_VERIFY.txt

      - name: Prove production photographic core unchanged
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java')
          s=p.read_text()
          def method(sig):
              start=s.find(sig)
              if start < 0: raise SystemExit('method missing: '+sig)
              brace=s.find('{',start); depth=0; state='code'; quote=''; esc=False; i=brace
              while i < len(s):
                  ch=s[i]; nxt=s[i+1] if i+1<len(s) else ''
                  if state=='line':
                      if ch=='\n': state='code'
                  elif state=='block':
                      if ch=='*' and nxt=='/': state='code'; i+=1
                  elif state=='string':
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: state='code'
                  else:
                      if ch=='/' and nxt=='/': state='line'; i+=1
                      elif ch=='/' and nxt=='*': state='block'; i+=1
                      elif ch in ('"',"'"): state='string'; quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0: return s[start:i+1].encode()
                  i+=1
              raise SystemExit('unterminated '+sig)
          sigs=['private static RenderCore renderNativeSourceProduction1P(',
                'private static RenderCore renderNativeProspectiveCore(']
          with open('M9LIVEPREVIEW1A_CORE_AFTER.sha256','w') as f:
              for sig in sigs: f.write(hashlib.sha256(method(sig)).hexdigest()+'  '+sig+'\n')
          PY
          diff -u M9LIVEPREVIEW1A_CORE_BEFORE.sha256 M9LIVEPREVIEW1A_CORE_AFTER.sha256
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > M9LIVEPREVIEW1A_ASSETS_AFTER.sha256
          diff -u M9LIVEPREVIEW1A_ASSETS_BEFORE.sha256 M9LIVEPREVIEW1A_ASSETS_AFTER.sha256

      - name: Snapshot assembled preview source
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/assembled-m9livepreview1a"
          mkdir -p "$OUT"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/preview/M9LivePreview1A.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/capture/CaptureController.java" "$OUT/"
          cp M9LIVEPREVIEW1A_VERIFY.txt M9SENSORTARGET1A_VERIFY.txt "$OUT/"
          cp M9LIVEPREVIEW1A_CORE_BEFORE.sha256 M9LIVEPREVIEW1A_CORE_AFTER.sha256 "$OUT/"
          cp M9LIVEPREVIEW1A_ASSETS_BEFORE.sha256 M9LIVEPREVIEW1A_ASSETS_AFTER.sha256 "$OUT/"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate runner Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk "${ANDROID_HOME:-/nonexistent}" "${ANDROID_SDK_ROOT:-/nonexistent}" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then echo 'No usable sdkmanager found' >&2; exit 1; fi
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build M9LIVEPREVIEW1A APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/M9LIVEPREVIEW1A_GRADLE.log"

      - name: Verify packaged live-preview candidate
        if: success()
        run: |
          set -euo pipefail
          APK="$(find PhotonCamera/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          rm -rf /tmp/m9livepreview-apk
          mkdir -p /tmp/m9livepreview-apk
          unzip -q "$APK" -d /tmp/m9livepreview-apk
          python3 - <<'PY' | tee M9LIVEPREVIEW1A_APK_PROOF.txt
          from pathlib import Path
          import hashlib, struct
          root=Path('/tmp/m9livepreview-apk')
          curve=root/'assets/m9/m9_curve02_firmware.bin'
          native=root/'lib/arm64-v8a/libm9color.so'
          if not curve.exists() or not native.exists(): raise SystemExit('M9 target assets missing')
          ch=hashlib.sha256(curve.read_bytes()).hexdigest()
          print('CURVE02_SHA256', ch)
          if ch != '5b303ff7d9d47ecb8e193a648ddf0570fef46ad29a62d112993d37d52f8c135c': raise SystemExit(1)
          b=native.read_bytes()
          sat2=[13659,-4457,-1004,-2244,13469,-3033,-199,-6014,14398,
                14811,-5604,-1004,-2455,13688,-3033,393,-6588,14398]
          if b''.join(struct.pack('<q',x) for x in sat2[:9]) not in b: raise SystemExit('SAT2 M04 missing')
          if b''.join(struct.pack('<q',x) for x in sat2[9:]) not in b: raise SystemExit('SAT2 M05 missing')
          dex=b''.join(p.read_bytes() for p in sorted(root.glob('classes*.dex')))
          markers=[b'M9LIVEPREVIEW1A_FULLRENDER720P',
                   b'FULL_PRODUCTION_RENDER_REDUCED_RAW_960x720',
                   b'M9SENSORTARGET1A', b'm9SensorTarget1ARuntimeVerified']
          for marker in markers:
              ok=marker in dex
              print(marker.decode('ascii'), ok)
              if not ok: raise SystemExit('missing marker '+marker.decode('ascii'))
          print('M9LIVEPREVIEW1A APK PROOF PASS')
          PY

      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee M9LIVEPREVIEW1A_APK_SHA256.txt

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-M9LIVEPREVIEW1A-FULLRENDER720P-ASSEMBLED-SOURCE
          path: assembled-m9livepreview1a/
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-M9LIVEPREVIEW1A-FULLRENDER720P-BUILDLOG
          path: M9LIVEPREVIEW1A_GRADLE.log
          if-no-files-found: ignore

      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-M9LIVEPREVIEW1A-FULLRENDER720P
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            M9LIVEPREVIEW1A_APK_SHA256.txt
            M9LIVEPREVIEW1A_VERIFY.txt
            M9LIVEPREVIEW1A_APK_PROOF.txt
            M9LIVEPREVIEW1A_CORE_BEFORE.sha256
            M9LIVEPREVIEW1A_CORE_AFTER.sha256
            M9LIVEPREVIEW1A_ASSETS_BEFORE.sha256
            M9LIVEPREVIEW1A_ASSETS_AFTER.sha256
