name: M9 Sharpness Contrast Placement

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpnessforensics1a
    paths:
      - '.github/workflows/m9-sharpness-contrast-placement.yml'
      - 'tools/recover_m9_key_from_shared_body.py'
      - 'tools/m9_sharpnessforensics1a_firmwarepass.py'
      - 'tools/m9_sharpnessforensics1a.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install or build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"
      - name: Download verify decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9sharp"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$RUNNER_TEMP/m9sharp/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$RUNNER_TEMP/m9sharp/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" --m9-out "$RUNNER_TEMP/m9sharp/m9.dec" --meta-out "$RUNNER_TEMP/m9sharp/recovery_meta.json"
      - name: Extract contrast/Y functions and all Run variants
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$RUNNER_TEMP/m9sharp/m9.dec" --out "$RUNNER_TEMP/m9sharp/pass"
          python3 - <<'PY'
          import json,os,pathlib,importlib.util,sys,hashlib
          rt=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp'; d=json.load(open(rt/'pass/report.json'))
          cand=[]
          for i,x in enumerate(d.get('bf561_deep',[])):
              t=x.get('detail',{}).get('targets',{}) if isinstance(x.get('detail'),dict) else {}
              cand.append((sum(k in t for k in ('Run','Process_Sharpness','Process_WB','Process_Noise')),x.get('covered',0),i))
          cand.sort(reverse=True); pair=cand[0][2]
          root=rt/'pass'/f'bf561_pair_{pair:02d}'
          spec=importlib.util.spec_from_file_location('base',pathlib.Path('tools/m9_sharpnessforensics1a.py'))
          m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          syms=m.parse_map(root/'bf0.map');_,blocks=m.parse_ldr(root/'bf0.bin')
          out=rt/'evidence';out.mkdir(exist_ok=True)
          names=('Run','Process_Contrast','ExecuteContrast_11LUT8_7','ExecuteContrast_11LUT8_2','ExecuteContrast_11LUT8_3','Process_FPGA_YCrCb','Process_FPGA_Y','Process_Y','Process_DualOutputCorrec','CorrectionDualOutput')
          rows=[]
          for name in names:
              for s in [q for q in syms if q['name']==name and q['size']>0]:
                  try: code=m.read_overlay(blocks,s['addr'],s['size'])
                  except Exception as ex:
                      rows.append({'name':name,'addr':hex(s['addr']),'size':s['size'],'error':str(ex)}); continue
                  p=out/f"{name}_{s['addr']:08x}.bin";p.write_bytes(code)
                  rows.append({'name':name,'addr':hex(s['addr']),'size':s['size'],'sha256':hashlib.sha256(code).hexdigest(),'file':p.name})
          (out/'contrast_manifest.json').write_text(json.dumps({'pair':pair,'functions':rows},indent=2)+'\n')
          print(json.dumps({'pair':pair,'functions':rows},indent=2))
          PY
          for f in "$RUNNER_TEMP/m9sharp/evidence"/*.bin; do
            bn=$(basename "$f" .bin); base=$(printf '%s' "$bn" | sed -nE 's/^.*_([0-9a-fA-F]{8})$/\1/p')
            test -n "$base" || continue
            "$OBJDUMP" -D -b binary -m bfin --adjust-vma="0x$base" "$f" > "$RUNNER_TEMP/m9sharp/evidence/${bn}.gnu.dis.txt"
          done
      - name: Analyze contrast call graph and stage-mask clues
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re,json
          e=pathlib.Path(os.environ['RUNNER_TEMP'])/'m9sharp/evidence'
          report={'schema':'m9.sharpness.contrast-placement.v1','files':{}}
          for p in sorted(e.glob('*.gnu.dis.txt')):
              txt=p.read_text(errors='replace')
              calls=[ln for ln in txt.splitlines() if 'CALL ' in ln or 'call ' in ln]
              bits=[ln for ln in txt.splitlines() if 'BITTST' in ln]
              masks=[ln for ln in txt.splitlines() if any(x in ln.lower() for x in ('0x1000','0x17ff','0x1401','0x3407'))]
              report['files'][p.name]={'calls':calls,'bit_tests':bits,'mask_literals':masks,'text':txt}
          (e/'contrast_placement_report.json').write_text(json.dumps(report,indent=2)+'\n')
          with open(e/'contrast_placement_disassembly.txt','w') as f:
              for p in sorted(e.glob('*.gnu.dis.txt')):
                  f.write('\n===== '+p.name+' =====\n'); f.write(p.read_text(errors='replace'))
          PY
      - name: Publish derived text evidence only
        uses: actions/upload-artifact@v4
        with:
          name: M9-SHARPNESS-CONTRAST-PLACEMENT
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/m9sharp/evidence/*.json
            ${{ runner.temp }}/m9sharp/evidence/*.txt
            ${{ runner.temp }}/m9sharp/recovery_meta.json
      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/m9sharp/pass" "$RUNNER_TEMP/m9sharp/evidence"/*.bin "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" "$RUNNER_TEMP/m9sharp/m9.dec"
