name: M9 R/B RBCLOSURE5V SPI Settings Producer

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-spiproducer5v.yml'

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 4 -o b.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          tar -xf b.tar.xz
          mkdir b && cd b
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim >/dev/null
          make -j4 all-binutils >/dev/null
          echo "BFIN_OBJDUMP=$PWD/binutils/objdump" >> "$GITHUB_ENV"

      - name: Recover selected BF561 image
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rb5v"
          mkdir -p "$ROOT/evidence" "$ROOT/blocks" "$ROOT/dis"
          curl -fsSL --retry 4 -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl -fsSL --retry 4 -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$ROOT/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$ROOT/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json" >/dev/null
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$ROOT/m9.dec" | sha256sum -c --strict
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass" >/dev/null
          python3 - <<'PY'
          import json,os,pathlib,importlib.util,sys,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb5v'; d=json.load(open(root/'pass/report.json')); cand=[]
          for i,x in enumerate(d.get('bf561_deep',[])):
              det=x.get('detail',{}) if isinstance(x.get('detail'),dict) else {}; t=det.get('targets',{}) if isinstance(det,dict) else {}
              if x.get('covered',0)>0 and 'error' not in det: cand.append((sum(k in t for k in ('Run','Process_Sharpness','Process_Noise','Process_WB')),x.get('covered',0),i))
          cand.sort(reverse=True); pair=cand[0][2]; pdir=root/'pass'/f'bf561_pair_{pair:02d}'; bf0=next(pdir.rglob('bf0.bin')); mp=next(pdir.rglob('bf0.map'))
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py'); m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          _,blocks=m.parse_ldr(bf0); syms=m.parse_map(mp)
          meta=[]
          for i,b in enumerate(blocks):
              bd=bytes(b['data']); (root/'blocks'/f'block_{i:03d}.bin').write_bytes(bd); meta.append({'index':i,'addr':f"0x{int(b['addr']):08x}",'count':int(b['count']),'sha256':hashlib.sha256(bd).hexdigest()})
          (root/'blocks_meta.json').write_text(json.dumps(meta,indent=2)+'\n'); (root/'symbols.json').write_text(json.dumps(syms,indent=2)+'\n')
          print(json.dumps({'selected_pair':pair,'block_count':len(blocks)},indent=2))
          PY
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb5v'; meta=json.load(open(root/'blocks_meta.json'))
          with open(root/'objdump.sh','w') as f:
              f.write('set -euo pipefail\n')
              for x in meta:
                  i=x['index']; f.write(f'"$BFIN_OBJDUMP" -D -b binary -m bfin --adjust-vma={x["addr"]} "$RUNNER_TEMP/rb5v/blocks/block_{i:03d}.bin" > "$RUNNER_TEMP/rb5v/dis/block_{i:03d}.dis"\n')
          PY
          bash "$ROOT/objdump.sh"

      - name: Find code xrefs and pointer-table registrations
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rb5v"
          python3 - <<'PY'
          import os,pathlib,re,json,hashlib,struct
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb5v'; meta=json.load(open(root/'blocks_meta.json')); syms=json.load(open(root/'symbols.json'))
          target=0xffa11862
          rx=re.compile(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+(.+)$',re.I); tr=re.compile(r'0x0?([0-9a-f]{8})',re.I)
          by={}; allins=[]
          for bm in meta:
              i=bm['index']; ins=[]
              for line in (root/'dis'/f'block_{i:03d}.dis').read_text(errors='replace').splitlines():
                  m=rx.match(line)
                  if m: ins.append({'addr':int(m.group(1),16),'asm':m.group(2).strip(),'block':i})
              by[i]=ins; allins.extend(ins)
          def owners(addr):
              out=[]
              for s in syms:
                  try:a=int(s['addr']);z=int(s.get('size',0))
                  except Exception:continue
                  if z>0 and a<=addr<a+z: out.append({'name':s.get('name'),'addr':f'0x{a:08x}','size':z})
              return out
          def nearest(addr):
              arr=[]
              for s in syms:
                  try:a=int(s['addr']);z=int(s.get('size',0))
                  except Exception:continue
                  arr.append((abs(a-addr),a,s.get('name'),z))
              arr.sort(); return [{'name':n,'addr':f'0x{a:08x}','size':z,'distance':d} for d,a,n,z in arr[:8]]
          def ser(xs): return [{'addr':f"0x{x['addr']:08x}",'asm':x['asm'],'block':x['block']} for x in xs]
          code=[]
          for i,ins in by.items():
              for j,x in enumerate(ins):
                  if 'ffa11862' not in x['asm'].lower(): continue
                  mt=tr.search(x['asm']); t=int(mt.group(1),16) if mt else None
                  code.append({'site':f"0x{x['addr']:08x}",'asm':x['asm'],'block':i,'target_exact':t==target,'owners':owners(x['addr']),'context':ser(ins[max(0,j-40):min(len(ins),j+20)])})
          # Raw 32-bit little-endian function-pointer occurrences.
          needle=struct.pack('<I',target); ptrs=[]
          for bm in meta:
              i=bm['index']; data=(root/'blocks'/f'block_{i:03d}.bin').read_bytes(); base=int(bm['addr'],16); start=0
              while True:
                  off=data.find(needle,start)
                  if off<0: break
                  addr=base+off; lo=max(0,off-32); hi=min(len(data),off+36)
                  words=[]
                  for p in range(lo-(lo%4),hi-3,4):
                      words.append({'addr':f'0x{base+p:08x}','u32_le':f'0x{struct.unpack_from("<I",data,p)[0]:08x}'})
                  ptrs.append({'address':f'0x{addr:08x}','block':i,'owners':owners(addr),'nearest_symbols':nearest(addr),'window_hex':data[lo:hi].hex(),'aligned_words':words})
                  start=off+1
          # Find materializations of target into registers (low/high pair), useful for registration code.
          lo_re=re.compile(r'\b([RPI][0-7]?)\.L\s*=\s*0x0?1862\b',re.I); hi_re=re.compile(r'\b([RPI][0-7]?)\.H\s*=\s*0xffa1\b',re.I); mats=[]
          for i,ins in by.items():
              for j,x in enumerate(ins):
                  ml=lo_re.search(x['asm'])
                  if not ml: continue
                  reg=ml.group(1).upper()
                  for k in range(j+1,min(len(ins),j+12)):
                      mh=hi_re.search(ins[k]['asm'])
                      if mh and mh.group(1).upper()==reg:
                          mats.append({'low_site':f"0x{x['addr']:08x}",'high_site':f"0x{ins[k]['addr']:08x}",'register':reg,'owners':owners(x['addr']),'context':ser(ins[max(0,j-40):min(len(ins),k+80)])}); break
          rep={'schema':'m9.rbclosure5v.spi-producer-xrefs.v1','target':'SPI_AppendSettings @ 0xffa11862','code_literal_refs':code,'raw_pointer_occurrences':ptrs,'address_materializations':mats,'goal':'Identify SPI command dispatch/registration entry and upstream producer semantics for settings byte +11.'}
          raw=(json.dumps(rep,indent=2)+'\n').encode(); (root/'evidence'/'spi_producer_xrefs.json').write_bytes(raw)
          with open(root/'evidence'/'spi_producer_xrefs.txt','w') as f:
              f.write(f'CODE REFS: {len(code)}\n'); [f.write(json.dumps(q)+'\n') for q in code]
              f.write(f'\nRAW POINTERS: {len(ptrs)}\n'); [f.write(json.dumps(q)+'\n') for q in ptrs]
              f.write(f'\nADDRESS MATERIALIZATIONS: {len(mats)}\n'); [f.write(json.dumps(q)+'\n') for q in mats]
          (root/'evidence'/'spi_producer_xrefs.sha256.txt').write_text(hashlib.sha256(raw).hexdigest()+'  spi_producer_xrefs.json\n'); print((root/'evidence'/'spi_producer_xrefs.txt').read_text())
          PY
          sha256sum "$ROOT/evidence"/* > "$ROOT/evidence/SHA256SUMS.txt"

      - name: Upload SPI producer evidence
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-RBCLOSURE5V-SPI-PRODUCER-XREFS
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/rb5v/evidence/*

      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/rb5v/pass" "$RUNNER_TEMP/rb5v/m9.upd" "$RUNNER_TEMP/rb5v/mm.upm" "$RUNNER_TEMP/rb5v/m9.dec" "$RUNNER_TEMP/rb5v/blocks" "$RUNNER_TEMP/rb5v/dis" "$RUNNER_TEMP/rb5v/blocks_meta.json" "$RUNNER_TEMP/rb5v/symbols.json" "$RUNNER_TEMP/rb5v/objdump.sh"
