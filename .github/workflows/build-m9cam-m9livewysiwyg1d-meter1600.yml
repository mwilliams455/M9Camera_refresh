name: Build M9Cam LIVEWYSIWYG1D Meter1600

on:
  workflow_dispatch:
  pull_request:
    branches: [research/m9livewysiwyg1c-fullsource]
    paths:
      - 'patches/apply-m9cam-m9livewysiwyg1d-meter1600.py'
      - 'patches/verify-m9cam-m9livewysiwyg1d-meter1600.py'
      - '.github/workflows/build-m9cam-m9livewysiwyg1d-meter1600.yml'
  push:
    branches: [research/m9livewysiwyg1d-meter1600]
    paths:
      - 'patches/apply-m9cam-m9livewysiwyg1d-meter1600.py'
      - 'patches/verify-m9cam-m9livewysiwyg1d-meter1600.py'
      - '.github/workflows/build-m9cam-m9livewysiwyg1d-meter1600.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify LIVEWYSIWYG1D patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-m9livewysiwyg1d-meter1600.py
          python3 -m py_compile patches/verify-m9cam-m9livewysiwyg1d-meter1600.py

      - name: Replay exact LIVEWYSIWYG1C assembled baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-m9livewysiwyg1c-fullsource.yml')
          lines = wf.read_text().splitlines()
          names = [
              'Verify LIVEWYSIWYG1C patch syntax',
              'Replay exact LIVEWYSIWYG1B assembled baseline',
              'Freeze production still core before LIVEWYSIWYG1C',
              'Apply full-source final-boundary WYSIWYG',
              'Prove frozen still core assets and exposure lock unchanged',
          ]
          for idx, name in enumerate(names):
              target = '      - name: ' + name
              if target not in lines:
                  raise SystemExit('LIVEWYSIWYG1C replay block missing: ' + name)
              i = lines.index(target)
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit('LIVEWYSIWYG1C run block missing: ' + name)
              i += 1
              out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif not line.strip():
                      out.append('')
                  else:
                      raise SystemExit('unexpected LIVEWYSIWYG1C indentation: ' + line)
                  i += 1
              Path(f'/tmp/m9livewysiwyg1d_parent_{idx:02d}.sh').write_text(
                  '\n'.join(out) + '\n')
          PY
          for s in /tmp/m9livewysiwyg1d_parent_*.sh; do
            echo "=== replay $s ==="
            bash "$s"
          done

      - name: Freeze still renderer and exact exposure lock before LIVEWYSIWYG1D
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java')
          s = p.read_text()
          def method(sig):
              start = s.find(sig)
              if start < 0: raise SystemExit('method missing: ' + sig)
              brace=s.find('{',start); depth=0; state='code'; quote=''; esc=False; i=brace
              while i < len(s):
                  ch=s[i]; nxt=s[i+1] if i+1<len(s) else ''
                  if state=='line':
                      if ch=='\n': state='code'
                  elif state=='block':
                      if ch=='*' and nxt=='/': state='code'; i+=1
                  elif state=='string':
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: state='code'
                  else:
                      if ch=='/' and nxt=='/': state='line'; i+=1
                      elif ch=='/' and nxt=='*': state='block'; i+=1
                      elif ch in ('"',"'"): state='string'; quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0: return s[start:i+1].encode()
                  i+=1
              raise SystemExit('unterminated '+sig)
          sigs=[
              'private static RenderCore renderNativeSourceProduction1P(',
              'private static RenderCore renderNativeProspectiveCore(',
          ]
          with open('LIVEWYSIWYG1D_CORE_BEFORE.sha256','w') as f:
              for sig in sigs:
                  f.write(hashlib.sha256(method(sig)).hexdigest()+'  '+sig+'\n')
          PY
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9EdgePlacementBestFit2AController.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/capture/CaptureController.java" \
            > LIVEWYSIWYG1D_FROZEN_BEFORE.sha256

      - name: Apply Meter1600 live reference render
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-m9livewysiwyg1d-meter1600.py "$ROOT"
          python3 patches/verify-m9cam-m9livewysiwyg1d-meter1600.py "$ROOT" \
            | tee LIVEWYSIWYG1D_VERIFY.txt

      - name: Prove still renderer and exact exposure lock unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java')
          s = p.read_text()
          def method(sig):
              start=s.find(sig)
              if start<0: raise SystemExit('method missing: '+sig)
              brace=s.find('{',start); depth=0; state='code'; quote=''; esc=False; i=brace
              while i<len(s):
                  ch=s[i]; nxt=s[i+1] if i+1<len(s) else ''
                  if state=='line':
                      if ch=='\n': state='code'
                  elif state=='block':
                      if ch=='*' and nxt=='/': state='code'; i+=1
                  elif state=='string':
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: state='code'
                  else:
                      if ch=='/' and nxt=='/': state='line'; i+=1
                      elif ch=='/' and nxt=='*': state='block'; i+=1
                      elif ch in ('"',"'"): state='string'; quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0: return s[start:i+1].encode()
                  i+=1
              raise SystemExit('unterminated '+sig)
          sigs=[
              'private static RenderCore renderNativeSourceProduction1P(',
              'private static RenderCore renderNativeProspectiveCore(',
          ]
          with open('LIVEWYSIWYG1D_CORE_AFTER.sha256','w') as f:
              for sig in sigs:
                  f.write(hashlib.sha256(method(sig)).hexdigest()+'  '+sig+'\n')
          PY
          diff -u LIVEWYSIWYG1D_CORE_BEFORE.sha256 LIVEWYSIWYG1D_CORE_AFTER.sha256
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9EdgePlacementBestFit2AController.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/capture/CaptureController.java" \
            > LIVEWYSIWYG1D_FROZEN_AFTER.sha256
          diff -u LIVEWYSIWYG1D_FROZEN_BEFORE.sha256 LIVEWYSIWYG1D_FROZEN_AFTER.sha256

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate runner Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then echo 'No usable sdkmanager found' >&2; exit 1; fi
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build LIVEWYSIWYG1D APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/LIVEWYSIWYG1D_GRADLE.log"

      - name: Verify packaged LIVEWYSIWYG1D contract
        if: success()
        run: |
          set -euo pipefail
          APK="$(find PhotonCamera/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          rm -rf /tmp/m9livewysiwyg1d-apk
          mkdir -p /tmp/m9livewysiwyg1d-apk
          unzip -q "$APK" -d /tmp/m9livewysiwyg1d-apk
          python3 - <<'PY' | tee LIVEWYSIWYG1D_APK_PROOF.txt
          from pathlib import Path
          root=Path('/tmp/m9livewysiwyg1d-apk')
          dex=b''.join(p.read_bytes() for p in sorted(root.glob('classes*.dex')))
          required=[
              b'M9LIVEWYSIWYG1D_METER1600_REFERENCE_RENDER',
              b'FULL_PRODUCTION_RENDER_REFERENCE1600_FINAL_BITMAP',
              b'TC20_1600_long_side_reference_spatial_workload_only',
              b'allM9PhotographicStagesAppliedAtReferenceResolution',
              b'M9LIVEWYSIWYG1B_DISPLAYEDCAPTURELOCK',
              b'setExactExposureM9Wysiwyg1B',
              b'ImageView_displayed_M9_frame',
          ]
          for marker in required:
              ok=marker in dex
              print(marker.decode('ascii'), ok)
              if not ok: raise SystemExit('missing APK marker '+marker.decode('ascii'))
          if b'FULL_PRODUCTION_RENDER_FULL_SOURCE_FINAL_BITMAP' in dex:
              raise SystemExit('stale 12MP live full-source mode packaged')
          print('LIVEWYSIWYG1D APK PROOF PASS')
          PY

      - name: Record APK SHA256
        if: success()
        run: |
          sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk \
            | tee LIVEWYSIWYG1D_APK_SHA256.txt

      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-LIVEWYSIWYG1D-METER1600
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            LIVEWYSIWYG1D_APK_SHA256.txt
            LIVEWYSIWYG1D_VERIFY.txt
            LIVEWYSIWYG1D_APK_PROOF.txt
            LIVEWYSIWYG1D_CORE_BEFORE.sha256
            LIVEWYSIWYG1D_CORE_AFTER.sha256
            LIVEWYSIWYG1D_FROZEN_BEFORE.sha256
            LIVEWYSIWYG1D_FROZEN_AFTER.sha256

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-LIVEWYSIWYG1D-METER1600-BUILDLOG
          path: LIVEWYSIWYG1D_GRADLE.log
          if-no-files-found: ignore

# LIVEWYSIWYG1D CI trigger
