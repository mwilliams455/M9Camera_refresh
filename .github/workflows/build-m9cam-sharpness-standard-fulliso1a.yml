name: Build M9Cam STANDARD FULLISO1A

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-standard-fulliso1a]
    paths:
      - 'tools/m9_sharpness_export_fulliso_header.py'
      - 'patches/apply-m9cam-sharpness-standard-fulliso1a.py'
      - 'patches/verify-m9cam-sharpness-standard-fulliso1a.py'
      - '.github/workflows/build-m9cam-sharpness-standard-fulliso1a.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Verify patch syntax
        run: |
          python3 -m py_compile tools/m9_sharpness_export_fulliso_header.py
          python3 -m py_compile patches/apply-m9cam-sharpness-standard-fulliso1a.py
          python3 -m py_compile patches/verify-m9cam-sharpness-standard-fulliso1a.py

      - name: Replay exact UPSTREAMAXIS1A parent assembly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/build-m9cam-basishsm1p-curvedomain1c-upstreamaxis1a.yml')
          lines=wf.read_text().splitlines(); names=['Replay exact CURVEDOMAIN1B parent assembly','Apply CURVEDOMAIN1C UPSTREAMAXIS1A read-only extension']
          for idx,name in enumerate(names):
              i=lines.index('      - name: '+name)
              while i<len(lines) and lines[i].strip()!='run: |': i+=1
              i+=1; out=[]
              while i<len(lines):
                  line=lines[i]
                  if line.startswith('      - name:'): break
                  if line.startswith('          '): out.append(line[10:])
                  elif not line.strip(): out.append('')
                  else: raise SystemExit('unexpected parent indentation: '+line)
                  i+=1
              Path(f'/tmp/upstreamaxis_parent_{idx}.sh').write_text('\n'.join(out)+'\n')
          PY
          for s in /tmp/upstreamaxis_parent_*.sh; do bash "$s"; done

      - name: Assemble frozen neutral-MHC and SHARPSOURCE1C parent
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-basishsm1p-demosaicmhc1a.py "$ROOT"
          python3 patches/fix-m9cam-basishsm1p-demosaicmhc1a-lifetime1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicmhc1a.py "$ROOT"
          python3 patches/apply-m9cam-basishsm1p-demosaicab1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicab1a.py "$ROOT"
          python3 patches/apply-m9cam-basishsm1p-demosaicmhcneutral1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a.py "$ROOT"
          python3 patches/promote-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py "$ROOT"
          python3 patches/apply-m9cam-sharpness-splitdemosaic1a.py "$ROOT"
          python3 patches/verify-m9cam-sharpness-splitdemosaic1a.py "$ROOT"
          python3 patches/apply-m9cam-sharpness-closuretest1a.py "$ROOT"
          python3 patches/verify-m9cam-sharpness-closuretest1a.py "$ROOT"
          python3 patches/apply-m9cam-sharpness-closuretest1b.py "$ROOT"
          python3 patches/verify-m9cam-sharpness-closuretest1b.py "$ROOT"
          python3 patches/apply-m9cam-sharpness-sharpsource1b.py "$ROOT"
          python3 patches/verify-m9cam-sharpness-sharpsource1b.py "$ROOT"
          python3 patches/apply-m9cam-sharpness-sharpsource1b-id1.py "$ROOT"
          python3 patches/apply-m9cam-sharpness-sharpsource1c-rbanchor1a.py "$ROOT"
          python3 patches/verify-m9cam-sharpness-sharpsource1c-rbanchor1a.py "$ROOT"

      - name: Derive canonical 13x2050 Sharp bank from M9 1.216
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9sharp"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/m9sharp/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$RUNNER_TEMP/m9sharp/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$RUNNER_TEMP/m9sharp/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" --m9-out "$RUNNER_TEMP/m9sharp/m9.dec" --meta-out "$RUNNER_TEMP/m9sharp/recovery_meta.json"
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$RUNNER_TEMP/m9sharp/m9.dec" | sha256sum -c --strict
          python3 tools/m9_sharpness_export_fulliso_header.py "$RUNNER_TEMP/m9sharp/m9.dec" --out PhotonCamera/app/src/main/cpp/m9_sharp_fulliso_bank.h | tee FULLISO_BANK_VERIFY.txt
          rm -f "$RUNNER_TEMP/m9sharp/m9.upd" "$RUNNER_TEMP/m9sharp/mm.upm" "$RUNNER_TEMP/m9sharp/m9.dec"

      - name: Apply and verify STANDARD FULLISO1A
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-sharpness-standard-fulliso1a.py "$ROOT"
          python3 patches/verify-m9cam-sharpness-standard-fulliso1a.py "$ROOT" | tee STANDARD_FULLISO1A_VERIFY.txt
          mkdir -p assembled-standard-fulliso1a
          cp "$ROOT/app/src/main/cpp/m9color_jni.cpp" assembled-standard-fulliso1a/
          cp "$ROOT/app/src/main/cpp/m9_sharp_fulliso_bank.h" assembled-standard-fulliso1a/
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" assembled-standard-fulliso1a/
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" assembled-standard-fulliso1a/
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9PrimaryTimingWriter.java" assembled-standard-fulliso1a/
          cp FULLISO_BANK_VERIFY.txt STANDARD_FULLISO1A_VERIFY.txt assembled-standard-fulliso1a/
          sha256sum assembled-standard-fulliso1a/* > assembled-standard-fulliso1a/SHA256SUMS.txt

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Build debug APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/STANDARD_FULLISO1A_GRADLE.log"
      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee STANDARD_FULLISO1A_APK_SHA256.txt
      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-STANDARD-FULLISO1A-ASSEMBLED-SOURCE
          path: assembled-standard-fulliso1a/
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-STANDARD-FULLISO1A-BUILDLOG
          path: STANDARD_FULLISO1A_GRADLE.log
          if-no-files-found: ignore
      - name: Upload research APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-STANDARD-FULLISO1A-RBANCHOR1A
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            STANDARD_FULLISO1A_APK_SHA256.txt
            STANDARD_FULLISO1A_VERIFY.txt
