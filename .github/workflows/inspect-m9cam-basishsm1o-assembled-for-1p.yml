name: Inspect M9Cam BASISHSM1O assembled source for 1P

on:
  workflow_dispatch:
  push:
    branches:
      - m9nohdr1a-sourcecal2a-basishsm1p-nativesource1a

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout M9 recovery repo
        uses: actions/checkout@v4

      - name: Clone pinned PhotonCamera baseline
        run: |
          set -euo pipefail
          PHOTON_SHA=f0e6425d2509fb8ab834d5d3af593183038b778c
          git clone --depth 1 --branch dev https://github.com/eszdman/PhotonCamera.git PhotonCamera
          git -C PhotonCamera fetch --depth 1 origin "$PHOTON_SHA"
          git -C PhotonCamera checkout --detach FETCH_HEAD
          test "$(git -C PhotonCamera rev-parse HEAD)" = "$PHOTON_SHA"

      - name: Materialize validated 1O chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-basishsm1o-lumanorm030accept1a.yml')
          lines = wf.read_text().splitlines()
          target = '      - name: Apply frozen 1K chain through 1N, then narrow to 1O acceptance bank'
          try:
              i = lines.index(target)
          except ValueError:
              raise SystemExit('1P inspection: 1O apply step not found')
          while i < len(lines) and lines[i].strip() != 'run: |':
              i += 1
          if i >= len(lines):
              raise SystemExit('1P inspection: 1O run block not found')
          i += 1
          out = []
          while i < len(lines):
              line = lines[i]
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  out.append(line[10:])
              elif not line.strip():
                  out.append('')
              else:
                  raise SystemExit('1P inspection: unexpected indentation: ' + line)
              i += 1
          script = '\n'.join(out) + '\n'
          if 'apply-m9cam-basishsm1o-lumanorm030accept1a.py' not in script:
              raise SystemExit('1P inspection: extracted chain lacks 1O')
          Path('/tmp/m9_apply_1o.sh').write_text(script)
          PY
          bash /tmp/m9_apply_1o.sh

      - name: Snapshot assembled 1O source
        run: |
          set -euo pipefail
          mkdir -p assembled1o
          cp PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java assembled1o/
          cp PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9SourceCalibrationAudit1A.java assembled1o/
          cp PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Calibration.java assembled1o/
          cp PhotonCamera/app/build.gradle assembled1o/app-build.gradle
          sha256sum assembled1o/* | tee assembled1o/SHA256SUMS.txt

      - name: Upload assembled 1O source
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-BASISHSM1O-ASSEMBLED-SOURCE-FOR-1P
          path: assembled1o/
          if-no-files-found: error
