name: Build recovered M9Cam PERF3I VIRTUALBV1A SIGNEDCAL1A

on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout M9 recovery repo
        uses: actions/checkout@v4

      - name: Clone PhotonCamera dev
        run: |
          git clone --depth 1 --branch dev https://github.com/eszdman/PhotonCamera.git PhotonCamera
          git -C PhotonCamera rev-parse HEAD | tee PHOTON_UPSTREAM_COMMIT.txt

      - name: Restore M9 v0.6 foundation
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-recovery-foundation.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Restore frozen v0.6.1 exposure tune
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-recovered-v0.6.1.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply cumulative v0.7ZQ PERF3I overlay
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-v0.7-r35-parity.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify cumulative M9 seams
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-v0.7-r35.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply EXPOSUREAUDIT1A diagnostic overlay
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-exposureaudit1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify EXPOSUREAUDIT1A
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-exposureaudit1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply SCENEEXPOSURE1A signed diagnostic overlay
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-sceneexposure1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify SCENEEXPOSURE1A
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-sceneexposure1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply SCENEEXPOSURE1B quality-preserving diagnostic calibration
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-sceneexposure1b.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify SCENEEXPOSURE1B regression and diagnostic-only contract
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-sceneexposure1b.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply SCENEEXPOSURE1C near-white negative-gate diagnostic calibration
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-sceneexposure1c.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify SCENEEXPOSURE1C regression and diagnostic-only contract
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-sceneexposure1c.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply SCENEEXPOSURE1D structural low-key positive moderation
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-sceneexposure1d.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify SCENEEXPOSURE1D regressions and diagnostic-only contract
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-sceneexposure1d.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply SCENEEXPOSURE1E AE-effort tonal-adequacy moderation
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-sceneexposure1e.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify SCENEEXPOSURE1E regressions and diagnostic-only contract
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-sceneexposure1e.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply SCENEEXPOSURE1F spatial-starvation qualification
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-sceneexposure1f.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify SCENEEXPOSURE1F regressions and diagnostic-only contract
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-sceneexposure1f.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply SCENEEXPOSURE1G subject-body adequacy calibration
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-sceneexposure1g.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify SCENEEXPOSURE1G regressions and diagnostic-only contract
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-sceneexposure1g.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply SCENEEXPOSURE1H render-aware exposure calibration
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-sceneexposure1h.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify SCENEEXPOSURE1H regressions and diagnostic-only contract
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-sceneexposure1h.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply CAPTURESPLIT1A capture/render exposure split
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-capturesplit1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify CAPTURESPLIT1A diagnostic architecture
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-capturesplit1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply CAPTURESPLIT1B direct render luma and sidecar diagnostics
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-capturesplit1b.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify CAPTURESPLIT1B diagnostic architecture
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-capturesplit1b.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply CAPTURESPLIT1C render evidence and private sidecar spool
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-capturesplit1c.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify CAPTURESPLIT1C diagnostic architecture
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-capturesplit1c.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply M9NEGATIVE1A completed-RAW capture-meter diagnostics
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-m9negative1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify M9NEGATIVE1A / CAPTUREMETER1B diagnostic architecture
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-m9negative1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply M9NEGATIVE1B SCENEFINGERPRINT1A association overlay
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-m9negative1b-scenefingerprint1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify M9NEGATIVE1B SCENEFINGERPRINT1A regressions
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-m9negative1b-scenefingerprint1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply M9NEGATIVE1C SIGNEDCAL1A diagnostic calibration
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-m9negative1c-signedcal1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify M9NEGATIVE1C SIGNEDCAL1A frozen-contract regressions
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-m9negative1c-signedcal1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply VIRTUALBV1A diagnostic Leica-like BV overlay
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-virtualbv1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply VIRTUALBV1A corpus calibration
        run: python3 "$GITHUB_WORKSPACE/patches/apply-m9cam-virtualbv1a-cal1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify VIRTUALBV1A frozen-contract and direction regressions
        run: python3 "$GITHUB_WORKSPACE/patches/verify-m9cam-virtualbv1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build debug APK
        run: |
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK and upstream commit
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-v0.7ZZG-PERF3I-VIRTUALBV1A-SIGNEDCAL1A-M9NEGATIVE1C-SCENEFINGERPRINT1A-CAPTUREMETER1B-RENDERMETER1C-SIDECAR1B-recovered
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            PHOTON_UPSTREAM_COMMIT.txt
          if-no-files-found: error
