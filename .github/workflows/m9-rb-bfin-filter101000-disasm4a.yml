name: M9 R/B BFIN4A Filter101000 Disassembly

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-bfin-filter101000-disasm4a.yml'
      - 'research/bfin/BFINORACLE3D_FILTER101040_GEOMETRY_FROZEN.json'
      - 'research/bfin/BFINSCALAR3C_FILTER101040_DIRECT_PARITY_FROZEN.json'

permissions:
  contents: read

jobs:
  recover-disasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          tar -xf binutils-2.44.tar.xz
          mkdir binutils-build && cd binutils-build
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-sim >/dev/null
          make -j2 all-binutils >/dev/null
          echo "BFIN_OBJDUMP=$PWD/binutils/objdump" >> "$GITHUB_ENV"
      - name: Recover exact Leica ASMFilter_101_000_101_2 body
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/bfinfilter4a"; mkdir -p "$ROOT/evidence"
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json"
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass"
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'bfinfilter4a'; d=json.load(open(root/'pass/report.json'))
          addr=0xffa0024e; size=0x108; expected='e2f41a23716e5462d137ff5a5ee75064a4aec10ded22df61ee682901d22cbccd'; rows=[]
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py'); m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          found=None
          for i,_ in enumerate(d.get('bf561_deep',[])):
            try:
              bf0=next((root/'pass'/f'bf561_pair_{i:02d}').rglob('bf0.bin')); _,blocks=m.parse_ldr(bf0); body=m.read_overlay(blocks,addr,size); sha=hashlib.sha256(body).hexdigest(); rows.append({'pair':i,'sha256':sha,'match':sha==expected})
              if sha==expected and found is None: found=(i,body)
            except Exception as e: rows.append({'pair':i,'error':f'{type(e).__name__}: {e}'})
          (root/'evidence'/'routine_selection.json').write_text(json.dumps({'address':hex(addr),'size':size,'expected_sha256':expected,'candidates':rows},indent=2)+'\n')
          if found is None: raise SystemExit(f'canonical filter body not found: {rows}')
          i,body=found; (root/'ASMFilter_101_000_101_2.bin').write_bytes(body); (root/'evidence'/'routine_manifest.json').write_text(json.dumps({'pair':i,'address':hex(addr),'size':size,'sha256':expected},indent=2)+'\n')
          PY
          "$BFIN_OBJDUMP" -D -b binary -m bfin --adjust-vma=0xffa0024e "$ROOT/ASMFilter_101_000_101_2.bin" > "$ROOT/evidence/ASMFilter_101_000_101_2.gnu.dis.txt"
          grep -q '^ffa00354:.*RTS' "$ROOT/evidence/ASMFilter_101_000_101_2.gnu.dis.txt"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'bfinfilter4a'; p=root/'evidence'/'ASMFilter_101_000_101_2.gnu.dis.txt'
          meta={'schema':'m9.bfin4a.filter101000-disasm.v1','address':'0xffa0024e','size':264,'sha256':'e2f41a23716e5462d137ff5a5ee75064a4aec10ded22df61ee682901d22cbccd','disassembly_sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (root/'evidence'/'disasm_meta.json').write_text(json.dumps(meta,indent=2)+'\n'); print(json.dumps(meta,indent=2))
          PY
      - name: Publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-BFIN4A-FILTER101000-DISASM
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/bfinfilter4a/evidence/*
      - name: Remove firmware and routine binary
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/bfinfilter4a/pass" "$RUNNER_TEMP/bfinfilter4a/m9.upd" "$RUNNER_TEMP/bfinfilter4a/mm.upm" "$RUNNER_TEMP/bfinfilter4a/m9.dec" "$RUNNER_TEMP/bfinfilter4a/ASMFilter_101_000_101_2.bin"
