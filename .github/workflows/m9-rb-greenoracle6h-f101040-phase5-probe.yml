name: M9 R/B GREENORACLE6H 101040 Phase5 Probe

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-greenoracle6h-f101040-phase5-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Blackfin toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          curl --fail --location --retry 4 --retry-all-errors -o gdb-17.2.tar.xz https://ftp.gnu.org/gnu/gdb/gdb-17.2.tar.xz
          tar -xf binutils-2.44.tar.xz; tar -xf gdb-17.2.tar.xz
          mkdir binutils-build && cd binutils-build
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-sim >/dev/null
          make -j2 all-binutils all-gas all-ld >/dev/null
          echo "BFIN_AS=$PWD/gas/as-new" >> "$GITHUB_ENV"
          echo "BFIN_LD=$PWD/ld/ld-new" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"; mkdir gdb-build && cd gdb-build
          ../gdb-17.2/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gdbserver >/dev/null
          make -j2 all-sim >/dev/null
          SIM=$(find "$PWD" -type f \( -path '*/sim/bfin/run' -o -name 'bfin-elf-run' \) -perm -111 | head -1)
          echo "BFIN_SIM=$SIM" >> "$GITHUB_ENV"

      - name: Recover exact 101040 body
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/green6h"; mkdir -p "$ROOT/evidence"
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json" >/dev/null
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass" >/dev/null
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'green6h'
          report=json.load(open(root/'pass/report.json'))
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py')
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          addr,size,sha=0xffa000be,400,'c09c342ca374a32eb08b86b8136c27af403ccad5eba57aa25aee6c0526e30389'
          for i,_ in enumerate(report.get('bf561_deep',[])):
            try:
              bf0=next((root/'pass'/f'bf561_pair_{i:02d}').rglob('bf0.bin'))
              _,blocks=m.parse_ldr(bf0); body=m.read_overlay(blocks,addr,size)
              if len(body)==size and hashlib.sha256(body).hexdigest()==sha:
                (root/'ASMFilter_101_040_101_An.bin').write_bytes(body)
                (root/'evidence'/'body.json').write_text(json.dumps({'pair':i,'sha256':sha},indent=2)+'\n'); break
            except Exception: pass
          else: raise SystemExit('canonical body not found')
          PY

      - name: Execute phase0 and phase2 exact helper
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/green6h"; cd "$ROOT"
          cp "$GITHUB_WORKSPACE/research/bfin/filter101040_oracle_observe_phase.s" .
          python3 - <<'PY'
          import pathlib
          # Broad deterministic source region; include high-bit values.
          vals=[((i*977)+((i*i*31)&0xffff))&0xffff for i in range(2048)]
          pathlib.Path('source_data.inc').write_text(''.join(f'.short 0x{v:04x}\n' for v in vals))
          PY
          cat > oracle.ld <<'LDS'
          ENTRY(_start)
          SECTIONS {
            . = 0x2000; .text : { *(.text.start) }
            . = 0x4000; .source : { *(.source) }
            . = 0x7000; .out1 : { *(.out1) }
            . = 0x8000; .out2 : { *(.out2) }
            . = 0x9000; .stack : { *(.stack) }
          }
          LDS
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess,time
          ev=pathlib.Path('evidence'); out={}
          for src in (0x4400,0x4402):
            name=f'phase_{src&2}'
            subprocess.run([os.environ['BFIN_AS'],'--defsym','INNER=6','--defsym','OUTER=5','--defsym','STRIDE=16','--defsym',f'SRCBASE={src}','filter101040_oracle_observe_phase.s','-o',name+'.o'],check=True)
            subprocess.run([os.environ['BFIN_LD'],'-T','oracle.ld',name+'.o','-o',name+'.elf'],check=True)
            t=time.monotonic(); p=subprocess.run([os.environ['BFIN_SIM'],'--profile-insn',name+'.elf'],capture_output=True,text=True); dt=time.monotonic()-t
            (ev/(name+'.stdout.txt')).write_text(p.stdout); (ev/(name+'.stderr.txt')).write_text(p.stderr)
            vals=re.findall(r'DBG\s*:\s*R0\s*=\s*0x([0-9a-fA-F]+)',p.stdout)
            out[name]={'returncode':p.returncode,'elapsed_seconds':dt,'dbg_count':len(vals),'completed':p.returncode==0 and len(vals)==128}
          (ev/'phase5_probe.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if not all(v['completed'] for v in out.values()): raise SystemExit('phase probe failed')
          PY

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-GREENORACLE6H-101040-PHASE5-PROBE
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/green6h/evidence/*

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/green6h/pass" "$RUNNER_TEMP/green6h/m9.upd" "$RUNNER_TEMP/green6h/mm.upm" "$RUNNER_TEMP/green6h/m9.dec" "$RUNNER_TEMP/green6h"/*.bin "$RUNNER_TEMP/green6h"/*.o "$RUNNER_TEMP/green6h"/*.elf
