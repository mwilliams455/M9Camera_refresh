name: Build M9Cam LEICARB1B RBANCHOR1A Control

on:
  workflow_dispatch:
  push:
    branches:
      - research/sharpness-rbclosure1d-packedphase1a
    paths:
      - '.github/workflows/build-m9cam-leicarb1b-rbanchor1a-control.yml'
      - 'patches/apply-m9cam-leicarb1b-rbanchor1a-control.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify control patch syntax
        run: python3 -m py_compile patches/apply-m9cam-leicarb1b-rbanchor1a-control.py

      - name: Replay exact SHARPSOURCE1C RBANCHOR1A assembled baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-sharpness-sharpsource1c-rbanchor1a.yml')
          lines = wf.read_text().splitlines()
          names = [
              'Verify patch syntax',
              'Replay exact UPSTREAMAXIS1A parent assembly',
              'Assemble frozen neutral-MHC parent',
              'Assemble SHARPSOURCE1C RBANCHOR1A',
          ]
          for idx, name in enumerate(names):
              target = '      - name: ' + name
              i = lines.index(target)
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit('baseline run block missing: ' + name)
              i += 1
              out = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif not line.strip():
                      out.append('')
                  else:
                      raise SystemExit('unexpected baseline indentation: ' + line)
                  i += 1
              Path(f'/tmp/leicarb1b_parent_{idx}.sh').write_text('\n'.join(out) + '\n')
          PY
          for s in /tmp/leicarb1b_parent_*.sh; do
            echo "===== replay $s ====="
            bash "$s"
          done

      - name: Snapshot exact parent native SHA
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          CPP="$ROOT/app/src/main/cpp/m9color_jni.cpp"
          sha256sum "$CPP" | tee LEICARB1B_NATIVE_BEFORE_SHA256.txt

      - name: Apply workspace-only LEICARB1B control label
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-leicarb1b-rbanchor1a-control.py "$ROOT"
          grep -n 'SHARPNESS_SHARPSOURCE1C_RBANCHOR1A_ID\|const int dr=\|const int db=\|m9SharpSourceLeicaGreen14\|m9ClosureSharpIso160Standard' \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" | tee LEICARB1B_NATIVE_ANCHORS.txt
          grep -n 'RBANCHOR1A_sharpLeicaGreen_plus_frozenMHC_color_differences_proxy\|LEICARB1B_RBANCHOR1A_CONTROL\|leicaRbIsolationPixelPath\|leicaRbIsolationPurpose' \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9PrimaryTimingWriter.java" | tee LEICARB1B_TIMING_ANCHORS.txt

      - name: Guard pixel-path isolation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          CPP="$ROOT/app/src/main/cpp/m9color_jni.cpp"
          TIMING="$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9PrimaryTimingWriter.java"

          # Native path must remain the proven SHARPSOURCE1C-RBANCHOR1A control.
          grep -q 'SHARPNESS_SHARPSOURCE1C_RBANCHOR1A_ID' "$CPP"
          grep -q 'const int sg=static_cast<int>(closureSharp14\[p\]);' "$CPP"
          grep -q 'const int mg=static_cast<int>(m9ClosureQ14(base\[1\]));' "$CPP"
          grep -q 'const int dr=static_cast<int>(m9ClosureQ14(base\[0\]))-mg;' "$CPP"
          grep -q 'const int db=static_cast<int>(m9ClosureQ14(base\[2\]))-mg;' "$CPP"
          grep -q 'm9SharpSourceLeicaGreen14' "$CPP"
          grep -q 'm9ClosureSharpIso160Standard' "$CPP"
          grep -q 'x>=9 && x<width-9 && y>=9 && y<height-9' "$CPP"

          # LEICARB1A adapter must be absent from the native pixel path.
          if grep -q 'LEICARB1A_SHARPGREEN_RGGB_BEGIN\|m9LeicaRbEstimate(' "$CPP"; then
            echo 'LEICARB1A adapter unexpectedly present in LEICARB1B control' >&2
            exit 1
          fi

          # Sidecar must identify the isolation control without changing pixel arithmetic.
          grep -q 'RBANCHOR1A_sharpLeicaGreen_plus_frozenMHC_color_differences_proxy' "$TIMING"
          grep -q 'LEICARB1B_RBANCHOR1A_CONTROL' "$TIMING"
          grep -q 'SHARPSOURCE1C_RBANCHOR1A_exact_parent_no_Interp1_adapter' "$TIMING"

          # Downstream photographic stages stay frozen.
          grep -q 'COLORNATIVE2A' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          grep -q 'JPEG_QUALITY = 95' "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"

          sha256sum "$CPP" | tee LEICARB1B_NATIVE_AFTER_SHA256.txt
          before=$(awk '{print $1}' LEICARB1B_NATIVE_BEFORE_SHA256.txt)
          after=$(awk '{print $1}' LEICARB1B_NATIVE_AFTER_SHA256.txt)
          test "$before" = "$after" || { echo 'native pixel source changed by control label patch' >&2; exit 1; }

          mkdir -p leicarb1b-evidence
          cp LEICARB1B_NATIVE_BEFORE_SHA256.txt LEICARB1B_NATIVE_AFTER_SHA256.txt \
             LEICARB1B_NATIVE_ANCHORS.txt LEICARB1B_TIMING_ANCHORS.txt leicarb1b-evidence/
          sha256sum "$TIMING" > leicarb1b-evidence/TIMING_SHA256.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build LEICARB1B control debug APK
        shell: bash
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/LEICARB1B_GRADLE.log"

      - name: Record APK SHA256
        if: success()
        run: sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk | tee LEICARB1B_APK_SHA256.txt

      - name: Upload isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-LEICARB1B-RBANCHOR1A-CONTROL-EVIDENCE
          path: |
            leicarb1b-evidence/
            LEICARB1B_GRADLE.log
          if-no-files-found: ignore

      - name: Upload research APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-LEICARB1B-RBANCHOR1A-CONTROL
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            LEICARB1B_APK_SHA256.txt
