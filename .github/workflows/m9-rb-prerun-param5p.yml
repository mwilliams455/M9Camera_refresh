name: M9 R/B RBCLOSURE5P PreRun Parameter Gate

on:
  workflow_dispatch:
  push:
    branches: [research/sharpness-rbclosure1d-packedphase1a]
    paths:
      - '.github/workflows/m9-rb-prerun-param5p.yml'

permissions:
  contents: read

jobs:
  prerun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl xz-utils
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 4 -o b.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          tar -xf b.tar.xz
          mkdir b && cd b
          ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim >/dev/null
          make -j4 all-binutils >/dev/null
          echo "BFIN_OBJDUMP=$PWD/binutils/objdump" >> "$GITHUB_ENV"

      - name: Recover exact pre-Run helper
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rb5p"
          mkdir -p "$ROOT/evidence"
          curl -fsSL --retry 4 -o "$ROOT/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl -fsSL --retry 4 -o "$ROOT/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$ROOT/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$ROOT/mm.upm" | sha256sum -c --strict
          python3 tools/recover_m9_key_from_shared_body.py "$ROOT/m9.upd" "$ROOT/mm.upm" --m9-out "$ROOT/m9.dec" --meta-out "$ROOT/evidence/recovery_meta.json" >/dev/null
          echo '4f962bb7799ad9a6745ab36c2a3ba59757bfcbd205f50472ddf1b904a5756d20  '"$ROOT/m9.dec" | sha256sum -c --strict
          python3 tools/m9_sharpnessforensics1a_firmwarepass.py "$ROOT/m9.dec" --out "$ROOT/pass" >/dev/null
          python3 - <<'PY'
          import json,os,pathlib,importlib.util,sys,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb5p'; d=json.load(open(root/'pass/report.json')); cand=[]
          for i,x in enumerate(d.get('bf561_deep',[])):
              det=x.get('detail',{}) if isinstance(x.get('detail'),dict) else {}; t=det.get('targets',{}) if isinstance(det,dict) else {}
              if x.get('covered',0)>0 and 'error' not in det: cand.append((sum(k in t for k in ('Run','Process_Sharpness','Process_Noise','Process_WB')),x.get('covered',0),i))
          cand.sort(reverse=True); pair=cand[0][2]; pdir=root/'pass'/f'bf561_pair_{pair:02d}'; bf0=next(pdir.rglob('bf0.bin')); mp=next(pdir.rglob('bf0.map'))
          spec=importlib.util.spec_from_file_location('base','tools/m9_sharpnessforensics1a.py'); m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          _,blocks=m.parse_ldr(bf0); syms=m.parse_map(mp); addr=0xfeb11430
          exact=[]; cover=[]
          for s in syms:
              try:a=int(s['addr']);z=int(s.get('size',0))
              except Exception:continue
              if a==addr:exact.append({'name':s.get('name'),'addr':a,'size':z})
              if z>0 and a<=addr<a+z:cover.append({'name':s.get('name'),'addr':a,'size':z})
          chosen=next((s for s in exact if s['size']>0),None) or next((s for s in cover if s['size']>0),None)
          if not chosen: raise SystemExit('no sized map symbol for 0xfeb11430')
          body=m.read_overlay(blocks,chosen['addr'],chosen['size']); (root/'helper.bin').write_bytes(body)
          rep={'schema':'m9.rbclosure5p.setup.v1','selected_pair':pair,'target':'0xfeb11430','exact_symbols':[{**s,'addr':f"0x{s['addr']:08x}"} for s in exact],'covering_symbols':[{**s,'addr':f"0x{s['addr']:08x}"} for s in cover],'chosen':{'name':chosen['name'],'addr':f"0x{chosen['addr']:08x}",'size':chosen['size'],'sha256':hashlib.sha256(body).hexdigest()},'proven_callsite':'StartInterpolation_Jolos 0xffa124cc passes R2=g_L2Parameter; next control call using that block is Run at 0xffa124d4'}
          (root/'setup.json').write_text(json.dumps(rep,indent=2)+'\n'); (root/'symbols.json').write_text(json.dumps(syms,indent=2)+'\n'); print(json.dumps(rep,indent=2))
          PY
          BASE=$(python3 -c 'import json; print(json.load(open("'$ROOT'/setup.json"))["chosen"]["addr"])')
          "$BFIN_OBJDUMP" -D -b binary -m bfin --adjust-vma="$BASE" "$ROOT/helper.bin" > "$ROOT/helper.dis"

      - name: Analyze R2 parameter use
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rb5p"
          python3 - <<'PY'
          import os,pathlib,re,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rb5p'; setup=json.load(open(root/'setup.json')); syms=json.load(open(root/'symbols.json'))
          rx=re.compile(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+(.+)$',re.I); tr=re.compile(r'0x0?([0-9a-f]{8})',re.I)
          ins=[]
          for line in (root/'helper.dis').read_text(errors='replace').splitlines():
              m=rx.match(line)
              if m:ins.append({'addr':int(m.group(1),16),'asm':m.group(2).strip()})
          def syminfo(addr):
              ex=[];cv=[]
              for s in syms:
                  try:a=int(s['addr']);z=int(s.get('size',0))
                  except Exception:continue
                  if a==addr:ex.append({'name':s.get('name'),'addr':f'0x{a:08x}','size':z})
                  if z>0 and a<=addr<a+z:cv.append({'name':s.get('name'),'addr':f'0x{a:08x}','size':z})
              return {'exact':ex,'covering':cv}
          aliases={'R2'}; alias_events=[]; derefs=[]; calls=[]; defs=[]
          for x in ins:
              u=x['asm'].upper()
              # simple assignment aliases such as P5 = R2, R4 = R2, P0 = R4
              m=re.search(r'\b([RP][0-7]?)\s*=\s*([RP][0-7]?)\b',u)
              if m:
                  dst,src=m.group(1),m.group(2)
                  if src in aliases and dst not in aliases:
                      aliases.add(dst); alias_events.append({'addr':f"0x{x['addr']:08x}",'asm':x['asm'],'new_alias':dst,'from':src})
                  elif dst in aliases and src not in aliases:
                      defs.append({'addr':f"0x{x['addr']:08x}",'asm':x['asm'],'overwrites_alias':dst})
              for a in list(aliases):
                  if re.search(r'\['+re.escape(a)+r'(?:\s*[+\-][^\]]+)?\]',u):
                      direction='store' if re.search(r'\[[^\]]+\]\s*=',u) else ('load' if re.search(r'=\s*(?:B|W)?\[[^\]]+\]',u) else 'other')
                      derefs.append({'addr':f"0x{x['addr']:08x}",'asm':x['asm'],'alias':a,'direction':direction})
              if 'CALL ' in u:
                  mt=tr.search(x['asm']); tgt=int(mt.group(1),16) if mt else None
                  calls.append({'addr':f"0x{x['addr']:08x}",'asm':x['asm'],'target':f'0x{tgt:08x}' if tgt is not None else None,'target_symbols':syminfo(tgt) if tgt is not None else None,'aliases_known':sorted(aliases)})
          word0_writes=[]
          for q in derefs:
              # Flag direct base-pointer stores with no explicit offset or +0.
              if q['direction']=='store' and re.search(r'\['+re.escape(q['alias'])+r'\]\s*=',q['asm'].upper()): word0_writes.append(q)
          rep={'schema':'m9.rbclosure5p.prerun-parameter-gate.v1','setup':setup,'instructions':[{'addr':f"0x{x['addr']:08x}",'asm':x['asm']} for x in ins],'aliases_seen':sorted(aliases),'alias_events':alias_events,'alias_overwrites':defs,'dereferences_via_aliases':derefs,'direct_base_word0_writes':word0_writes,'calls':calls,'closure_rule':'If no direct/derived write can reach descriptor word0 and all calls receiving descriptor aliases are resolved read-only or absent, the 0xffffffff word0 written by Init survives to Run.'}
          raw=(json.dumps(rep,indent=2)+'\n').encode(); (root/'evidence'/'prerun_parameter_gate.json').write_bytes(raw)
          with open(root/'evidence'/'prerun_parameter_gate.txt','w') as f:
              f.write('SETUP\n'+json.dumps(setup,indent=2)+'\n\nBODY\n')
              for x in ins:f.write(f"0x{x['addr']:08x}  {x['asm']}\n")
              f.write('\nALIAS EVENTS\n'); [f.write(json.dumps(q)+'\n') for q in alias_events]
              f.write('\nDEREFS\n'); [f.write(json.dumps(q)+'\n') for q in derefs]
              f.write('\nDIRECT WORD0 WRITES\n'); [f.write(json.dumps(q)+'\n') for q in word0_writes]
              f.write('\nCALLS\n'); [f.write(json.dumps(q)+'\n') for q in calls]
          (root/'evidence'/'prerun_parameter_gate.sha256.txt').write_text(hashlib.sha256(raw).hexdigest()+'  prerun_parameter_gate.json\n')
          print((root/'evidence'/'prerun_parameter_gate.txt').read_text())
          PY
          sha256sum "$ROOT/evidence"/* > "$ROOT/evidence/SHA256SUMS.txt"

      - name: Upload final mutation-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: M9-RB-RBCLOSURE5P-PRERUN-PARAMETER-GATE
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/rb5p/evidence/*

      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/rb5p/pass" "$RUNNER_TEMP/rb5p/m9.upd" "$RUNNER_TEMP/rb5p/mm.upm" "$RUNNER_TEMP/rb5p/m9.dec" "$RUNNER_TEMP/rb5p/helper.bin" "$RUNNER_TEMP/rb5p/helper.dis" "$RUNNER_TEMP/rb5p/setup.json" "$RUNNER_TEMP/rb5p/symbols.json"
