name: Build M9Cam 2.17 DNGPROFILE1A
on:
  workflow_dispatch:
  push:
    branches: [research/m9-dngprofile1a]
    paths:
      - patches/dngprofile1a/**
      - .github/workflows/build-m9cam-dngprofile1a.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: m9-dngprofile1a
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble per-capture embedded M9 profiles
        run: python3 patches/dngprofile1a/assemble.py PhotonCamera
      - name: Validate production profile and RAW transport
        run: |
          python3 -m pip install numpy tifffile
          python3 patches/dngprofile1a/verify_profile.py PhotonCamera PROFILE_TESTS
          python3 patches/dngnoisemeta1a/verify_writer.py PhotonCamera WRITER_TESTS
          python3 patches/dngcolormeta1a/verify_color.py PhotonCamera COLOR_TESTS
      - name: Build and retain accepted RAW and metadata regression gates
        working-directory: PhotonCamera
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --tests '*M9DngColorMetadataTest' --tests '*M9DngNoiseProfileTest' --tests '*M9DngNoiseStageTest' --tests '*M9DngExportMetadataTest' --tests '*M9RenderDiagnosticsTest' --tests '*M9Upstream2RRawPackingTest' --stacktrace
      - uses: actions/download-artifact@v4
        with:
          name: M9Cam-2.16-DNGCOLORMETA1A
          run-id: 36858015752
          github-token: ${{ github.token }}
          path: CONTROL
      - name: Preserve all native renderer binaries and verify signed APK
        run: python3 patches/dngprofile1a/package.py PhotonCamera CONTROL/M9Cam_2.16_DNGCOLORMETA1A.apk "$ANDROID_HOME/build-tools/35.0.0" DELIVERY
      - uses: actions/upload-artifact@v4
        with:
          name: M9Cam-2.17-DNGPROFILE1A
          path: DELIVERY/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M9-DNGPROFILE1A-TEST-RESULTS
          path: |
            PhotonCamera/app/build/test-results/testDebugUnitTest/
            PROFILE_TESTS/PROFILE_VERIFICATION.json
            WRITER_TESTS/WRITER_VERIFICATION.json
            COLOR_TESTS/COLOR_VERIFICATION.json
