name: Build M9Cam M9LIVEGL1E Color Isolate

on:
  workflow_dispatch:
  pull_request:
    branches: [research/m9livegl1d-illuminantcolor]
    paths:
      - 'patches/apply-m9cam-m9livegl1e-colorisolate.py'
      - 'patches/verify-m9cam-m9livegl1e-colorisolate.py'
      - '.github/workflows/build-m9cam-m9livegl1e-colorisolate.yml'
  push:
    branches: [research/m9livegl1e-colorisolate]
    paths:
      - 'patches/apply-m9cam-m9livegl1e-colorisolate.py'
      - 'patches/verify-m9cam-m9livegl1e-colorisolate.py'
      - '.github/workflows/build-m9cam-m9livegl1e-colorisolate.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify GL1E patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-m9livegl1e-colorisolate.py
          python3 -m py_compile patches/verify-m9cam-m9livegl1e-colorisolate.py

      - name: Replay exact M9LIVEGL1D assembled baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/build-m9cam-m9livegl1d-illuminantcolor.yml')
          lines=wf.read_text().splitlines()
          names=[
              'Verify GL1D patch syntax',
              'Replay exact M9LIVEGL1C assembled baseline',
              'Freeze exact still M9 renderer before GL1D',
              'Apply illuminant-aware color transform',
              'Prove exact still M9 renderer unchanged',
          ]
          for idx,name in enumerate(names):
              target='      - name: '+name
              if target not in lines:
                  raise SystemExit('GL1D replay block missing: '+name)
              i=lines.index(target)
              while i<len(lines) and lines[i].strip()!='run: |':
                  i+=1
              if i>=len(lines):
                  raise SystemExit('GL1D run block missing: '+name)
              i+=1
              out=[]
              while i<len(lines):
                  line=lines[i]
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif not line.strip():
                      out.append('')
                  else:
                      raise SystemExit('unexpected GL1D indentation: '+line)
                  i+=1
              Path(f'/tmp/m9livegl1e_parent_{idx:02d}.sh').write_text('\n'.join(out)+'\n')
          PY
          for s in /tmp/m9livegl1e_parent_*.sh; do
            echo "=== replay $s ==="
            bash "$s"
          done

      - name: Freeze exact still M9 renderer before GL1E
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9EdgePlacementBestFit2AController.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java" \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > M9LIVEGL1E_STILL_BEFORE.sha256

      - name: Apply color isolation control
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          python3 patches/apply-m9cam-m9livegl1e-colorisolate.py "$ROOT"
          python3 patches/verify-m9cam-m9livegl1e-colorisolate.py "$ROOT" \
            | tee M9LIVEGL1E_VERIFY.txt

      - name: Prove exact still M9 renderer unchanged
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          sha256sum \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9EdgePlacementBestFit2AController.java" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java" \
            "$ROOT/app/src/main/cpp/m9color_jni.cpp" \
            "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9TargetFirmwareCalibration.java" \
            "$ROOT/app/src/main/assets/m9/m9_curve02_firmware.bin" \
            > M9LIVEGL1E_STILL_AFTER.sha256
          diff -u M9LIVEGL1E_STILL_BEFORE.sha256 M9LIVEGL1E_STILL_AFTER.sha256

      - name: Snapshot GL1E sources
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/assembled-m9livegl1e"
          mkdir -p "$OUT"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/capture/CaptureController.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/ui/camera/CameraFragment.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/viewfinder/GLPreview.java" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/viewfinder/MainRenderer.java" "$OUT/"
          cp "$ROOT/app/src/main/assets/shaders/preview/main_fs.glsl" "$OUT/"
          cp M9LIVEGL1E_VERIFY.txt "$OUT/"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate runner Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "\${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "\${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then exit 1; fi
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build M9LIVEGL1E APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/M9LIVEGL1E_GRADLE.log"

      - name: Verify packaged GL1E contract
        if: success()
        run: |
          set -euo pipefail
          APK="$(find PhotonCamera/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          rm -rf /tmp/m9livegl1e-apk
          mkdir -p /tmp/m9livegl1e-apk
          unzip -q "$APK" -d /tmp/m9livegl1e-apk
          python3 - <<'PY' | tee M9LIVEGL1E_APK_PROOF.txt
          from pathlib import Path
          root=Path('/tmp/m9livegl1e-apk')
          mainfs=root/'assets/shaders/preview/main_fs.glsl'
          if not mainfs.exists():
              raise SystemExit('main preview shader missing')
          t=mainfs.read_text()
          start=t.find('vec3 m9DisplayTransform(vec3 photonSrgb, vec2 uv)')
          end=t.find('\n}', start)
          if start < 0 or end < 0:
              raise SystemExit('GL1E transform missing')
          transform=t[start:end+2]
          required=(
              'M9LIVEGL1E_COLORISOLATE',
              'linear *= uM9ExposureScale1B',
              'linear = tonePlacement1C(linear)',
              'linear *= falloffGain1C(uv)',
              'linear * uM9DisplayGain',
              'curve02M9(toned1E.r)',
          )
          forbidden=(
              'sourceToM9Target1D(linear)',
              'sat2M9(linear)',
              'tungstenGuard1D(',
          )
          for marker in required:
              ok=marker in transform
              print('required', marker, ok)
              if not ok:
                  raise SystemExit('GL1E required transform marker missing '+marker)
          for marker in forbidden:
              ok=marker not in transform
              print('bypassed', marker, ok)
              if not ok:
                  raise SystemExit('GL1E forbidden colour operation active '+marker)
          dex=b''.join(p.read_bytes() for p in sorted(root.glob('classes*.dex')))
          for marker in (
              b'M9LIVEGL1E_COLORISOLATE',
              b'M9LIVEGL1B_EXPOSUREINTENT',
              b'Photon_GL_IsoExpoSelector_intended_pair'):
              ok=marker in dex
              print(marker.decode('ascii'), ok)
              if not ok:
                  raise SystemExit('DEX marker missing '+marker.decode('ascii'))
          print('M9LIVEGL1E APK PROOF PASS')
          PY

      - name: Record APK SHA256
        if: success()
        run: |
          sha256sum PhotonCamera/app/build/outputs/apk/debug/*.apk \
            | tee M9LIVEGL1E_APK_SHA256.txt

      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M9Cam-M9LIVEGL1E-COLORISOLATE
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            M9LIVEGL1E_APK_SHA256.txt
            M9LIVEGL1E_VERIFY.txt
            M9LIVEGL1E_APK_PROOF.txt
            M9LIVEGL1E_STILL_BEFORE.sha256
            M9LIVEGL1E_STILL_AFTER.sha256

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-M9LIVEGL1E-ASSEMBLED-SOURCE
          path: assembled-m9livegl1e/
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M9-M9LIVEGL1E-BUILDLOG
          path: M9LIVEGL1E_GRADLE.log
          if-no-files-found: ignore
